name: Build WyldBound

# Runs whenever WyldBound.html (or anything else) is uploaded, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wyldbound
  cancel-in-progress: true

jobs:
  # 1) Home Screen web app -> GitHub Pages
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 tools/prepare.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # 2) iPhone app (.ipa) for SideStore -> Releases page
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare game files and icon
        run: |
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          python3 tools/prepare.py
      - name: Build app (unsigned; SideStore signs it with your Apple ID)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/WyldBoundApp/WyldBound.xcodeproj \
            -target WyldBound \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package WyldBound.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/WyldBound.app Payload/
          zip -qry WyldBound.ipa Payload
          ls -lh WyldBound.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: WyldBound-ipa
          path: WyldBound.ipa

  # 3) Android app (.apk)
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 tools/prepare.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/wyldbound.keystore
            echo "WYLD_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "Using the saved signing key."
          else
            # No saved key yet: make a temporary one. (Updates built this way won't install over each other.)
            P=$(openssl rand -hex 12)
            keytool -genkeypair -keystore android/app/wyldbound.keystore -alias wyldbound -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=WyldBound" >/dev/null 2>&1
            echo "::add-mask::$P"
            echo "WYLD_KS_PASS=$P" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_B64 secret set; built with a temporary signing key."
          fi
      - name: Build APK
        run: |
          cd android
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../WyldBound.apk
          ls -lh ../WyldBound.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WyldBound-apk
          path: WyldBound.apk

  # 4) Publish both apps on the Releases page (tag "latest")
  release:
    needs: [ipa, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/WyldBound.ipa out/WyldBound.apk \
            --title "WyldBound (build ${{ github.run_number }})" \
            --notes "iPhone: download WyldBound.ipa and add it in SideStore (My Apps → +). Android: download WyldBound.apk on your phone and open it to install."
