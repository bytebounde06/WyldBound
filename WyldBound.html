*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#screen{display:block;width:100%;image-rendering:pixelated;background:#000}
#brand{display:none}

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

FAMILIES.forEach((f,fi)=>{
  const n=f.names.length;let seed=hashStr(f.names[0]);
  const pv=f.from?SP_BY[f.from]:null;
  let bst;
  if(pv)bst=[Math.min(545,pv.bst+(pv.stage===0?150:85))];
  else if(n===3) bst=f.early?[195,205,395]:f.rar==='s'?[318,405,530]:f.rar==='r'?[300,420,600]:[300,405,520];
  else if(n===2) bst=f.rar==='r'?[355,500]:f.rar==='u'?[340,490]:[320,470];
  else bst=[{c:400,u:455,r:540,L:620,M:600}[f.rar]];
  if(f.rar==='L'&&/Zephyrion|Glaciaris|Pyraxis|Stormmane|Embermane|Rainmane|Granitus|Frostus|Ferrus/.test(f.names[0]))bst=[580];
  if(/Psytron|Leviamar|Solaurex|Terravast|Leviathos|Abyssion/.test(f.names[0]))bst=[680];
  const rng=mulberry32(seed^0x9e37);
  const w=ARCH[f.arch].map(v=>v*(.88+rng()*.24));
  const plans=f.plan.split(';');
  const first=SPECIES.length;
  f.names.forEach((name,i)=>{
    const types=(f.types[i]||f.types[f.types.length-1]).split('/');
    const sw=w.reduce((a,b)=>a+b,0);
    const base=w.map(v=>Math.max(10,Math.round(bst[i]*v/sw)));
    const catchRate=f.rar==='L'||f.rar==='M'?3:f.rar==='r'||f.rar==='s'?45:pv?45:i===0?(f.rar==='u'?120:255):i===1?(f.rar==='u'?60:120):45;
    const sp={id:SPECIES.length,num:SPECIES.length+1,name,types,base,fam:fi,stage:pv?pv.stage+1:i,stages:pv?pv.stages+1:n,rar:f.rar,region:f.region,
      plan:plans[i]||plans[plans.length-1],early:!!f.early,seed:pv?pv.seed:seed,legs:f.legs||(pv?pv.legs:1),bst:bst[i],baseExp:Math.max(36,Math.round(bst[i]*bst[i]/1250)),catchRate,
      growth:(f.rar==='L'||f.rar==='M')?'slow':'mf',evo:null,prevo:pv?pv.id:(i>0?first+i-1:null)};
    if(pv&&!f.plan)sp.plan=pv.plan;
    const hab=HABITAT[sp.plan]||'lives in the wild';
    sp.desc=`${name} ${hab}. ${TYPE_LORE[types[0]][0].toUpperCase()+TYPE_LORE[types[0]].slice(1)}${types[1]?', and '+TYPE_LORE[types[1]]:''}.`;
    SPECIES.push(sp);SP_BY[name]=sp;
  });
  for(let i=0;i<n-1;i++) SPECIES[first+i].evo={to:first+i+1,lvl:f.evo[i]};
  if(pv)pv.evo={to:first,lvl:f.lvl};
});

// learnsets
function buildLearnset(sp){
  const r=mulberry32(sp.seed+7);const L=[];
  const add=(lv,name)=>{const m=MOVE_BY[name];if(m&&!L.some(e=>e[1]===m.id))L.push([lv,m.id]);};
  const phys=sp.base[1]>=sp.base[3];
  add(1,phys?'Bump':'Swipe');add(1,r()<.5?'Snarl Down':'Hard Stare');
  const pool=t=>t==='Normal'?['Quick Dash','Ram','Heavy Press','Rampage'].map(n=>MOVE_BY[n]):MOVES.filter(m=>m.type===t&&m.pow>0).sort((a,b)=>a.pow-b.pow);
  const stat=t=>MOVES.filter(m=>m.type===t&&m.pow===0);
  const [t1,t2]=sp.types;
  const lv1=sp.early&&sp.stage<2?[1]:sp.rar==='s'?[7,11,19,30,41,52]:[5,11,19,30,41,52]; // starters learn their first type move at Lv7 (fair first rival battle)
  pool(t1).forEach((m,i)=>{if(i<lv1.length)add(lv1[i],m.name);});
  if(t2){[8,16,26,37,48].forEach((lv,i)=>{const p=pool(t2);if(p[i])add(lv,p[i].name);});}
  const s1=stat(t1);if(s1.length)add(sp.early&&sp.stage===1?7:14,s1[Math.floor(r()*s1.length)].name);
  if(t2){const s2=stat(t2);if(s2.length)add(23,s2[Math.floor(r()*s2.length)].name);}
  if(t1!=='Normal'&&t2!=='Normal')add(17,'Ram');
  add(27,phys?'Focus Up':'Brace');
  add(34,'Rest Up');
  L.sort((a,b)=>a[0]-b[0]);return L;
}
SPECIES.forEach(sp=>sp.learn=buildLearnset(sp));

// ===================== MONSTER INSTANCES =====================
function expFor(sp,l){return sp.growth==='slow'?Math.floor(5*l*l*l/4):l*l*l;}
function calcStats(m){const sp=SPECIES[m.sid];m.stats=sp.base.map((b,i)=>i===0?Math.floor((2*b+m.ivs[i])*m.lvl/100)+m.lvl+10:Math.floor((2*b+m.ivs[i])*m.lvl/100)+5);}
let UID=Date.now()%100000;
function makeMon(sid,lvl){
  const sp=SPECIES[sid];
  const m={uid:++UID,sid,lvl,exp:expFor(sp,lvl),ivs:[0,0,0,0,0,0].map(()=>Math.floor(Math.random()*32)),moves:[],status:null,slp:0,hp:0};
  const known=[];sp.learn.forEach(e=>{if(e[0]<=lvl&&!known.includes(e[1]))known.push(e[1]);});
  // pick up to 3 of the strongest attacks (favoring own types) plus the newest status move
  const sp_=SPECIES[sid];const dmg=known.filter(id=>MOVES[id].pow>0).sort((a,b)=>{const va=MOVES[a].pow*(sp_.types.includes(MOVES[a].type)?1.5:1),vb=MOVES[b].pow*(sp_.types.includes(MOVES[b].type)?1.5:1);return vb-va;});
  const pickD=[];const seenT=new Set();for(const id of dmg){if(pickD.length>=3)break;if(!seenT.has(MOVES[id].type)||dmg.length<=3){pickD.push(id);seenT.add(MOVES[id].type);}}
  for(const id of dmg){if(pickD.length>=3)break;if(!pickD.includes(id))pickD.push(id);}
  const stat=known.filter(id=>MOVES[id].pow===0);const pick=pickD.concat(stat.slice(-Math.max(1,4-pickD.length))).slice(0,4);
  m.moves=pick.map(id=>({id,pp:MOVES[id].pp}));
  calcStats(m);m.hp=m.stats[0];return m;
}
function monName(m){return m.nick||SPECIES[m.sid].name;}
function healMon(m){calcStats(m);m.hp=m.stats[0];m.status=null;m.slp=0;m.moves.forEach(s=>s.pp=MOVES[s.id].pp);}

Clamlet:'Clamlet spits pearls of sand at anything that bothers it. It keeps a favorite pearl hidden deep inside its shell.',
Spineclam:'Frost forms on Spineclam\'s spikes even in summer. Divers mark the reefs where it lives as dangerous.',
Shadewisp:'Shadewisp is made of drifting smoke and gathers wherever the air is still. It likes to spook people by blowing out candles.',

Pinchlet:'Pinchlet scuttles along the riverbed collecting smooth pebbles. It arranges them in patterns that no one understands.',

Palmbrain:'Palmbrain sways in the breeze and seems to be daydreaming. Each of its heads hums a different tune.',
Bonecub:'Bonecub carries a bone it found in the hills and won\'t part with it. It taps the bone on rocks to make rhythms when it\'s lonely.',

Kickstrike:'Kickstrike balances on one leg for hours to train. It can kick the fruit off a branch without disturbing the leaves.',
Smogling:'Smogling hovers near chimneys and breathes in the fumes. In winter, it drifts into towns looking for warm smoke.',

Bladewing:'Bladewing trims tall grass with its sharp forelimbs. Some farmers welcome it, though it doesn\'t always stop where they\'d like.',
Frostdiva:'Frostdiva sings on frozen ponds at midnight. Its songs are always in a language no one recognizes.',
Voltbrawler:'Voltbrawler spars with lightning rods during storms. Ferrowick\'s power plant hires it to jump-start generators.',
Magmabrute:'Magmabrute\'s fists glow red-hot when it concentrates. Blacksmiths say it can forge a blade with its bare hands.',
Hornpincer:'Hornpincer grips tree trunks and shakes them until fruit falls. It is always ready to share what it gets.',
Bullcharge:'Bullcharge herds stampede across the plains at dawn. The thunder of their hooves is Aldera\'s unofficial wake-up call.',
Flopfish:'Flopfish splashes helplessly in the shallows and gets carried off by every current. It somehow survives anywhere it lands.',
Ragewyrm:'Ragewyrm is what a Flopfish becomes after a lifetime of being pushed around. It never forgets the Wyldkin that ignored it.',

Mimeblob:'Mimeblob copies the shape of anything it touches. It has trouble getting colors right, so its copies always look a little off.',

Spirashell:'An ancient Wyldkin restored from a fossil found in the Aldera cliffs. Its spiral shell records the seasons it lived through, like tree rings.',
Spiralord:'Spiralord\'s tentacles move with surprising grace. Scientists use its shell rings to study weather from thousands of years ago.',
Trilobit:'An ancient Wyldkin restored from a fossil. Trilobit can sense vibrations through its shell, so it rarely needs to open its eyes.',
Bladelobe:'Bladelobe\'s blades are made of the same material as its shell. It moves silently through shallow water, its shell barely making a ripple.',

Slumbear:'Slumbear naps in the strangest places: hillsides, riverbeds, the middle of the road. Wake it gently, or it will roll over and sleep even harder.',
Zephyrion:'A legendary bird said to be born in the heart of a thunderhead. Wherever it lands, the soil is rich for years afterward.',
Glaciaris:'A legendary bird that sleeps through summer in an icy cave. When it wakes, the first frost of the year follows its path.',
Pyraxis:'A legendary bird whose flight trails glowing embers. Aldera\'s old calendar marks the year\'s turning by Pyraxis sightings.',
Wyrmlet:'Wyrmlet hides in deep lakes and is rarely seen. Fishers who glimpse its blue scales consider themselves lucky for a year.',
Drakeling:'Drakeling\'s scales catch the light like a prism. Rainbows often appear over lakes where it has surfaced.',
Skywyrm:'Skywyrm patrols the skies over Aldera. Pilots report seeing it fly alongside their planes as if guiding them through storms.',
Psytron:'Psytron was created in a sealed laboratory in the Aldera mountains. The laboratory\'s records end suddenly, and nobody knows who made it.',
Primora:'Primora appears in cave paintings older than any town in Aldera. Many scholars believe every Wyldkin descends from it.',
Fuzzbit:'Fuzzbit hops through the tall grass with its ears perked up. Most trainers in Aldera meet one on their first day out.',
Burrowbun:'Burrowbun digs warrens with dozens of exits. A whole colony can vanish underground in the time it takes to blink.',
Mossnail:'Mossnail grows a carpet of moss on its shell and blends into the forest floor. It leaves a glittering trail on damp nights.',
Verdeshell:'Verdeshell carries a tiny garden on its back. Small Wyldkin often build nests in it and ride along wherever it goes.',
Mudling:'Mudling is made of river clay. When it\'s stepped on, it squishes into a new shape, then pops back up as if nothing happened.',
Mudtitan:'Mudtitan patrols the riverbanks during floods. It plugs gaps in the levees with its own body until the water goes down.',
Sparkfly:'Sparkfly glows brighter the more excited it gets. On summer nights, swarms of them light up Aldera\'s fields.',
Gecklet:'Gecklet basks on warm rocks to soak up the heat. It is gentle and curious and loves to be held when it\'s a little chilly.',
Embergecko:'Embergecko\'s spotted scales glow like coals. It keeps the rocks around its den warm through the coldest winter nights.',
Voltmole:'Voltmole\'s claws spark when it digs. It often tunnels toward buried ByteBound cables and has caused more than one outage.',
Dynamole:'Dynamole charges itself by digging through soil full of metal. When it surfaces, the air crackles with static.',
Wisplet:'Wisplet\'s little flame bobs through the dark like a lantern. People who follow it say it always leads somewhere interesting.',
Lanternwisp:'Lanternwisp drifts through Whisperwood at night. People who sleep near its glow report vivid dreams of places they\'ve never been.',
};

async function profTalk(){
  if(G.flags.starter&&await postChampGift(0))return;
  if(G.flags.starter){const s=G.seen.length,c=G.caught.length;await say(`Prof. Hazel: Your CODEX shows ${s} seen and ${c} caught out of ${SPECIES.length}. Keep going!`);return;}
  await say(`Prof. Hazel: Ah, ${G.name}! You came. I study Wyldkin from three regions: Aldera, Coralmere and Frostfell.`);
  await say('These three are the partner Wyldkin of Aldera. Coralmere and Frostfell have partners of their own. Choose the one you like best!');
  let sid=-1;
  sid=await chooseStarter(0);
  const sp=SPECIES[sid];
  const mon=makeMon(sid,5);G.party.push(mon);addSeen(sid);addCaught(sid);
  await say(`${G.name} received ${sp.name}!`);
  G.flags.starter=1;
  await rivalPicks(0,sid);
  G.flags.rivalLeft=1;
  await say('Prof. Hazel: Wonderful battle! Take these. With Capture Orbs you can catch wild Wyldkin.');
  addItem('orb',5);await say(`${G.name} received 5 Capture Orbs and the CODEX!`);
  await say('Head north through Route 1 to Brookvale. The town\'s gym leader, Brenna, is a good first challenge.');
  G.lastHeal={map:'house1',x:4,y:5};
  autosave();
}

function nurse(map,x,y){return{id:'nurse_'+map,x:5,y:1,dir:'down',look:LOOK.nurse,run:async()=>{
  const rg=MAPS[map]?MAPS[map].region:0;const fee=(G.flags.s1==='lost'&&map==='rest1'?100:0)+(rg===0&&G.flags.s3==='lost'&&!G.flags.tetherOff?150:0)+(rg===1&&G.flags.c4==='lost'?150:0);
  if(bunnyWho()==='you'&&!G.flags.bunnyNurse){G.flags.bunnyNurse=1;await say(`${G.name} freezes in the doorway. White walls. That clean smell. It feels like the lab all over again...`);await say('Nurse: Oh, sweetheart, it\'s okay! No needles, no doctors. Just a warm blanket for your Wyldkin. I promise.');}
  await say(fee?`Welcome to the Rest Center, proudly sponsored by ByteBound. Healing costs $${fee}. Shall I restore your Wyldkin?`:'Welcome to the Rest Center! Shall I restore your Wyldkin to full health?');
  if(await yesno()){if(fee){if(G.money<fee){await say('I\'m sorry, you can\'t cover the fee. Maybe try resting at home?');return;}G.money-=fee;}await say('OK, one moment...');await healAll(true);G.lastHeal={map,x:5,y:4};if(bunnyWho()==='you')await say(`${G.name} hugs each Wyldkin before letting them go. "Mama\'s right here. All better."`);await say('Your Wyldkin are fully rested. We hope to see you again!');autosave();}
  else await say('We hope to see you again!');}};}

// ===================== STORY =====================
async function storyBattle(tr){await say('STORY BATTLE: Win or lose, the outcome is permanent.',{style:'dark'});if(bunnyWho()==='you'&&/SCIENT|DR\.|DOCTOR/i.test((tr.cls||'')+' '+(tr.name||''))&&!G.flags.bunnyLab){G.flags.bunnyLab=1;await say(`${G.name}\'s little bat wings tremble under the pink hair. Lab coats. Clipboards. It wasn\'t ByteBound\'s lab she escaped from... but it looked just like this.`);await say(`${G.name}: Okay. Deep breath. Nobody\'s locking me in a tank ever again.`);}if(staticEgg()&&Math.random()<.5){glitchNow(20);await say(`${tr.name}: Hold on. My scanner just flagged an anomaly. Designation: STATIC. ...Command says to ignore it. It isn't supposed to exist.`);}const assist=await friendAssist(tr);const res=await startBattle({trainer:tr,story:1,assist});await sideHelperReturns();return res;}
// The friend who went off on their own "battle" comes back.
async function sideHelperReturns(){const sd=G._side;G._side=null;if(!sd)return;
  if(isBunny(sd.name)){await say(`${sd.who} comes running back with a first-aid kit (definitely NOT from a hospital). "I chased off three of them with a broom! Now let Mama see your team."`);await healAll();await say(`${sd.who} patched up your whole team!`);}
  else{await say(`${sd.who} strolls back, coat smoking a little. "Took out two scouts. They had this. Don't say I never give you anything."`);addItem('supertonic',1);SFX.lvl();await say(`${G.name} received a Super Tonic!`);}}
// Rowan or Wren may offer to back you up against ByteBound (they take turns offering).
async function friendAssist(tr){
  const r=(MAP&&MAP.region)||0;const fr=G.rivals&&G.rivals[r];if(!fr)return null;
  const isBB=/BB|MERC|BYTEBOUND|SALTJACK|DIRECTOR|CHIEF|SERGEANT|ENFORCER/i.test(tr.cls||'');if(!isBB)return null;
  G.assistN=(G.assistN||0)+1;const f=FR();
  // All three easter eggs in play (Static, Bunny and Smashed): both friends help in every ByteBound fight.
  // Otherwise Smashed always shows up on his own, and regular friends take turns every other fight.
  const ns=[G.name,f.riv.name,f.pal.name];const allThree=ns.some(isStatic)&&ns.some(isBunny)&&ns.some(isSmashed);
  // Smashed and Bunny always show up. If both are your friends (without Static in play), you pick who helps
  // and the other one runs off to "help" with a battle of their own.
  const always=n=>isSmashed(n)||isBunny(n);
  let who=[];G._side=null;
  if(allThree)who=['Rowan','Wren'];
  else if(always(f.riv.name)&&always(f.pal.name)){
    await say(`${f.riv.name} and ${f.pal.name} both step forward. "We've got this, ${G.name}!"`);
    const c=await choose([f.riv.name,f.pal.name],{x:150,y:H-92,w:88,prompt:'Who should help you?'});const pick=c===1?'Wren':'Rowan',other=pick==='Rowan'?'Wren':'Rowan';
    const on=other==='Rowan'?f.riv.name:f.pal.name;
    await say(isSmashed(on)?`${other}: Fine. I'll go torch the guards in the next room. Somebody has to.`:`${other}: Okay, sweetie! I'll go keep the other ByteBound grunts busy. Be careful!`);
    G._side={who:other,name:on};who=[pick];}
  else if(always(f.riv.name))who=['Rowan'];
  else if(always(f.pal.name))who=['Wren'];
  else if(G.assistN%2===1)who=[(G.assistN>>1)%2===0?'Wren':'Rowan'];
  if(!who.length)return null;
  const ace=Math.max(...tr.party.map(p=>p[1]));const lvl=Math.max(5,ace-3);
  for(const w of who){const n=w==='Rowan'?f.riv.name:f.pal.name;
    if(isSmashed(n))await say(`${w}: Ugh. ByteBound again? You look like you\'re about to get flattened. Move over, I\'m helping. Don\'t make it a thing.`);
    else if(isBunny(n))await say(`${w}: Sweetie, are those ByteBound creeps bothering you? Nobody hurts my friends. Mama Bunny is here!`);
    else if(isStatic(n)){glitchNow(16);await say(`${w}: ByteBound. Of course. They still think I\'m an "it." ...Let\'s show them what an "it" can do.`);}
    else await say(w==='Wren'?`Wren: ${G.name}! I saw ByteBound come this way. Want me to back you up, like old times?`:`Rowan: Tch, ByteBound again? Fine. Want a hand, ${G.name}? Don't make it weird.`);}
  const names=who.join(' and ');
  if(!await yesno(`Battle with ${names}'s help?`)){
    for(const w of who){const n=w==='Rowan'?f.riv.name:f.pal.name;await say(isSmashed(n)?`${w}: Your funeral. ...I\'m standing right here if it goes bad, though.`:isBunny(n)?`${w}: Okay, sweetie. But Mama\'s right behind you!`:isStatic(n)?`${w}: Suit yourself. I\'ll be watching. I\'m always watching. ...That came out creepier than I meant.`:`${w}: Okay! I'll be right here cheering.`);}
    return null;}
  return who.map(w=>{const n=w==='Rowan'?f.riv.name:f.pal.name;const sid=w==='Wren'?fr.wren:fr.rowan;
    return{name:w,mon:makeMon(isSmashed(n)?evolvedAt(SP_BY.Cinderpup.id,lvl):evolvedAt(sid,lvl),lvl)};});
}
function giveKey(k){G.keys=G.keys||[];if(!G.keys.includes(k))G.keys.push(k);}
async function s1Event(){
  if(G.flags.s1||!G.flags.starter)return;
  const dax=npcs.find(n=>n.id==='bb_dax');if(dax)dax.dir=OPP[player.dir]||'down';
  await say('Girl: Give him back! Pip is MINE!');
  await say('ByteBound Security: Sorry, kid. This Fuzzbit was tagged for Project Tether sampling. It\'s company property now.');
  await say(`ByteBound Security: ...You got a problem with that? Fine. Company policy says I can settle disputes "by any means necessary."`);
  const r=await storyBattle({name:'Dax',cls:'BB SECURITY',party:[['Gnawl',6],['Snarlpup',7]],reward:30,lose:'Tch. Keep the rat. It\'s not worth the paperwork.',look:LOOK.bb_sec});
  if(r==='win'){G.flags.s1='won';await say('Dax: Commander Hale is going to hear about this, kid.');await say('Girl: Pip! You\'re okay! Thank you so much! Here, take these!');addItem('supertonic',2);SFX.lvl();await say(`${G.name} received 2 Super Tonics!`);}
  else{G.flags.s1='lost';await say('Dax: Company property is company property. Come on, rat.');await say('The officer walks off with Pip tucked under his arm...');await say('Girl: Pip... PIP!');
    await say('(A notice goes up on the Rest Center door: "Now proudly sponsored by ByteBound. Healing: $100.")');}
  refreshNPCs();autosave();
}
async function pipGirl(){
  if(!G.flags.s1){await say('Girl: That man in the uniform grabbed Pip! Please help!');return;}
  if(G.flags.s1==='won'){await say('Girl: Pip and I go everywhere together now. ByteBound will never take him again!');return;}
  if(G.flags.pipBack&&!G.flags.pipThanks){G.flags.pipThanks=1;await say('Girl: PIP! You brought him back from the Relay Station! I can\'t believe it!');addItem('revive',1);addItem('greatorb',3);SFX.lvl();await say(`${G.name} received a Revival Herb and 3 Great Orbs!`);return;}
  if(G.flags.pipBack){await say('Girl: Pip hasn\'t left my side since you brought him home.');return;}
  await say('Girl: They took Pip to Ferrowick. Some big ByteBound building there... I\'ll never see him again.');
}
async function s2Rook(n){
  if(G.flags.s2)return;
  n.excl=50;SFX.ok();await wait(50);while(Math.abs(n.x-player.x)+Math.abs(n.y-player.y)>1)await npcStep(n,n.dir);player.dir=OPP[n.dir];
  await say('Mercenary: Contract says nobody gets near the pylon. Nothing personal, kid.');
  await say('Rook: Name\'s Rook. ByteBound pays me to keep things quiet. You\'re being loud.');
  const r=await storyBattle({name:'Rook',cls:'MERCENARY',party:[['Duskit',11],['Coilsnek',11],['Shadewisp',12]],reward:40,lose:'Huh. Wasn\'t paid enough for this.',look:LOOK.rook});
  if(r!=='win'){await s2Lost('Rook: Fee for my trouble.');return;}
  G.flags.rook='won';await say('Rook: Fine. The egghead by the pylon is on his own.');npcs=npcs.filter(x=>x.id!=='bb_rook');
}
async function s2Imre(n){
  if(G.flags.s2)return;
  if(!G.flags.rook){const rk=npcs.find(x=>x.id==='bb_rook');if(rk){await s2Rook(rk);if(G.flags.s2)return;}}
  if(n.los&&!n._spotted){n._spotted=1;n.excl=40;await wait(40);}
  player.dir=OPP[n.dir]||player.dir;
  await say('ByteBound Scientist: Don\'t touch that! The pylon is drawing energy from every Wyldkin in these woods. The readings are beautiful!');
  await say('Dr. Imre: The forest won\'t miss a little energy. Project Tether needs it more.');
  const r=await storyBattle({name:'Imre',cls:'BB SCIENTIST',party:[['Coilorb',12],['Boltnut',13]],reward:30,lose:'My data! Do you know how long that took?!',look:LOOK.bb_sci});
  if(r!=='win'){await s2Lost('Dr. Imre: Security! Fine this trespasser!');return;}
  G.flags.s2='won';giveKey('Pylon Core');SFX.lvl();
  await say('You pried the glowing core out of the pylon. The hum stops, and the forest seems to breathe again.');
  await say(`${G.name} obtained the PYLON CORE! It still crackles with Tether energy.`);
  refreshNPCs();applyMods();autosave();
}
async function s2Lost(line){
  G.flags.s2='lost';const fee=Math.floor(G.money/2);G.money-=fee;
  await say(line);await say(`${G.name} had to hand over $${fee}.`);
  await say('The pylon hums louder. Whisperwood grows darker, and the Wyldkin that lived here begin to flee.');
  refreshNPCs();applyMods();autosave();
}
async function s3Event(){
  if(G.flags.s3)return;
  const h=npcs.find(n=>n.id==='hale');if(h){h.excl=40;await wait(40);while(Math.abs(h.x-player.x)+Math.abs(h.y-player.y)>1&&player.y>h.y+1)await playerStep('up');}
  player.dir='up';
  await say('Dr. Vasquez: So you\'re the trainer who keeps interfering with Tether. Do you even know what you\'re fighting?');
  await say('Dr. Vasquez: Every Capture Orb ByteBound has sold carries a link to ByteNet. Tether lets the network draw strength from the Wyldkin sleeping inside.');
  await say('Dr. Vasquez: ByteNet has had... gaps, ever since the 27-Alpha incident. A faulty process got loose and took part of the network with it. Tether fills those gaps.');
  await say('Commander Hale: Enough, Doctor. I\'ll handle this. Specimens, deploy!');
  const party=[['Gnawlord',20],['Venomamba',20]];
  if(G.flags.s1==='lost')party.push(['Burrowbun',19]);
  if(G.flags.s2==='lost')party.push(['Coilcluster',22]);
  let ace=22;const pylon=(G.keys||[]).includes('Pylon Core');
  if(pylon){ace=18;await say('Dr. Vasquez: Is that... a PYLON CORE? You\'ve been draining the Tether! Hale, your specimens are running at half power!');}
  else if(G.flags.s2==='lost')await say('Dr. Vasquez: The Whisperwood pylon is feeding us perfectly. Hale, use the tethered specimen.');
  party.push(['Steelhawk',ace]);
  const r=await storyBattle({name:'Hale',cls:'COMMANDER',party,reward:60,lose:'...Impossible. Doctor, pull the data. We\'re leaving.',look:LOOK.hale});
  if(r==='win'){
    G.flags.s3='won';giveKey('Tether Data');
    await say('Dr. Vasquez: Tether is offline... It doesn\'t matter. Undertow is already underway in Coralmere. You can\'t follow us there.');
    await say('Commander Hale: This isn\'t over, trainer.');
    if(G.flags.s1==='lost'){G.flags.pipBack=1;await say('Hale left a Capture Orb behind in his hurry. Inside is... Pip! The girl in Brookvale will be thrilled.');}
    await say('You copied the Tether files from the core. A scrambled message scrolls across the screen: "0x06 // RELAY SEVERED // ...". There\'s no sender.');
    addItem('revive',2);SFX.lvl();await say(`${G.name} obtained the TETHER DATA and 2 Revival Herbs!`);
  } else {
    G.flags.s3='lost';G.confiscated=G.confiscated||[];
    await say('Commander Hale: ByteBound thanks you for your donation to science.');

function genCave(sp){

const NODES={};const LINKS=[];
function N(spec){NODES[spec.id]=spec;spec.exits=spec.exits||{n:[],s:[],e:[],w:[]};spec.mouths=spec.mouths||[];spec.ladders=spec.ladders||[];return spec;}
function link(a,side,b,kind,fix){LINKS.push(Object.assign({a,side,b,kind:kind||'edge'},fix||{}));}
const OPPS={n:'s',s:'n',e:'w',w:'e'};
function planLinks(){
  LINKS.forEach(L=>{const A=NODES[L.a]||null,B=NODES[L.b]||null;
    if(L.kind==='edge'){if(!A&&L.fixA!=null)L.aPos=L.fixA;if(!B&&L.fixB!=null)L.bPos=L.fixB;
      const rnd=(spec,side)=>{const len=side==='n'||side==='s'?spec.w:spec.h;const r=mulberry32(hashStr(spec.id+side+L.b+L.a));return 4+Math.floor(r()*(len-9));};
      if(A&&!L.aPos){L.aPos=L.fixA!=null?L.fixA:rnd(A,L.side);A.exits[L.side].push(L.aPos);}
      if(B&&!L.bPos){L.bPos=L.fixB!=null?L.fixB:rnd(B,OPPS[L.side]);B.exits[OPPS[L.side]].push(L.bPos);}
    } else {
      // cave/door link: A gets a mouth (or ladder if cave), B gets a ladder (or mouth if outdoor)
      const aCave=A&&A.kind==='cave',bCave=B&&B.kind==='cave';
      if(A){(aCave?A.ladders:A.mouths).push({side:L.side,to:L.b,link:L});}
      if(B){(bCave?B.ladders:B.mouths).push({side:OPPS[L.side],to:L.a,link:L});}
    }});
}
function buildNodes(){
  planLinks();
  const built={};
  Object.values(NODES).forEach(sp=>{
    const out=sp.kind==='cave'?genCave(sp):genOutdoor(sp);built[sp.id]=out;
    const th=THEMES[sp.theme||(sp.kind==='cave'?'cave':'aldera')];
    MAPS[sp.id]={name:sp.name,bg:sp.bg||th.bg,ground:th.ground,rows:out.rows,region:sp.region,prog:sp.prog,cave:sp.kind==='cave',kind:sp.kind,conn:{},warps:[],npcs:[],signs:{},enc:null,town:sp.kind==='town',spec:sp};
    if(out.sign)MAPS[sp.id].signs[out.sign.join(',')]=sp.signText||`${sp.name.toUpperCase()}\n${sp.blurb||REGIONS[sp.region]+' region'}`;
  });
  // edge connections
  LINKS.filter(L=>L.kind==='edge').forEach(L=>{
    const A=MAPS[L.a],B=MAPS[L.b];const s=L.side;
    const off=(L.bPos)-(L.aPos);
    if(A)A.conn[s]={to:L.b,off};if(B)B.conn[OPPS[s]]={to:L.a,off:-off};
  });
  // door links (mouths/ladders)
  const find=(id,to)=>{const o=built[id];if(!o)return null;const arr=(o.mouths||[]).concat(o.ladders||[]);return arr.find(e=>(e.m||e.l).to===to);};
  LINKS.filter(L=>L.kind!=='edge').forEach(L=>{
    const a=find(L.a,L.b),b=find(L.b,L.a);if(!a||!b){console.warn('link fail',L);return;}
    const arr=(id,e)=>{const isLadder=!!e.l;return isLadder?[e.x+1<MAPS[id].rows[0].length&&MAPS[id].rows[e.y][e.x+1]==='q'?e.x+1:e.x-1<0?e.x:MAPS[id].rows[e.y][e.x-1]==='q'?e.x-1:e.x,MAPS[id].rows[e.y][e.x+1]==='q'||MAPS[id].rows[e.y][e.x-1]==='q'?e.y:(MAPS[id].rows[e.y+1]&&MAPS[id].rows[e.y+1][e.x]==='q'?e.y+1:e.y-1)]:[e.x,e.y+1];};
    const ta=arr(L.b,b),tb=arr(L.a,a);
    MAPS[L.a].warps.push({x:a.x,y:a.y,to:L.b,tx:ta[0],ty:ta[1],dir:'down'});
    MAPS[L.b].warps.push({x:b.x,y:b.y,to:L.a,tx:tb[0],ty:tb[1],dir:'down'});
  });
  return built;
}

function maxRegion(){return G.flags.arrive2?2:G.flags.arrive1?1:0;}
function canTravel(to){const cur=curRegion();if(to===cur)return false;if(!(G.champs||[]).includes(cur))return false;if(to<=maxRegion())return true;return to===maxRegion()+1&&(G.champs||[]).includes(maxRegion());}
async function ferryMenu(){
  const cur=curRegion();
  if(!(G.champs||[]).includes(cur)){await say(`Ferry Captain: The ByteNet border lock is still active. Nobody\'s ferry can leave ${REGIONS[cur]} until the network link is restored.`);await say('Ferry Captain: They say it lifts when a new Champion is crowned here...');return;}
  const opts=[0,1,2].filter(canTravel);if(!opts.length){await say('Ferry Captain: No routes are open right now.');return;}
  const r=await choose(opts.map(i=>REGIONS[i].toUpperCase()).concat(['CANCEL']),{x:120,y:20,w:110,prompt:'Ferry Captain: Where to?'});
  if(r<0||r>=opts.length)return;const to=opts[r];
  await say(`Ferry Captain: All aboard for ${REGIONS[to]}!`);await fadeTo(1,20);
  const pm=MAPS[PORTS[to]];const fp=pm.ferryPos||[5,5];loadMap(PORTS[to],fp[0],fp[1],'down');await fadeTo(0,20);
  if(to>0&&!G.flags['arrive'+to])await regionArrival(to);else autosave();
}
async function regionArrival(r){
  G.flags['arrive'+r]=1;
  await say('As the ship docks, every screen at the port flickers. "E06 // NETWORK BORDER LOCK" scrolls across them.');
  await say(`Port Officer: Welcome to ${REGIONS[r]}! Bad news, I\'m afraid. ByteNet can\'t carry data across the region border right now. Something keeps scrambling the link.`);
  await say('Port Officer: For safety, every Capture Orb that crosses the border is held in ByteNet Storage until the link is restored. That includes yours.');
  G.locked=(G.locked||[]).concat(G.party,G.box);G.party=[];G.box=[];
  await say(`${G.name}\'s Wyldkin were transferred to ByteNet Storage. They\'ll be released when ${REGIONS[r]}\'s link is restored.`);
  await say(`Port Officer: Rumor is the lock lifts once someone becomes Champion here. Until then... Professor ${PROF[r]} at the lab can lend you a partner.`);
  if(r===1){await say(G.flags.s3==='won'?'Port Officer: Funny thing. A ByteBound scientist came through here a while back, in a real hurry. Dr. Vasquez, her badge said.':'Port Officer: ByteBound\'s been shipping crates of Capture Orbs through here nonstop. Something called "Undertow."');}
  if(r===2){await say(G.flags.c4==='won'?'Port Officer: ByteBound moved everything up here after that mess in Coralmere. Whatever they\'re building, they\'re in a hurry.':'Port Officer: ByteBound practically owns Frostfell now. "Project Zero," the posters say. Nobody knows what it means.');}
  const rest=Object.values(MAPS).find(m=>m.spec&&m.spec.id===PORTS[r]);if(rest&&rest.healSpot)G.lastHeal=rest.healSpot;
  autosave();
}
function releaseLocked(){if(!(G.locked||[]).length)return 0;const n=G.locked.length;G.locked.forEach(m=>{healMon(m);G.box.push(m);});G.locked=[];return n;}
async function championWin(r){
  G.champs=G.champs||[];if(!G.champs.includes(r))G.champs.push(r);
  G.hof=G.hof||[];G.hof.push({r,t:G.time,team:G.party.map(m=>({sid:m.sid,lvl:m.lvl}))});
  await hallOfFame(r);
  const n=releaseLocked();if(n)await say(`The ByteNet border link for ${REGIONS[r]} is restored! ${n} Wyldkin were released from ByteNet Storage into your PC box.`);
  else await say(`The ByteNet border link for ${REGIONS[r]} is restored!`);
  if(r<2)await say(`The ferries out of ${REGIONS[r]} are running again. The ferry at ${MAPS[PORTS[r]].name} can now take you to ${REGIONS[r+1]}, and anywhere you\'ve already been.`);
  await say(`Professor ${PROF[r]} wants to see you at the lab. Legends across ${REGIONS[r]} are stirring, too...`);
  const h=MAPS[PORTS[r]];const rest=h&&h.healSpot?h.healSpot:null;
  await fadeTo(1,20);if(r===0){loadMap('house1',4,5,'down');}else{const lab=Object.keys(MAPS).find(k=>k.startsWith(PORTS[r]+'_lab'));const pm=MAPS[PORTS[r]];loadMap(PORTS[r],pm.ferryPos[0],pm.ferryPos[1],'down');}

}

// Rowan and Wren's Wyldkin spar in the lab for a few seconds. Returns true if Wren wins.
function labSpar(rsid,wsid){
  // Wren's partner has the type edge over Rowan's, so Wren is favored, but anything can happen.
  const wWins=Math.random()<.65;
  return new Promise(res=>{let t=0;const hpR={v:1},hpW={v:1};const hits=[];
    // script 6 exchanges; loser hits 0 at the end
    for(let i=0;i<6;i++)hits.push({at:30+i*34,who:i%2?'r':'w'});
    const dmgL=[.3,.3,.4],dmgW=[.2,.22,.25];let nL=0,nW=0;
    const el={update(){t++;
      for(const h of hits)if(t===h.at){SFX.hit();const tgt=h.who==='w'?hpR:hpW;const tgtLoses=(tgt===hpR)===wWins;tgt.v=Math.max(0,tgt.v-(tgtLoses?dmgL[nL++]:dmgW[nW++]));}
      if(t===hits[5].at+24)SFX.bump();
      if(t>hits[5].at+70){popUI(el);res(wWins);}},
      draw(c){c.save();c.translate(0,MY);box(c,14,10,212,104,'dark');c.beginPath();c.rect(16,12,208,100);c.clip();text(c,'ROWAN',28,18,'#8fb8ff',8);text(c,'WREN',212,18,'#8fe0b0',8,true,'right');
        const dr=(sid,x,flip,hp,lunge,hit,gone)=>{if(gone>0)c.globalAlpha=Math.max(0,1-gone/30);c.save();c.translate(x+(flip?64:0)+lunge,34+(gone>0?gone:0));if(flip)c.scale(-1,1);if(!(hit>0&&hit%2))c.drawImage(((sid===rsid&&isBunny(FR().riv.name))||(sid===wsid&&isBunny(FR().pal.name))?pinkSpriteOf(sid):spriteOf(sid)).front,0,0,64,64,0,0,64,64);c.restore();c.globalAlpha=1;};
        let lr=0,lw=0,hr=0,hw=0;for(const h of hits){const d=t-h.at;if(d>=-8&&d<0){if(h.who==='r')lr=6;else lw=-6;}if(d>=0&&d<10){if(h.who==='w')hr=10-d;else hw=10-d;}}
        const fin=hits[5].at+24;const gr=wWins&&t>fin?t-fin:0,gw=!wWins&&t>fin?t-fin:0;
        dr(rsid,30,true,hpR.v,lr,hr,gr);dr(wsid,146,false,hpW.v,lw,hw,gw);
        const bar=(x,v)=>{c.fillStyle='#202020';c.fillRect(x,26,64,5);c.fillStyle=v>.5?'#48d048':v>.2?'#e0c030':'#e04040';c.fillRect(x+1,27,62*v,3);};bar(30,hpR.v);bar(146,hpW.v);
        text(c,'VS',120,62,'#f8d048',10,true,'center');c.restore();}};
    pushUI(el);});
}

function assignEncounters(){
  for(let r=0;r<3;r++){
    const maps=Object.values(NODES).filter(sp=>sp.region===r&&(sp.kind==='route'||sp.kind==='cave')&&!sp.legend).sort((a,b)=>a.prog-b.prog);
    const natives=SPECIES.filter(s=>s.prevo==null&&(s.rar==='c'||s.rar==='u')&&s.region===r&&!AQUATIC(s));
    const tables={};maps.forEach(m=>tables[m.id]={grass:[],fish:[]});
    const add=(mid,s,w,kind='grass')=>{const t=tables[mid][kind];if(t.some(e=>e[0]===s.name))return;const sp=NODES[mid];const lv=lvAt(r,sp.prog);t.push([s.name,Math.max(2,lv-2-(kind==='fish'?1:0)),lv+1,w]);};
    natives.forEach(s=>{
      const cand=maps.map(m=>({m,sc:habScore(s,m.biome||(m.kind==='cave'?'cave':'meadow'))})).filter(c=>c.sc>0);
      if(!cand.length)cand.push(...maps.map(m=>({m,sc:.1})));
      cand.sort((a,b)=>b.sc-a.sc||(s.rar==='u'?b.m.prog-a.m.prog:a.m.prog-b.m.prog));
      const picks=[];for(const c of cand){if(picks.length>=2)break;if(s.rar==='u'&&c.m.prog<.25&&cand.some(x=>x.m.prog>=.25&&x.sc>=c.sc*.7))continue;if(picks.some(p=>Math.abs(p.prog-c.m.prog)<.08))continue;picks.push(c.m);}
      if(!picks.length)picks.push(cand[0].m);
      picks.forEach(m=>add(m.id,s,s.rar==='u'?4:12));
    });
    // older-region visitors and late evolutions
    maps.forEach(m=>{const R=mulberry32(hashStr(m.id+'v'));const biome=m.biome||(m.kind==='cave'?'cave':'meadow');const lv=lvAt(r,m.prog);
      if(r>0){const old=SPECIES.filter(s=>s.prevo==null&&s.region<r&&(s.rar==='c'||s.rar==='u')&&!AQUATIC(s)&&habScore(s,biome)>=2);for(let i=0;i<3&&old.length;i++)add(m.id,old[Math.floor(R()*old.length)],5);}
      if(m.prog>=.5){const evs=SPECIES.filter(s=>s.prevo!=null&&s.region<=r&&s.rar!=='r'&&s.rar!=='L'&&validAt(s,lv)&&habScore(s,biome)>=2&&!AQUATIC(s));for(let i=0;i<2&&evs.length;i++)add(m.id,evs[Math.floor(R()*evs.length)],3);}
      if(tables[m.id].grass.length<5){const extra=SPECIES.filter(s=>s.prevo==null&&s.region<=r&&(s.rar==='c'||s.rar==='u')&&!AQUATIC(s)).sort((a,b)=>habScore(b,biome)-habScore(a,biome));for(const s of extra){if(tables[m.id].grass.length>=6)break;add(m.id,s,6);}}
      (RARE_PLACE[m.id]||[]).forEach(([nm,w])=>add(m.id,SP_BY[nm],w));
    });
    // fishing
    const fishMaps=maps.filter(m=>MAPS[m.id].rows.some(row=>row.includes('~')));
    const fishers=SPECIES.filter(s=>s.prevo==null&&(s.rar==='c'||s.rar==='u')&&s.region<=r&&s.types.includes('Water')).sort((a,b)=>(b.region===r)-(a.region===r));
    const natFish=fishers.filter(s=>s.region===r);
    natFish.forEach((s,i)=>{if(fishMaps.length)add(fishMaps[i%fishMaps.length].id,s,s.rar==='u'?5:12,'fish');if(fishMaps.length>1)add(fishMaps[(i+3)%fishMaps.length].id,s,6,'fish');});
    fishMaps.forEach(m=>{const R=mulberry32(hashStr(m.id+'f'));if(r===0)add(m.id,SP_BY.Flopfish,14,'fish');while(tables[m.id].fish.length<4)add(m.id,fishers[Math.floor(R()*fishers.length)],6,'fish');(RARE_FISH[m.id]||[]).forEach(([nm,w])=>add(m.id,SP_BY[nm],w,'fish'));});
    maps.forEach(m=>{MAPS[m.id].enc={grass:tables[m.id].grass,fish:tables[m.id].fish.length?tables[m.id].fish:null};});
  }
  // fishing on hand-made Aldera maps
  MAPS.route2.enc.fish=[['Flopfish',5,8,14],['Finnow',6,9,10],['Jellume',6,9,6],['Drifthorse',7,9,4]];
  MAPS.hearthollow.enc={grass:[],fish:[['Flopfish',4,6,14],['Finnow',4,6,8],['Puddlepup',5,5,0]]};
  MAPS.ferrowick.enc={grass:[],fish:[['Flopfish',12,16,12],['Starlet',12,15,6],['Clamlet',12,15,6],['Sealpup',13,16,4]]};
}

// Any NPC that ended up on a solid tile (table, wall, gym obstacle, roof) moves to the nearest free floor tile.
function fixNpcSpots(){
  for(const id in MAPS){const m=prepMap(id);if(!m.npcs||!m.npcs.length)continue;const R=m.rows;
    const solid=(x,y)=>x<0||y<0||x>=m._w||y>=m._h||SOLID.has(R[y][x]);
    const bad=(x,y)=>(m.warps||[]).some(w=>w.x===x&&w.y===y)||(m.triggers||[]).some(t=>t.x===x&&t.y===y)||'DmE{h'.includes(R[y][x]);
    const occ=new Set(m.npcs.map(n=>n.x+','+n.y));
    for(const n of m.npcs){if(!solid(n.x,n.y))continue;
      const seen=new Set([n.x+','+n.y]),q=[[n.x,n.y]];let found=null;
      while(q.length&&!found){const[x,y]=q.shift();for(const[dx,dy]of[[0,1],[1,0],[0,-1],[-1,0]]){const X=x+dx,Y=y+dy,k=X+','+Y;if(seen.has(k)||X<0||Y<0||X>=m._w||Y>=m._h)continue;seen.add(k);
        if(!solid(X,Y)&&!bad(X,Y)&&!occ.has(k)){found=[X,Y];break;}q.push([X,Y]);}}
      if(found){occ.delete(n.x+','+n.y);n.x=found[0];n.y=found[1];occ.add(found.join(','));}}}
}

const MUS={ctx:null,cur:null,step:0,next:0,timer:null,gain:null,parsed:{}};
function parseSong(id){if(MUS.parsed[id])return MUS.parsed[id];const s=SONGS[id];const mel=s.mel.split(/\s+/).filter(t=>t!=='|');MUS.parsed[id]={...s,mel};return MUS.parsed[id];}
function musicOn(){return G&&G.opts&&G.opts.music!==false;}
function playSong(id){
  if(!AC)return;if(MUS.cur===id)return;MUS.cur=id;MUS.step=0;MUS.next=AC.currentTime+.05;
  if(!MUS.gain){MUS.gain=AC.createGain();MUS.gain.gain.value=.5;MUS.gain.connect(AC.destination);}
  if(!MUS.timer)MUS.timer=setInterval(musicTick,25);
}
function stopSong(){MUS.cur=null;}
let NOISE=null;
function noiseBuf(){if(NOISE)return NOISE;const b=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NOISE=b;}
function tone(type,f,t,dur,vol){if(!f)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol*.8,t+dur*.6);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+dur+.02);}
function drum(kind,t){const src=AC.createBufferSource();src.buffer=noiseBuf();const g=AC.createGain();const f=AC.createBiquadFilter();
  if(kind==='k'){const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);og.gain.setValueAtTime(.35,t);og.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(og);og.connect(MUS.gain);o.start(t);o.stop(t+.16);return;}
  f.type=kind==='h'?'highpass':'bandpass';f.frequency.value=kind==='h'?7000:1800;g.gain.setValueAtTime(kind==='h'?.06:.16,t);g.gain.exponentialRampToValueAtTime(.001,t+(kind==='h'?.04:.12));src.connect(f);f.connect(g);g.connect(MUS.gain);src.start(t);src.stop(t+.15);}
function musicTick(){
  if(!AC||!MUS.cur)return;const s=parseSong(MUS.cur);const on=musicOn()&&G&&G.opts.sound;MUS.gain.gain.value=on?.45:0;
  const stepDur=60/s.bpm/2;const total=s.mel.length;
  while(MUS.next<AC.currentTime+.12){
    const i=MUS.step%total,t=MUS.next;const bar=Math.floor(i/8)%s.ch.length,pos=i%8;const ch=CHORD[s.ch[bar]]||CHORD.C;
    if(on){
      const tok=s.mel[i];if(tok&&tok!=='-'&&tok!=='.'){let len=1;while(s.mel[(i+len)%total]==='-'&&len<8)len++;tone('square',nfreq(tok),t,stepDur*len*.95,.07);}
      if(pos%2===0)tone('triangle',nfreq(ch[0]+(pos===4?'3':'2')),t,stepDur*1.8,.16);
      if(s.arp){const ai=Math.floor(pos/s.arp)%3;if(pos%s.arp===0)tone('square',nfreq(ch[ai]+'4'),t,stepDur*.6,.025);}
      const d=s.dr[(i%16)];if(d&&d!=='.')drum(d,t);
    }
    MUS.step++;MUS.next+=stepDur;
    if(s.once&&MUS.step>=total){MUS.cur=MUS.after||null;MUS.step=0;MUS.after=null;break;}
  }
}
function jingle(id){if(!AC)return;const prev=MUS.cur;MUS.cur=null;playSong(id);MUS.after=prev;}
function sceneSong(){
  if(scene==='title'||scene==='intro')return'title';
  if(scene==='battle'||scene==='evo'){if(!B)return MUS.cur;if(B.story)return'bytebound';if(B.trainer&&/LEADER|ELITE|CHAMPION|COMMANDER|CAPTAIN|DIRECTOR|RIVAL/.test(B.trainer.cls))return'leader';return B.wild?'wild':'trainer';}
  if(scene==='world'&&MAP){if(MAP.bb)return'bytebound';if(MAP.cave)return'cave';if(MAP.indoor||MAP.town)return'town';return'route';}
  return MUS.cur;
}

function wait(n){return new Promise(r=>timers.push({t:n,r}));}
function fadeTo(t,frames=12){fadeTarget=t;fadeSpeed=1/frames;return new Promise(r=>{const chk=()=>{if(Math.abs(fade-fadeTarget)<.001)r();else timers.push({t:1,r:chk});};chk();});}

// say(): GBA style 2-line text box
function say(str,opts={}){str=glitchText(friendText(str));window.LASTSAY=str;
  return new Promise(res=>{
    const lines=wrapText(ctx,str,214,9);const pages=[];for(let i=0;i<lines.length;i+=2)pages.push(lines.slice(i,i+2));
    const el={pi:0,ch:0,t:0,update(p){const pg=pages[this.pi],full=pg.join('').length+pg.length;
      if(this.ch<full){this.ch+=(G&&G.opts.textFast?3:1.6)*(held.a||held.b?3:1);if(p.has('a')||p.has('b'))this.ch=full;return;}
      this.t++;
      if(p.has('a')||p.has('b')||(opts.auto&&this.t>opts.auto)){SFX.sel();this.pi++;this.ch=0;this.t=0;if(this.pi>=pages.length){popUI(this);res();}}},
      draw(c){box(c,2,H-46,236,44,opts.style||'std');const pg=pages[Math.min(this.pi,pages.length-1)];let n=this.ch;
        pg.forEach((l,i)=>{const s=l.slice(0,Math.max(0,Math.floor(n)));n-=l.length+1;text(c,s,12,H-38+i*15,'#404040',9);});
        if(this.ch>=pg.join('').length+pg.length&&!opts.auto&&Math.floor(frame/16)%2)text(c,'▼',226,H-15,'#e05050',7,false);}};
    pushUI(el);

function refreshNPCs(){if(!MAP)return;npcs=npcs.filter(n=>(!n.cond||n.cond())&&!(n.item&&G.flags['item_'+n.id]));}
function npcAt(x,y){return npcs.find(n=>(n.x===x&&n.y===y)||(n.moving&&n.tx===x&&n.ty===y));}

function worldUpdate(p){
  // NPC movement
  npcs.forEach(n=>{if(n.moving){n.prog++;if(n.prog>=16){n.x=n.tx;n.y=n.ty;n.moving=false;n.prog=0;n.done&&n.done();n.done=null;}}
    else if(n.wander&&!lock&&!ui.length&&Math.random()<.006){const ds=Object.keys(DIRS);const d=ds[Math.floor(Math.random()*4)];const[dx,dy]=DIRS[d];const nx=n.x+dx,ny=n.y+dy;n.dir=d;
      if(Math.abs(nx-n.ox)<=2&&Math.abs(ny-n.oy)<=2&&!solidAt(nx,ny)&&!npcAt(nx,ny)&&!(player.x===nx&&player.y===ny)&&!(player.tx===nx&&player.ty===ny)&&!['D','"','r'].includes(tileAt(nx,ny)))npcStep(n,d);}});
  if(player.moving){
    player.prog+=player.run?2:1;
    if(player.prog>=16){player.moving=false;player.prog=0;player.x=player.tx;player.y=player.ty;G.x=player.x;G.y=player.y;G.dir=player.dir;
      if(player.scripted){const r=player.scripted;player.scripted=null;r();return;}
      if(onStep())return;
    } else return;
  }
  if(lock||ui.length)return;
  if(pendingEnter){pendingEnter=false;const oe=[].concat(MAP.onEnter||[]).find(o=>!o.cond||o.cond());if(oe){runScript(oe.run);return;}}
  if(p.has('start')){runScript(startMenu);return;}
  if(p.has('select')&&G.party.length){runScript(async()=>{writeSave('manual');SFX.ok();await say(`Quick saved to FILE ${SLOT}.`);});return;}
  if(p.has('a')){interact();return;}
  let d=null;for(const k of ['up','down','left','right'])if(held[k]){d=k;break;}
  if(!d){player.wasMoving=false;player.turnT=0;return;}
  if(d!==player.dir&&!player.wasMoving){player.dir=d;player.turnT=6;return;}
  if(player.turnT>0){player.turnT--;return;}
  tryMove(d);
}
function tryMove(d){
  const[dx,dy]=DIRS[d];const nx=player.x+dx,ny=player.y+dy;player.dir=d;
  if(nx<0||ny<0||nx>=MAP._w||ny>=MAP._h){const edge=nx<0?'w':nx>=MAP._w?'e':ny<0?'n':'s';const c=MAP.conn&&MAP.conn[edge];
    if(c&&!G.party.length&&MAP.town){runScript(()=>say('You can\'t go into the wild without a Wyldkin! Visit the lab first.'));return;}
    if(c){const m=prepMap(c.to);let X,Y;if(edge==='n'){X=player.x+c.off;Y=m._h-1;}else if(edge==='s'){X=player.x+c.off;Y=0;}else if(edge==='e'){X=0;Y=player.y+c.off;}else{X=m._w-1;Y=player.y+c.off;}
      loadMap(c.to,X,Y,d);player.wasMoving=true;autosave();}
    return;}
  if(solidAt(nx,ny)||npcAt(nx,ny)){if(player.bump<=0){SFX.bump();player.bump=16;}player.wasMoving=false;return;}
  folStep();player.tx=nx;player.ty=ny;player.moving=true;player.prog=0;player.step++;player.run=!!held.b;player.wasMoving=true;
}
function onStep(){
  const ch=tileAt(player.x,player.y);
  const w=(MAP.warps||[]).find(w=>w.x===player.x&&w.y===player.y);
  if(w&&(ch==='D'||ch==='m'||ch==='{'||ch==='E'||ch==='h')){if(!G.party.length&&MAP.town&&ch!=='D'){runScript(()=>say('You can\'t go into the wild without a Wyldkin!'));return true;}runScript(()=>warpTo(w.to,w.tx,w.ty,w.dir));return true;}
  const tr=(MAP.triggers||[]).find(t=>t.x===player.x&&t.y===player.y&&(!t.cond||t.cond()));
  if(tr){runScript(tr.run);return true;}
  const tn=spotTrainer();if(tn){runScript(()=>trainerSpotted(tn));return true;}
  const ENC=MAP.encFn?MAP.encFn():MAP.enc;
  if(G.repel>0){G.repel--;if(G.repel===0){runScript(()=>say('The Repel wore off.'));return true;}}
  const grassy=ch==='"'||ch==='r'||ch==='v'||(ch==='q'&&MAP.cave);
  if(grassy&&ENC&&G.party.some(m=>m.hp>0)){const table=ch==='r'?(ENC.reeds||ENC.grass):ENC.grass;
    if(table&&table.length&&Math.random()<(ch==='q'?ENC_RATE*.6:ENC_RATE)){const mon=rollEncounter(table);const lead=G.party.find(m=>m.hp>0);if(G.repel>0&&lead&&mon.lvl<lead.lvl)return false;runScript(async()=>{await startBattle({wild:mon});});return true;}}
  return false;
}
function spotTrainer(){

    for(let i=1;i<=n.los;i++){const x=n.x+dx*i,y=n.y+dy*i;if(x===player.x&&y===player.y)return n;if(solidAt(x,y)||npcAt(x,y))break;}}
  return null;
}
async function trainerSpotted(n){

function camera(){

  const mw=MAP._w*16,mh=MAP._h*16;let cx=px+8-W/2,cy=py+8-H/2;
  cx=mw<=W?(mw-W)/2:Math.max(0,Math.min(mw-W,cx));cy=mh<=H?(mh-H)/2:Math.max(0,Math.min(mh-H,cy));
  return[Math.round(cx),Math.round(cy),px,py];
}

  return getTile(ch,(dx,dy)=>{const t=tileAt(x+dx,y+dy);return t===null?ch:t;},x,y,Math.floor(frame/32),!!MAP.indoor);
}

  const ents=[];

    const spr=charSprite(n.look)[n.dir];const f=n.moving?(n.prog<8?1:2)*((n.x+n.y)%2?1:1):0;c.drawImage(spr[n.moving?(n.prog<8?1:2):0],nx-cx,ny-cy-6);

  if(folVisible()){const t=player.moving?player.prog/16:1;const fx=(fol.px+(fol.x-fol.px)*t)*16,fy=(fol.py+(fol.y-fol.py)*t)*16;const im=folImg(folLead());
    ents.push({y:fy-0.5,draw:()=>{const hop=player.moving?-Math.abs(Math.sin(t*Math.PI))*2:(im.float?Math.sin(frame/14)*1.5:0);
      c.globalAlpha=.25;c.fillStyle='#000';c.beginPath();c.ellipse(fx-cx+8,fy-cy+14,7,2.5,0,0,7);c.fill();c.globalAlpha=1;
      c.drawImage(im[fol.dir],Math.round(fx-cx-6),Math.round(fy-cy-13+hop+(im.float?-3:0)));}});}
  ents.push({y:ppy,draw:()=>{const spr=charSprite(LOOK.player)[player.dir];let f=0;if(player.moving)f=player.prog>=4&&player.prog<12?(player.step%2?1:2):0;c.drawImage(spr[f],ppx-cx,ppy-cy-6);
    const under=tileAt(player.moving&&player.prog>8?player.tx:player.x,player.moving&&player.prog>8?player.ty:player.y);
    if(under==='"'||under==='r')c.drawImage(getTile(under,()=>under,0,0,0,false),0,10,16,6,ppx-cx,ppy-cy+10,16,6);}});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());

  if(mapLabel&&mapLabel.t>0){mapLabel.t--;const yy=mapLabel.t>130?-(mapLabel.t-130)*1.5:mapLabel.t<20?-(20-mapLabel.t)*1.5:0;box(c,4,4+yy,Math.max(90,mapLabel.text.length*6+20),20,'std');text(c,mapLabel.text,12,9+yy,'#404040',9);}
  if(player.bump>0)player.bump--;

function applyItem(k,m){

async function doTurn(act){
  B.p.flinch=B.f.flinch=false;
  const fAct=aiChoose();
  if(act.k==='run'){B.runs++;const a=B.p.mon.stats[5],b=Math.max(1,B.f.mon.stats[5]);const odds=(a*128/b+30*B.runs)%256;
    if(a>=b||Math.random()*256<odds){SFX.ok();await bsay('Got away safely!');return'run';}await bsay('Can\'t escape!');}
  else if(act.k==='switch')await switchIn(act.i,true);
  else if(act.k==='item'){const r=await useBattleItem(act);if(r==='caught')return'caught';}
  const order=[];
  if(act.k==='move'){
    const pm=act.i==='struggle'?STRUGGLE:MOVES[B.p.mon.moves[act.i].id],fm=fAct==='struggle'?STRUGGLE:MOVES[B.f.mon.moves[fAct].id];
    const pp=pm.prio||0,fp=fm.prio||0,ps=bstat(B.p,'spe'),fs=bstat(B.f,'spe');
    const pFirst=pp!==fp?pp>fp:ps!==fs?ps>fs:Math.random()<.5;
    const a={b:B.p,t:B.f,m:act.i},c={b:B.f,t:B.p,m:fAct};order.push(...(pFirst?[a,c]:[c,a]));
  } else order.push({b:B.f,t:B.p,m:fAct});
  for(let i=0;i<order.length;i++){const o=order[i];if(o.b.mon.hp<=0||o.t.mon.hp<=0)continue;if(o.b!==B.p&&o.b!==B.f)continue;
    o.b.first=i===0;await doMove(o.b,o.t,o.m);const r=await checkFaints();if(r==='win'||r==='lose')return r;if(r==='faint')break;}
  for(const a of B.assists){if(B.f.mon.hp<=0||B.p.mon.hp<=0)break;const r=await assistMove(a);if(r==='win'||r==='lose')return r;}
  for(const b of [B.f,B.p]){const m=b.mon;if(m.hp<=0)continue;
    if(m.status==='brn'||m.status==='psn'){const d=Math.max(1,Math.floor(m.stats[0]/8));m.hp=Math.max(0,m.hp-d);await shake(b);await tweenHP(b);await bsay(`${bn(b)} is hurt by its ${m.status==='brn'?'burn':'poison'}!`);
      const r=await checkFaints();if(r==='win'||r==='lose')return r;}}
  return null;
}
async function doMove(att,def,mi){
  const m=att.mon,n=bn(att);
  if(m.status==='slp'){m.slp--;if(m.slp<=0){m.status=null;await bsay(`${n} woke up!`);}else{await bsay(`${n} is fast asleep.`);return;}}
  if(m.status==='frz'){if(Math.random()<.2){m.status=null;await bsay(`${n} thawed out!`);}else{await bsay(`${n} is frozen solid!`);return;}}
  if(att.flinch){await bsay(`${n} flinched!`);return;}
  if(m.status==='par'&&Math.random()<.25){await bsay(`${n} is paralyzed! It can't move!`);return;}
  let mv;if(mi==='struggle')mv=STRUGGLE;else{const s=m.moves[mi];if(!s||s.pp<=0)mv=STRUGGLE;else{s.pp--;mv=MOVES[s.id];}}
  await bsay(`${n} used ${mv.name}!`);
  const selfT=mv.pow===0&&(mv.heal||(mv.stat&&mv.stat.who==='self'));
  if(!selfT&&mv.acc>0){const s=Math.max(-6,Math.min(6,att.st.acc-def.st.eva));const mul=s>=0?(3+s)/3:3/(3-s);if(Math.random()*100>=mv.acc*mul){await bsay(`${n}'s attack missed!`);return;}}
  const dT=SPECIES[def.mon.sid].types;
  if(mv.pow>0){
    const e=mv.type==='None'?1:effMulti(mv.type,dT);
    if(e===0){await bsay(`It doesn't affect ${bn(def)}...`);return;}
    let hits=1;if(mv.multi){const r=Math.random();hits=r<.375?2:r<.75?3:r<.875?4:5;}
    let total=0,done=0;
    for(;done<hits;){const r=calcDamage(att,def,mv,e);await lunge(att);SFX.hit();burst(def,mv.type);await blink(def);def.mon.hp=Math.max(0,def.mon.hp-r.dmg);total+=r.dmg;await tweenHP(def);done++;if(r.crit)await bsay('A critical hit!');if(def.mon.hp<=0)break;}
    if(hits>1)await bsay(`Hit ${done} time(s)!`);
    if(e>1)await bsay('It\'s super effective!');else if(e<1)await bsay('It\'s not very effective...');
    if(mv.drain&&m.hp>0&&m.hp<m.stats[0]){const h=Math.min(m.stats[0]-m.hp,Math.max(1,Math.floor(total*mv.drain)));m.hp+=h;await tweenHP(att);await bsay(`${bn(def)} had its energy drained!`);}
    if(mv.recoil&&m.hp>0){const r=Math.max(1,Math.floor(total*mv.recoil));m.hp=Math.max(0,m.hp-r);await tweenHP(att);await bsay(`${n} is hit with recoil!`);}
    if(def.mon.hp>0){
      if(mv.st&&Math.random()*100<(mv.ch||0))await inflict(def,mv.st);
      if(mv.stat&&mv.stat.who==='foe'&&Math.random()*100<mv.stat.ch)await stages(def,mv.stat.s);
      if(mv.flinch&&att.first&&Math.random()*100<mv.flinch)def.flinch=true;
      if(def.mon.status==='frz'&&mv.type==='Fire'){def.mon.status=null;await bsay(`${bn(def)} thawed out!`);}
    }
    if(mv.stat&&mv.stat.who==='self'&&m.hp>0&&Math.random()*100<mv.stat.ch)await stages(att,mv.stat.s);
  } else {
    if(mv.heal){if(m.hp>=m.stats[0]){await bsay('But it failed!');return;}m.hp=Math.min(m.stats[0],m.hp+Math.floor(m.stats[0]*mv.heal));SFX.heal();await tweenHP(att);await bsay(`${n} regained health!`);return;}
    if(mv.st){if(effMulti(mv.type,dT)===0&&mv.type==='Electric'){await bsay(`It doesn't affect ${bn(def)}...`);return;}if(!(await inflict(def,mv.st)))await bsay('But it failed!');return;}
    if(mv.stat)await stages(mv.stat.who==='self'?att:def,mv.stat.s);
  }
}
// A friend's Wyldkin backs you up: one supporting attack at the end of each turn (60% strength).
async function assistMove(a){
  const dT=SPECIES[B.f.mon.sid].types;let best=null,bv=-1;
  for(const s of a.mon.moves){const m=MOVES[s.id];if(!m.pow)continue;const e=effMulti(m.type,dT);const v=m.pow*e*(SPECIES[a.mon.sid].types.includes(m.type)?1.5:1);if(v>bv){bv=v;best=m;}}
  if(!best||bv<=0)return null;
  await bsay(`${a.owner}'s ${monName(a.mon)} used ${best.name}!`);
  const e=effMulti(best.type,dT);const r=calcDamage(a,B.f,best,e);SFX.hit();burst(B.f,best.type);await blink(B.f);
  B.f.mon.hp=Math.max(0,B.f.mon.hp-Math.max(1,Math.floor(r.dmg*.6)));await tweenHP(B.f);
  if(e>1)await bsay('It\'s super effective!');else if(e<1)await bsay('It\'s not very effective...');
  return await checkFaints();
}
function calcDamage(att,def,mv,e){
  const phys=!SPECIAL.has(mv.type);const crit=Math.random()<(mv.crit?1/8:1/16);
  let A=att.mon.stats[phys?1:3],D=def.mon.stats[phys?2:4];const as=phys?att.st.atk:att.st.spa,ds=phys?def.st.def:def.st.spd;
  A*=stageMul(crit?Math.max(0,as):as);D*=stageMul(crit?Math.min(0,ds):ds);if(phys&&att.mon.status==='brn')A/=2;
  let d=Math.floor(Math.floor(Math.floor(2*att.mon.lvl/5+2)*mv.pow*A/Math.max(1,D))/50)+2;
  if(crit)d*=2;if(SPECIES[att.mon.sid].types.includes(mv.type))d=Math.floor(d*1.5);d=Math.floor(d*e);d=Math.floor(d*(85+Math.floor(Math.random()*16))/100);
  return{dmg:Math.max(1,d),crit};
}
async function inflict(b,st){
  const m=b.mon,t=SPECIES[m.sid].types;if(m.status||m.hp<=0)return false;
  if(st==='brn'&&t.includes('Fire'))return false;if(st==='psn'&&(t.includes('Poison')||t.includes('Steel')))return false;if(st==='frz'&&t.includes('Ice'))return false;
  m.status=st;if(st==='slp')m.slp=2+Math.floor(Math.random()*3);await shake(b);
  const n=bn(b);await bsay({brn:`${n} was burned!`,psn:`${n} was poisoned!`,par:`${n} is paralyzed! It may be unable to move!`,slp:`${n} fell asleep!`,frz:`${n} was frozen solid!`}[st]);return true;
}
async function stages(b,s){for(const[k,d] of Object.entries(s)){const cur=b.st[k],nv=Math.max(-6,Math.min(6,cur+d));const n=bn(b);
  if(nv===cur){await bsay(`${n}'s ${STATNAME[k]} won't go any ${d>0?'higher':'lower'}!`);continue;}b.st[k]=nv;await shake(b);
  await bsay(`${n}'s ${STATNAME[k]} ${d>1?'sharply rose':d>0?'rose':d<-1?'harshly fell':'fell'}!`);}}
async function checkFaints(){
  let f=false;
  if(B.f.mon.hp<=0&&!B.f.fainted){B.f.fainted=true;await dropAnim(B.f);await bsay(`${bn(B.f)} fainted!`);await awardExp(B.f.mon);f=true;
    if(!B.trainer)return'win';const nx=B.foes.findIndex(m=>m.hp>0);if(nx<0)return'win';
    B.f=mkBattler(B.foes[nx],'f');B.f.hidden=true;addSeen(B.f.mon.sid);await bsay(`${B.trainer.cls} ${B.trainer.name} sent out ${monName(B.f.mon)}!`);await appearAnim(B.f);B.parts=new Set([B.pi]);}
  if(B.p.mon.hp<=0&&!B.p.fainted){B.p.fainted=true;await dropAnim(B.p);await bsay(`${monName(B.p.mon)} fainted!`);f=true;
    if(!G.party.some(m=>m.hp>0)){await say(`${G.name} is out of usable Wyldkin!`);if(!B.story)await say(`${G.name} blacked out!`);return'lose';}
    let i=-1;while(i<0||G.party[i].hp<=0){i=await teamScreen('force',{msg:'Send out which Wyldkin?'});if(G.party[i].hp<=0)await say('It has no energy left to battle!');}
    await switchIn(i,false);}
  return f?'faint':null;
}
async function switchIn(i,vol){
  if(vol){await bsay(`${monName(B.p.mon)}, come back!`);for(let t=10;t>=0;t--){B.p.scale=t/10;await wait(1);}}
  B.pi=i;B.p=mkBattler(G.party[i],'p');B.p.hidden=true;B.parts.add(i);await bsay(`Go! ${monName(B.p.mon)}!`);await appearAnim(B.p);
}
async function useBattleItem(act){
  const it=ITEMS[act.item];G.bag[act.item]--;
  if(it.kind==='ball')return await throwOrb(act.item);
  const m=G.party[act.t];await bsay(`${G.name} used ${it.name}!`);const msg=applyItem(act.item,m);SFX.heal();
  if(m===B.p.mon)await tweenHP(B.p);await bsay(msg||'It had no effect.');return null;
}
async function throwOrb(k){
  const it=ITEMS[k];await bsay(`${G.name} threw ${article(it.name)} ${it.name}!`);
  const o=B.fx.orb={x:40,y:110,rot:0};
  for(let t=0;t<=28;t++){const u=t/28;o.x=40+(178-40)*u;o.y=110+(34-110)*u-55*Math.sin(Math.PI*u);o.rot=u*12;await wait(1);}
  flashA=.7;for(let t=10;t>=0;t--){B.f.scale=t/10;await wait(1);}B.f.hidden=true;
  for(let t=0;t<=12;t++){o.y=34+t*2;o.rot=0;await wait(1);}
  const m=B.f.mon,sp=SPECIES[m.sid],M=m.stats[0];const sb=m.status==='slp'||m.status==='frz'?2:m.status?1.5:1;
  const a=Math.floor(((3*M-2*m.hp)*sp.catchRate*it.mult)/(3*M)*sb);let shakes=0;
  if(a>=255)shakes=4;else{const b=Math.floor(1048560/Math.sqrt(Math.sqrt(16711680/Math.max(1,a))));while(shakes<4&&Math.random()*65536<b)shakes++;}
  for(let i=0;i<Math.min(3,shakes);i++){await wait(16);for(let t=0;t<16;t++){o.rot=Math.sin(t/16*Math.PI*2)*.5;await wait(1);}beep(300,.04);}
  await wait(14);
  if(shakes>=4){o.caught=1;SFX.lvl();const isNew=!G.caught.includes(m.sid);await say(`Gotcha! ${sp.name} was caught!`);addCaught(m.sid);
    if(isNew)await say(`${sp.name}'s data was added to the CODEX.`);
    m.status=m.status;if(G.party.length<6){G.party.push(m);}else{G.box.push(m);await say(`Your team is full, so ${sp.name} was sent to ByteNet Storage.`);}
    return'caught';}
  B.fx.orb=null;flashA=.5;B.f.hidden=false;for(let t=0;t<=10;t++){B.f.scale=t/10;await wait(1);}
  await bsay(['Oh no! The Wyldkin broke free!','Aww! It appeared to be caught!','Aargh! Almost had it!','Shoot! It was so close, too!'][shakes]);return null;
}
// ---------------- exp / learning / evolution ----------------
async function awardExp(foe){
  const sp=SPECIES[foe.sid];const parts=[...B.parts].filter(i=>G.party[i]&&G.party[i].hp>0);if(!parts.length)return;
  const total=Math.floor(sp.baseExp*foe.lvl/7*(B.trainer?1.5:1));const each=Math.max(1,Math.floor(total/parts.length));
  for(const i of parts){const m=G.party[i];if(m.lvl>=100)continue;await bsay(`${monName(m)} gained ${each} EXP. Points!`);await gainExp(m,each,m===B.p.mon);}
  if((G.keys||[]).includes('Share Charm')){const half=Math.max(1,Math.floor(total/2));const others=G.party.filter((m,i)=>!parts.includes(i)&&m.hp>0&&m.lvl<100);if(others.length){await bsay(`The rest of your team gained ${half} EXP. Points from the Share Charm!`);for(const m of others)await gainExp(m,half,false);}}
}
async function gainExp(m,amt,active){
  const sp=SPECIES[m.sid];m.exp+=amt;
  while(m.lvl<100&&m.exp>=expFor(sp,m.lvl+1)){
    if(active)await tweenExp(1);
    m.lvl++;const old=m.stats[0];calcStats(m);if(m.hp>0)m.hp+=m.stats[0]-old;if(active){B.p.disp=m.hp;B.p.dispExp=0;}
    SFX.lvl();await say(`${monName(m)} grew to Lv ${m.lvl}!`);await learnAt(m,m.lvl);B.leveled.add(m);
  }
  if(active)await tweenExp(expFrac(m));
}
async function learnAt(m,lvl){const sp=SPECIES[m.sid];for(const[l,id] of sp.learn){if(l!==lvl||m.moves.some(s=>s.id===id))continue;await learnMove(m,id);}}
async function learnMove(m,id){
  const mv=MOVES[id],n=monName(m);
  if(m.moves.length<4){m.moves.push({id,pp:mv.pp});SFX.lvl();await say(`${n} learned ${mv.name}!`);return;}
  await say(`${n} wants to learn ${mv.name}, but ${n} already knows four moves.`);
  while(true){
    if(await yesno(`Forget a move to make room for ${mv.name}?`)){
      const r=await choose(m.moves.map(s=>MOVES[s.id].name),{x:130,y:H-112,w:108,prompt:'Which move should be forgotten?'});
      if(r>=0){const old=MOVES[m.moves[r].id].name;m.moves[r]={id,pp:mv.pp};await say(`1, 2, and... Poof! ${n} forgot ${old}. And ${n} learned ${mv.name}!`);return;}
    }
    if(await yesno(`Give up on learning ${mv.name}?`)){await say(`${n} did not learn ${mv.name}.`);return;}
  }
}
async function evolveScene(m){
  const from=m.sid,to=SPECIES[from].evo.to;const prevScene=scene;
  EVO={show:from,white:false,t:0};scene='evo';await fadeTo(0,12);
  await say(`What? ${monName(m)} is evolving!`);
  let cancel=false;EVO.white=true;
  for(let t=0;t<220;t++){const per=Math.max(3,24-t/10);EVO.show=Math.floor(t/per)%2?to:from;EVO.t=t;if(held.b){cancel=true;break;}await wait(1);}
  EVO.white=false;
  if(cancel){EVO.show=from;await say(`Huh? ${monName(m)} stopped evolving!`);}
  else{flashA=1;const old=monName(m);m.sid=to;const o=m.stats[0];calcStats(m);if(m.hp>0)m.hp+=m.stats[0]-o;EVO.show=to;addCaught(to);SFX.lvl();
    await say(`Congratulations! Your ${old} evolved into ${SPECIES[to].name}!`);await learnAt(m,m.lvl);}
  await fadeTo(1,12);scene=prevScene;
}
// ---------------- animation helpers ----------------
async function lunge(b){const d=b.side==='p'?1:-1;for(let t=0;t<5;t++){b.dx=d*t*2;await wait(1);}for(let t=5;t>=0;t--){b.dx=d*t*2;await wait(1);}}
async function blink(b){for(let i=0;i<4;i++){b.blink=true;await wait(3);b.blink=false;await wait(3);}}
async function shake(b){for(let t=0;t<12;t++){b.dx=(t%2?3:-3);await wait(1);}b.dx=0;}
async function appearAnim(b){b.hidden=false;flashA=.4;for(let t=0;t<=10;t++){b.scale=t/10;await wait(1);}b.scale=1;}
async function dropAnim(b){beep(200,.2,'triangle',.05);for(let t=0;t<=20;t++){b.drop=t*3.2;await wait(1);}b.hidden=true;b.drop=0;}
function tweenHP(b){return new Promise(r=>{const step=()=>{const tgt=b.mon.hp,sp=Math.max(.35,b.mon.stats[0]/45);if(Math.abs(b.disp-tgt)<=sp){b.disp=tgt;r();return;}b.disp+=Math.sign(tgt-b.disp)*sp;timers.push({t:1,r:step});};step();});}
function tweenExp(target){return new Promise(r=>{const b=B.p;const step=()=>{if(Math.abs(b.dispExp-target)<=.02){b.dispExp=target;r();return;}b.dispExp+=Math.sign(target-b.dispExp)*.02;timers.push({t:1,r:step});};step();});}
// ---------------- render ----------------
const BG={beach:['#f8f8e8','#a8e0f0','#f0e0a8','#d0b878'],snow:['#f0f8ff','#d0e0f0','#e8f0f8','#b8c8d8'],cave:['#504038','#685848','#806a58','#584638'],volcano:['#f8d8c0','#d8a088','#b88868','#906050'],grass:['#f8f8e0','#c8e8a8','#a8d880','#80b860'],forest:['#d8e8c8','#98c890','#80b070','#588848'],indoor:['#f0e8d8','#d8d0c0','#c8c0a8','#a09880'],gym:['#e8e8f0','#c8c8d8','#b8b8c8','#9090a8']};
function drawBattle(c){
  if(scene==='evo'||!B){drawEvo(c);return;}
  const bg=BG[B.bg]||BG.grass;const g=c.createLinearGradient(0,0,0,114+OY);g.addColorStop(0,bg[0]);g.addColorStop(1,bg[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<5+Math.floor(OY/18);i++)c.fillRect(0,20+i*18,W,1);
  c.save();c.translate(0,OY);
  const sl=B.fx.slide*160;
  const plat=(x,y,rx,ry)=>{c.fillStyle=bg[3];c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();c.fillStyle=bg[2];c.beginPath();c.ellipse(x,y-1,rx-3,ry-2.5,0,0,7);c.fill();};
  plat(178-sl,64,48,11);plat(62+sl,108,56,12);

  drawMon(c,B.f,'f',sl);drawMon(c,B.p,'p',sl);
  (B.fx.parts||[]).forEach(p=>{c.globalAlpha=Math.min(1,p.l/12);c.fillStyle=p.c;c.fillRect(p.x-1,p.y-1,3,3);});c.globalAlpha=1;
  if(B.fx.orb){const o=B.fx.orb;c.save();c.translate(o.x,o.y);c.rotate(o.rot);c.drawImage(ORB_IMG,-8,-9);c.restore();if(o.caught&&frame%20<10)text(c,'✦',o.x+6,o.y-12,'#f0d050',8,false);}
  if(B.fx.slide===0&&!B.f.hidden&&!B.fx.tf){const m=B.f.mon;box(c,6,10,106,30,'info');text(c,monName(m),12,13,'#404040',9);text(c,`Lv${m.lvl}`,106,14,'#404040',8,true,'right');
    if(G.caught.includes(m.sid)&&B.wild)c.drawImage(ORB_IMG,94,25,9,9);text(c,'HP',12,26,'#e09020',7);hpBar(c,24,27,68,B.f.disp,m.stats[0]);
    if(m.status){c.fillStyle=STATUS_COL[m.status];c.fillRect(70,14,20,8);text(c,STATUS_TAG[m.status],80,14.5,'#fff',6,false,'center');}}
  if(!B.p.hidden||B.p.fainted){const m=B.p.mon;if(!B.p.hidden){box(c,126,72,110,40,'info');text(c,monName(m),132,75,'#404040',9);text(c,`Lv${m.lvl}`,230,76,'#404040',8,true,'right');
    text(c,'HP',134,88,'#e09020',7);hpBar(c,146,89,84,B.p.disp,m.stats[0]);text(c,`${Math.ceil(B.p.disp)}/${m.stats[0]}`,230,95,'#404040',8,true,'right');
    c.fillStyle='#404040';c.fillRect(146,106,86,3);c.fillStyle='#48a8f8';c.fillRect(147,107,84*B.p.dispExp,1);text(c,'EXP',130,103,'#808080',5);
    if(m.status){c.fillStyle=STATUS_COL[m.status];c.fillRect(134,96,22,8);text(c,STATUS_TAG[m.status],145,96.5,'#fff',6,false,'center');}}}
  if(!ui.length){box(c,2,114,236,44,'dark');}
  c.restore();
}
function drawMon(c,b,side,sl){
  if(!b||b.hidden||b.blink)return;const spr=monSpr(b.mon);const img=side==='f'?spr.front:spr.back;
  const big=side==='p'?1.2:1;const cx=side==='f'?178-sl:62+sl,by=side==='f'?66:113;const w=64*b.scale*big,h=64*b.scale*big;
  let x=cx-w/2+b.dx,y=by-h+(spr.float?-8+Math.sin(frame/16)*2:0);
  c.save();c.beginPath();c.rect(0,0,W,by+(spr.float?-6:1));c.clip();c.drawImage(img,x,y+b.drop,w,h);
  if(b.scale<1&&b.scale>0){c.globalAlpha=1-b.scale;c.drawImage(silhouette(b.mon.sid,'#ffffff'),side==='f'?x:x,y,w,h);if(side==='p'){} }
  c.restore();
}
function drawEvo(c){
  c.fillStyle='#202838';c.fillRect(0,0,W,H);if(!EVO)return;c.save();c.translate(0,Math.max(0,MY-10));
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2+frame/60,r=40+((frame*1.5+i*20)%60);c.fillStyle=`rgba(255,240,180,${.5-(r-40)/120})`;c.fillRect(120+Math.cos(a)*r,56+Math.sin(a)*r,2,2);}
  const img=EVO.white?silhouette(EVO.show,'#ffffff'):spriteOf(EVO.show).front;c.drawImage(img,88,24);c.restore();
}
