// =====================================================================
//  NEARBY TRADE (same Wi-Fi): iPhone and Android apps, and they can trade with each other.
//  Both apps use Bonjour/mDNS "_wyldtrade._tcp" + TCP (PeerLink.swift / PeerBridge.java).
//  The web app can't reach other devices without a server, so it uses QR codes instead.
// =====================================================================
const PEER={inbox:[],waiters:[],peers:[],onPeers:null,onInvite:null,connected:null,
  ok(){return!!(window.AndroidPeer||(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.wbPeer));},
  post(o){try{if(window.AndroidPeer){const A=window.AndroidPeer;if(o.op==='start')A.start(o.name);else if(o.op==='stop')A.stop();else if(o.op==='invite')A.invite(o.id);else if(o.op==='answer')A.answer(o.id,!!o.ok);else if(o.op==='send')A.send(o.data);return;}
    window.webkit.messageHandlers.wbPeer.postMessage(o);}catch(e){}},
  push(ev){const w=this.waiters.shift();if(w)w(ev);else this.inbox.push(ev);},
  next(ms){return new Promise(res=>{if(this.inbox.length)return res(this.inbox.shift());let done=false;const w=ev=>{if(done)return;done=true;res(ev);};this.waiters.push(w);
    if(ms)setTimeout(()=>{if(done)return;done=true;this.waiters=this.waiters.filter(x=>x!==w);res({type:'timeout'});},ms);});}};
window.WBPeerEvent=ev=>{
  if(ev.type==='peers'){PEER.peers=ev.list||[];PEER.onPeers&&PEER.onPeers();return;}
  if(ev.type==='invite'){PEER.onInvite&&PEER.onInvite(ev);return;}
  if(ev.type==='connected'){PEER.connected=ev.name;}
  if(ev.type==='disconnected'&&PEER.connected!==ev.name)return;
  if(ev.type==='data'){try{ev.msg=JSON.parse(ev.data);}catch(e){return;}}
  PEER.push(ev);};
// Find a nearby trainer and connect. Resolves to their name, or null.
function nearbyConnect(){return new Promise(res=>{const ov=document.getElementById('overlay');ov.innerHTML='';ov.style.display='flex';
  const card=document.createElement('div');card.className='card';ov.appendChild(card);
  const close=v=>{PEER.onPeers=null;PEER.onInvite=null;ov.style.display='none';ov.innerHTML='';res(v);};
  card.innerHTML='<h3>Nearby trade</h3><p style="font-size:13px;color:#605848;margin:4px 0 8px">Both phones (iPhone or Android): connect to the same Wi-Fi and open TRADE → NEARBY TRADE. Tap your friend\'s name when it shows up.</p>';
  const list=document.createElement('div');card.appendChild(list);const msg=document.createElement('p');msg.style.cssText='font-size:13px;color:#806040;margin:6px 0';card.appendChild(msg);
  const row=document.createElement('div');row.className='row';card.appendChild(row);const cn=document.createElement('button');cn.textContent='Cancel';row.appendChild(cn);cn.onclick=()=>{PEER.post({op:'stop'});close(null);};
  const draw=()=>{list.innerHTML='';if(!PEER.peers.length){list.innerHTML='<p style="font-size:13px;color:#908070">Looking for nearby trainers...</p>';return;}
    PEER.peers.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.style.cssText='display:block;width:100%;margin:4px 0';b.onclick=()=>{msg.textContent=`Asking ${p.name}...`;PEER.post({op:'invite',id:p.id});};list.appendChild(b);});};
  PEER.onPeers=draw;draw();
  PEER.onInvite=ev=>{list.innerHTML='';msg.textContent='';const q=document.createElement('p');q.textContent=`${ev.name} wants to trade with you.`;q.style.cssText='font-size:14px;margin:6px 0';list.appendChild(q);
    const r2=document.createElement('div');r2.className='row';list.appendChild(r2);const y=document.createElement('button');y.textContent='Accept';const n=document.createElement('button');n.textContent='Decline';r2.appendChild(y);r2.appendChild(n);
    y.onclick=()=>{PEER.post({op:'answer',id:ev.id,ok:true});msg.textContent='Connecting...';};n.onclick=()=>{PEER.post({op:'answer',id:ev.id,ok:false});draw();};};
  (async()=>{while(true){const ev=await PEER.next();if(ov.style.display==='none')return;if(ev.type==='connected'){close(ev.name);return;}if(ev.type==='error')msg.textContent='Problem: '+ev.message;}})();
});}
// ---- Safe nearby trades: a journal is saved before anything changes, and the swap only happens
//      once both games have saved that they're ready. If the connection drops, both games keep their
//      own Wyldkin. In the rare case the drop happens in the final split second, the next nearby
//      connection between the same two games settles it automatically, the same way on both phones.
function tradeLogHas(tid,outcome){return(G.tradeLog||[]).some(e=>e.tid===tid&&(!outcome||e.outcome===outcome));}
function tradeLogAdd(tid,partner,outcome){G.tradeLog=(G.tradeLog||[]).concat({tid,partner,outcome}).slice(-40);}
function findTagged(tid){for(const arr of [G.party,G.box]){const i=arr.findIndex(m=>m.tk===tid);if(i>=0)return{arr,i};}return null;}
function swapNow(j){const f=findTagged(j.tid);if(f)f.arr.splice(f.i,1);const t=cleanMon(j.theirs);delete t.tk;receiveMon(t,j.partnerName);}
function clearTag(tid){const f=findTagged(tid);if(f)delete f.arr[f.i].tk;}
function helloMsg(theirGid){const j=G.tradeJournal;return{t:'hello',gid:G.gid,journal:j&&{tid:j.tid,role:j.role,state:j.state,partner:j.partner},log:(G.tradeLog||[]).filter(e=>!theirGid||e.partner===theirGid)};}
// Settle an unfinished trade with this partner (both phones run the same rules on the same data).
async function reconcile(h){const j=G.tradeJournal;if(!j||j.partner!==h.gid)return;
  const tj=h.journal&&h.journal.tid===j.tid?h.journal:null,tl=(h.log||[]).find(e=>e.tid===j.tid);
  let finish;
  if(j.role==='L')finish=j.state==='committed';                       // the leader committed → it happened
  else finish=(tj&&tj.state==='committed')||(tl&&tl.outcome==='completed'); // follower finishes only if the leader committed
  if(finish){if(j.role==='F')swapNow(j);else clearTag(j.tid);
    tradeLogAdd(j.tid,j.partner,'completed');G.tradeJournal=null;writeSave('manual');
    await say(j.role==='F'?`Your unfinished trade with ${j.partnerName} is now complete. You received ${monName(j.theirs)}.`:`Your earlier trade with ${j.partnerName} is fully settled.`);}
  else{clearTag(j.tid);tradeLogAdd(j.tid,j.partner,'aborted');G.tradeJournal=null;writeSave('manual');
    await say(`Your unfinished trade with ${j.partnerName} was cancelled. You kept ${monName(j.mine)}.`);}}
async function nearbyTrade(){
  if(!PEER.ok())return say('Nearby trading over Wi-Fi works in the WyldBound phone apps (iPhone and Android). In the web app, trade with QR codes instead.');
  if(!G.tradeJournal&&G.party.length<2)return say('You need at least two Wyldkin on your team to trade one away.');
  PEER.inbox=[];PEER.waiters=[];PEER.connected=null;gameId();PEER.post({op:'start',name:G.name});
  const who=await nearbyConnect();if(!who)return;
  const send=o=>PEER.post({op:'send',data:JSON.stringify(o)});
  const end=async(m)=>{PEER.post({op:'stop'});PEER.connected=null;if(m)await say(m);};
  const nextData=async(ms,want)=>{while(true){const ev=await PEER.next(ms);if(ev.type==='disconnected'||ev.type==='timeout')return null;if(ev.type!=='data')continue;if(!want||want.includes(ev.msg.t)||ev.msg.t==='quit')return ev.msg;}};
  await say(`Connected to ${who.replace(/ #\d+$/,'')}!`);
  // 1. say hello and settle any unfinished trade between these two games
  send(helloMsg());const hello=await nextData(20000,['hello']);if(!hello||hello.t!=='hello')return end('The connection was lost.');
  if(G.tradeJournal){if(G.tradeJournal.partner===hello.gid){await reconcile(hello);}else{send({t:'quit'});return end(`You have an unfinished trade with ${G.tradeJournal.partnerName}. Connect with them first to settle it.`);}}
  if(hello.journal&&hello.journal.partner===G.gid&&!G.tradeJournal){/* they'll settle on their side using our log */}
  if(G.party.length<2){send({t:'quit'});return end('You need at least two Wyldkin on your team to trade one away.');}
  if(!await yesno('Start a new trade?')){send({t:'quit'});return end();}
  // 2. pick and show offers
  const i=await pickToTrade('Which Wyldkin will you offer?');
  if(i==null){send({t:'quit'});return end('You left the trade.');}
  const mine=G.party[i];send({t:'offer',gid:G.gid,from:G.name,mon:mine});
  await say('Waiting for your friend to pick a Wyldkin...',{auto:1});
  const offer=await nextData(180000,['offer']);if(!offer)return end('The connection was lost. Nothing was traded.');if(offer.t==='quit')return end('Your friend left the trade. Nothing was traded.');
  const theirs=cleanMon(offer.mon);if(!theirs){send({t:'quit'});return end('Something is wrong with that Wyldkin\'s data. Nothing was traded.');}
  const ok=await yesno(`${offer.from} offers ${monName(theirs)} (${SPECIES[theirs.sid].name} Lv${theirs.lvl}). Trade your ${monName(mine)} for it?`);
  send({t:'ready',ok});if(!ok)return end('You declined. Nothing was traded.');
  await say('Waiting for your friend to confirm...',{auto:1});
  const rd=await nextData(180000,['ready']);if(!rd)return end('The connection was lost. Nothing was traded.');if(rd.t==='quit'||!rd.ok)return end('Your friend declined. Nothing was traded.');
  // 3. two-step commit
  const lead=G.gid<offer.gid,partner=offer.gid,partnerName=offer.from;
  const journal=tid=>{mine.tk=tid;G.tradeJournal={tid,role:lead?'L':'F',state:'prepared',partner,partnerName,mine:JSON.parse(JSON.stringify(mine)),theirs};writeSave('manual');}; // save BEFORE the trade
  const lost='The connection dropped, so the trade was cancelled. You kept your Wyldkin.';
  if(lead){const tid=G.gid+'-'+partner+'-'+Date.now().toString(36);journal(tid);send({t:'prepare',tid});
    const pr=await nextData(12000,['prepared']);
    if(!pr||pr.t!=='prepared'||pr.tid!==tid){clearTag(tid);tradeLogAdd(tid,partner,'aborted');G.tradeJournal=null;writeSave('manual');return end(lost);}
    G.tradeJournal.state='committed';swapNow(G.tradeJournal);writeSave('manual');send({t:'commit',tid});     // swap + save together
    await tradeScene(mine,theirs,partnerName);
    const dn=await nextData(12000,['done']);
    if(dn&&dn.t==='done'){tradeLogAdd(tid,partner,'completed');G.tradeJournal=null;writeSave('manual');return end();}   // save AFTER it's fully done
    return end(`The trade finished on your side, but the connection dropped before ${partnerName}'s game confirmed. Next time you both open NEARBY TRADE, their game will finish it automatically.`);}
  else{const pp=await nextData(12000,['prepare']);if(!pp||pp.t!=='prepare')return end(lost);
    journal(pp.tid);send({t:'prepared',tid:pp.tid});
    const cm=await nextData(15000,['commit']);
    if(!cm||cm.t!=='commit'){return end(`The connection dropped at the last second, so this trade is on hold and you still have ${monName(mine)}. Next time you and ${partnerName} open NEARBY TRADE, both games will settle it the same way.`);}
    swapNow(G.tradeJournal);tradeLogAdd(pp.tid,partner,'completed');G.tradeJournal=null;writeSave('manual');send({t:'done',tid:pp.tid});
    await tradeScene(mine,theirs,partnerName);return end();}
}

function assignEncounters(){
  for(let r=0;r<3;r++){
    const maps=Object.values(NODES).filter(sp=>sp.region===r&&(sp.kind==='route'||sp.kind==='cave')&&!sp.legend).sort((a,b)=>a.prog-b.prog);
    const natives=SPECIES.filter(s=>s.prevo==null&&(s.rar==='c'||s.rar==='u')&&s.region===r&&!AQUATIC(s));
    const tables={};maps.forEach(m=>tables[m.id]={grass:[],fish:[]});
    const add=(mid,s,w,kind='grass')=>{const t=tables[mid][kind];if(t.some(e=>e[0]===s.name))return;const sp=NODES[mid];const lv=lvAt(r,sp.prog);t.push([s.name,Math.max(2,lv-2-(kind==='fish'?1:0)),lv+1,w]);};
    natives.forEach(s=>{
      const cand=maps.map(m=>({m,sc:habScore(s,m.biome||(m.kind==='cave'?'cave':'meadow'))})).filter(c=>c.sc>0);
      if(!cand.length)cand.push(...maps.map(m=>({m,sc:.1})));
      cand.sort((a,b)=>b.sc-a.sc||(s.rar==='u'?b.m.prog-a.m.prog:a.m.prog-b.m.prog));
      const picks=[];for(const c of cand){if(picks.length>=2)break;if(s.rar==='u'&&c.m.prog<.25&&cand.some(x=>x.m.prog>=.25&&x.sc>=c.sc*.7))continue;if(picks.some(p=>Math.abs(p.prog-c.m.prog)<.08))continue;picks.push(c.m);}

    });

    maps.forEach(m=>{const R=mulberry32(hashStr(m.id+'v'));const biome=m.biome||(m.kind==='cave'?'cave':'meadow');const lv=lvAt(r,m.prog);
      if(r>0){const old=SPECIES.filter(s=>s.prevo==null&&s.region<r&&(s.rar==='c'||s.rar==='u')&&!AQUATIC(s)&&habScore(s,biome)>=2);for(let i=0;i<3&&old.length;i++)add(m.id,old[Math.floor(R()*old.length)],5);}
      if(m.prog>=.5){const evs=SPECIES.filter(s=>s.prevo!=null&&s.region<=r&&s.rar!=='r'&&s.rar!=='L'&&validAt(s,lv)&&habScore(s,biome)>=2&&!AQUATIC(s));for(let i=0;i<2&&evs.length;i++)add(m.id,evs[Math.floor(R()*evs.length)],3);}
      if(tables[m.id].grass.length<5){const extra=SPECIES.filter(s=>s.prevo==null&&s.region<=r&&(s.rar==='c'||s.rar==='u')&&!AQUATIC(s)).sort((a,b)=>habScore(b,biome)-habScore(a,biome));for(const s of extra){if(tables[m.id].grass.length>=6)break;add(m.id,s,6);}}
      (RARE_PLACE[m.id]||[]).forEach(([nm,w])=>add(m.id,SP_BY[nm],w));
    });
    // fishing
    const fishMaps=maps.filter(m=>MAPS[m.id].rows.some(row=>row.includes('~')));
    const fishers=SPECIES.filter(s=>s.prevo==null&&(s.rar==='c'||s.rar==='u')&&s.region<=r&&s.types.includes('Water')).sort((a,b)=>(b.region===r)-(a.region===r));
    const natFish=fishers.filter(s=>s.region===r);
    natFish.forEach((s,i)=>{if(fishMaps.length)add(fishMaps[i%fishMaps.length].id,s,s.rar==='u'?5:12,'fish');if(fishMaps.length>1)add(fishMaps[(i+3)%fishMaps.length].id,s,6,'fish');});
    fishMaps.forEach(m=>{const R=mulberry32(hashStr(m.id+'f'));if(r===0)add(m.id,SP_BY.Flopfish,14,'fish');while(tables[m.id].fish.length<4)add(m.id,fishers[Math.floor(R()*fishers.length)],6,'fish');(RARE_FISH[m.id]||[]).forEach(([nm,w])=>add(m.id,SP_BY[nm],w,'fish'));});
    // Crowded grass tables (lots of common natives on one route) get tiered odds and a little level spread, so some Wyldkin feel rare.
    maps.forEach(m=>{const g=tables[m.id].grass;const com=g.filter(e=>e[3]>=12);if(com.length<6)return;const R=mulberry32(hashStr(m.id+'tier'));
      for(let i=com.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[com[i],com[j]]=[com[j],com[i]];}
      const W=[22,18,15,12,10,8,6,5,4,3,3,2,2,2,1,1];com.forEach((e,i)=>{e[3]=W[Math.min(i,W.length-1)];const lo=e[1]+Math.floor(R()*3)-1,hi=e[2]+Math.floor(R()*3)-1;e[1]=Math.max(2,Math.min(lo,hi));e[2]=Math.max(e[1],hi);});});
    maps.forEach(m=>{MAPS[m.id].enc={grass:tables[m.id].grass,fish:tables[m.id].fish.length?tables[m.id].fish:null};});
  }

  MAPS.route2.enc.fish=[['Flopfish',5,8,14],['Finnow',6,9,10],['Jellume',6,9,6],['Drifthorse',7,9,4]];
  MAPS.hearthollow.enc={grass:[],fish:[['Flopfish',4,6,14],['Finnow',4,6,8],['Puddlepup',5,5,0]]};

}

// Any NPC that ended up on a solid tile (table, wall, gym obstacle, roof) moves to the nearest free floor tile.
function fixNpcSpots(){
  for(const id in MAPS){const m=prepMap(id);if(!m.npcs||!m.npcs.length)continue;const R=m.rows;
    const solid=(x,y)=>x<0||y<0||x>=m._w||y>=m._h||SOLID.has(R[y][x]);

    const occ=new Set(m.npcs.map(n=>n.x+','+n.y));
    for(const n of m.npcs){if(!solid(n.x,n.y))continue;
      const seen=new Set([n.x+','+n.y]),q=[[n.x,n.y]];let found=null;
      while(q.length&&!found){const[x,y]=q.shift();for(const[dx,dy]of[[0,1],[1,0],[0,-1],[-1,0]]){const X=x+dx,Y=y+dy,k=X+','+Y;if(seen.has(k)||X<0||Y<0||X>=m._w||Y>=m._h)continue;seen.add(k);
        if(!solid(X,Y)&&!bad(X,Y)&&!occ.has(k)){found=[X,Y];break;}q.push([X,Y]);}}
      if(found){occ.delete(n.x+','+n.y);n.x=found[0];n.y=found[1];occ.add(found.join(','));}}}
}

      const d=s.dr[(i%16)];if(d&&d!=='.')drum(d,t);
    }
    MUS.step++;MUS.next+=stepDur;
    if(s.once&&MUS.step>=total){MUS.cur=MUS.after||null;MUS.step=0;MUS.after=null;break;}
  }
}

async function startMenu(){
  SFX.ok();
  let sel=0;
  while(true){
    const items=[];if(G.flags.starter)items.push('CODEX');if(G.party.length)items.push('TEAM');items.push('BAG');if(travelTargets().length>1&&!MAP.indoor)items.push('TRAVEL');items.push(G.name.toUpperCase());if(nuzOn())items.push('MEMORIAL');items.push('SAVE','OPTIONS','EXIT');
    const r=await choose(items,{x:W-84,y:2,w:82,start:sel});if(r<0||items[r]==='EXIT')return;sel=r;const it=items[r];
    if(it==='MEMORIAL')await memorialScreen();
    if(it==='TRADE')await tradeMenu();
    if(it==='CODEX')await codexScreen();
    else if(it==='TEAM')await teamScreen('view');
    else if(it==='BAG')await bagScreen('field');
    else if(it==='SAVE'){if(await saveConfirm())return;}
    else if(it==='OPTIONS')await optionsMenu();
    else if(it==='TRAVEL'){if(await travelMenu())return;}
    else await trainerCard();
  }
}

async function optionsMenu(){

    if(opt.optional){const cb=document.createElement('button');cb.textContent='Cancel';row.appendChild(cb);cb.onclick=()=>close(null);}

    sugRow(opt.sugs,n=>{i.value=n;});

    const paint=()=>bs.forEach(([v,b])=>{b.style.opacity=v===gv?'1':'.4';b.style.outline=v===gv?'2px solid #404858':'none';});paint();card.appendChild(row);
    const b=document.createElement('button');b.textContent='OK';b.style.marginTop='10px';card.appendChild(b);b.onclick=()=>close({name:(i.value.trim()||opt.def).slice(0,11),g:gv});
    i.addEventListener('keydown',e=>{if(e.key==='Enter')b.onclick();});}
  else if(kind==='export'){h.textContent='Save code (back this up somewhere safe)';const t=document.createElement('textarea');t.readOnly=true;t.value=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,t:Date.now(),G}))));card.appendChild(t);
    const row=document.createElement('div');row.className='row';card.appendChild(row);

// ----- bag -----
function bagItems(filter){return ITEM_ORDER.filter(k=>(G.bag[k]||0)>0&&(!filter||filter(ITEMS[k])));}
function applyItem(k,m){
  const it=ITEMS[k];
  if(it.kind==='heal'){if(m.hp<=0||m.hp>=m.stats[0])return null;const h=Math.min(it.amt,m.stats[0]-m.hp);m.hp+=h;return`${monName(m)}'s HP was restored by ${h} point(s).`;}
  if(it.kind==='cure'){if(!m.status||m.hp<=0)return null;m.status=null;m.slp=0;return`${monName(m)} is cured!`;}
  if(it.kind==='revive'){if(nuzOn())return null;if(m.hp>0)return null;m.hp=Math.floor(m.stats[0]/2);return`${monName(m)} was revived!`;}
  return null;
}
async function bagScreen(ctxMode){
  let sel=0;
  while(true){
    const keys=bagItems();
    const r=await listMenu({title:'BAG',titleRight:()=>`$${G.money}`,items:keys.map(k=>({label:ITEMS[k].name,right:'x'+G.bag[k]})),rows:7,start:Math.min(sel,Math.max(0,keys.length-1)),empty:'Your bag is empty.',
      onDraw:(c,s)=>{const k=keys[s];box(c,0,124,W,36);if(k){c.drawImage(k.includes('orb')?ORB_IMG:ORB_IMG,6,134);wrapText(c,ITEMS[k].desc,200).forEach((l,i)=>text(c,l,28,130+i*12));}}});
    if(r<0)return null;sel=r;const k=keys[r],it=ITEMS[k];
    if(ctxMode==='battle')return k;
    if(it.kind==='ball'){await say('You can\'t use that here. Throw it during a wild battle!');continue;}
    if(it.kind==='repel'){if(G.repel>0){await say('A Repel is already working.');continue;}G.repel=it.steps;G.bag[k]--;SFX.heal();await say(`${G.name} used the ${it.name}. Weak wild Wyldkin will stay away.`);continue;}
    const t=await teamScreen('target',{msg:`Use ${it.name} on which?`});if(t<0)continue;

  const it=ITEMS[k];await bsay(`${G.name} threw ${article(it.name)} ${it.name}!`);
  const o=B.fx.orb={x:40,y:110,rot:0};
  for(let t=0;t<=28;t++){const u=t/28;o.x=40+(178-40)*u;o.y=110+(34-110)*u-55*Math.sin(Math.PI*u);o.rot=u*12;await wait(1);}
  flashA=.7;for(let t=10;t>=0;t--){B.f.scale=t/10;await wait(1);}B.f.hidden=true;
  for(let t=0;t<=12;t++){o.y=34+t*2;o.rot=0;await wait(1);}
  const m=B.f.mon,sp=SPECIES[m.sid],M=m.stats[0];const sb=m.status==='slp'||m.status==='frz'?2:m.status?1.5:1;
  const a=Math.floor(((3*M-2*m.hp)*sp.catchRate*it.mult)/(3*M)*sb);let shakes=0;
  if(a>=255)shakes=4;else{const b=Math.floor(1048560/Math.sqrt(Math.sqrt(16711680/Math.max(1,a))));while(shakes<4&&Math.random()*65536<b)shakes++;}
  for(let i=0;i<Math.min(3,shakes);i++){await wait(16);for(let t=0;t<16;t++){o.rot=Math.sin(t/16*Math.PI*2)*.5;await wait(1);}beep(300,.04);}
  await wait(14);
  if(shakes>=4){o.caught=1;SFX.lvl();const isNew=!G.caught.includes(m.sid);await say(`Gotcha! ${sp.name} was caught!`);addCaught(m.sid);
    if(isNew)await say(`${sp.name}'s data was added to the CODEX.`);
    if(nuzOn())await nuzNickname(m);else await offerNickname(m);
    m.status=m.status;if(G.party.length<6){G.party.push(m);}else{G.box.push(m);await say(`Your team is full, so ${sp.name} was sent to ByteNet Storage.`);}
    return'caught';}
  B.fx.orb=null;flashA=.5;B.f.hidden=false;for(let t=0;t<=10;t++){B.f.scale=t/10;await wait(1);}
  await bsay(['Oh no! The Wyldkin broke free!','Aww! It appeared to be caught!','Aargh! Almost had it!','Shoot! It was so close, too!'][shakes]);return null;
}
// ---------------- exp / learning / evolution ----------------
async function awardExp(foe){
  const sp=SPECIES[foe.sid];const parts=[...B.parts].filter(i=>G.party[i]&&G.party[i].hp>0);if(!parts.length)return;
  const total=Math.floor(sp.baseExp*foe.lvl/7*(B.trainer?1.5:1));const each=Math.max(1,Math.floor(total/parts.length));
  for(const i of parts){const m=G.party[i];if(m.lvl>=100)continue;await bsay(`${monName(m)} gained ${each} EXP. Points!`);await gainExp(m,each,m===B.p.mon);}
  if((G.keys||[]).includes('Share Charm')){const half=Math.max(1,Math.floor(total/2));const others=G.party.filter((m,i)=>!parts.includes(i)&&m.hp>0&&m.lvl<100);if(others.length){await bsay(`The rest of your team gained ${half} EXP. Points from the Share Charm!`);for(const m of others)await gainExp(m,half,false);}}
}
async function gainExp(m,amt,active){
  const sp=SPECIES[m.sid];m.exp+=amt;
  while(m.lvl<100&&m.exp>=expFor(sp,m.lvl+1)){
    if(active)await tweenExp(1);
    m.lvl++;const old=m.stats[0];calcStats(m);if(m.hp>0)m.hp+=m.stats[0]-old;if(active){B.p.disp=m.hp;B.p.dispExp=0;}
    SFX.lvl();await say(`${monName(m)} grew to Lv ${m.lvl}!`);await learnAt(m,m.lvl);B.leveled.add(m);
  }
  if(active)await tweenExp(expFrac(m));
}
async function learnAt(m,lvl){const sp=SPECIES[m.sid];for(const[l,id] of sp.learn){if(l!==lvl||m.moves.some(s=>s.id===id))continue;await learnMove(m,id);}}
async function learnMove(m,id){
  const mv=MOVES[id],n=monName(m);
  if(m.moves.length<4){m.moves.push({id,pp:mv.pp});SFX.lvl();await say(`${n} learned ${mv.name}!`);return;}
  await say(`${n} wants to learn ${mv.name}, but ${n} already knows four moves.`);
  while(true){
    if(await yesno(`Forget a move to make room for ${mv.name}?`)){
      const r=await choose(m.moves.map(s=>MOVES[s.id].name),{x:130,y:H-112,w:108,prompt:'Which move should be forgotten?'});
      if(r>=0){const old=MOVES[m.moves[r].id].name;m.moves[r]={id,pp:mv.pp};await say(`1, 2, and... Poof! ${n} forgot ${old}. And ${n} learned ${mv.name}!`);return;}
    }
    if(await yesno(`Give up on learning ${mv.name}?`)){await say(`${n} did not learn ${mv.name}.`);return;}
  }
}
async function evolveScene(m){
  const from=m.sid,to=SPECIES[from].evo.to;const prevScene=scene;
  EVO={show:from,white:false,t:0};scene='evo';await fadeTo(0,12);
  await say(`What? ${monName(m)} is evolving!`);
  let cancel=false;EVO.white=true;
  for(let t=0;t<220;t++){const per=Math.max(3,24-t/10);EVO.show=Math.floor(t/per)%2?to:from;EVO.t=t;if(held.b){cancel=true;break;}await wait(1);}
  EVO.white=false;
  if(cancel){EVO.show=from;await say(`Huh? ${monName(m)} stopped evolving!`);}
  else{flashA=1;const old=monName(m);m.sid=to;const o=m.stats[0];calcStats(m);if(m.hp>0)m.hp+=m.stats[0]-o;EVO.show=to;addCaught(to);SFX.lvl();
    await say(`Congratulations! Your ${old} evolved into ${SPECIES[to].name}!`);await learnAt(m,m.lvl);}
  await fadeTo(1,12);scene=prevScene;
}
// ---------------- animation helpers ----------------
async function lunge(b){const d=b.side==='p'?1:-1;for(let t=0;t<5;t++){b.dx=d*t*2;await wait(1);}for(let t=5;t>=0;t--){b.dx=d*t*2;await wait(1);}}
async function blink(b){for(let i=0;i<4;i++){b.blink=true;await wait(3);b.blink=false;await wait(3);}}
async function shake(b){for(let t=0;t<12;t++){b.dx=(t%2?3:-3);await wait(1);}b.dx=0;}
async function appearAnim(b){b.hidden=false;flashA=.4;for(let t=0;t<=10;t++){b.scale=t/10;await wait(1);}b.scale=1;}
async function dropAnim(b){beep(200,.2,'triangle',.05);for(let t=0;t<=20;t++){b.drop=t*3.2;await wait(1);}b.hidden=true;b.drop=0;}
function tweenHP(b){return new Promise(r=>{const step=()=>{const tgt=b.mon.hp,sp=Math.max(.35,b.mon.stats[0]/45);if(Math.abs(b.disp-tgt)<=sp){b.disp=tgt;r();return;}b.disp+=Math.sign(tgt-b.disp)*sp;timers.push({t:1,r:step});};step();});}
function tweenExp(target){return new Promise(r=>{const b=B.p;const step=()=>{if(Math.abs(b.dispExp-target)<=.02){b.dispExp=target;r();return;}b.dispExp+=Math.sign(target-b.dispExp)*.02;timers.push({t:1,r:step});};step();});}
// ---------------- render ----------------
const BG={beach:['#f8f8e8','#a8e0f0','#f0e0a8','#d0b878'],snow:['#f0f8ff','#d0e0f0','#e8f0f8','#b8c8d8'],cave:['#504038','#685848','#806a58','#584638'],volcano:['#f8d8c0','#d8a088','#b88868','#906050'],grass:['#f8f8e0','#c8e8a8','#a8d880','#80b860'],forest:['#d8e8c8','#98c890','#80b070','#588848'],indoor:['#f0e8d8','#d8d0c0','#c8c0a8','#a09880'],gym:['#e8e8f0','#c8c8d8','#b8b8c8','#9090a8']};
function drawBattle(c){
  if(scene==='evo'||!B){drawEvo(c);return;}
  const bg=BG[B.bg]||BG.grass;const g=c.createLinearGradient(0,0,0,114+OY);g.addColorStop(0,bg[0]);g.addColorStop(1,bg[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<5+Math.floor(OY/18);i++)c.fillRect(0,20+i*18,W,1);
  c.save();c.translate(0,OY);
  const sl=B.fx.slide*160;
  const plat=(x,y,rx,ry)=>{c.fillStyle=bg[3];c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();c.fillStyle=bg[2];c.beginPath();c.ellipse(x,y-1,rx-3,ry-2.5,0,0,7);c.fill();};
  plat(178-sl,64,48,11);plat(62+sl,108,56,12);
  if(B.fx.tf){const s=charSprite(B.fx.tf.look).down[0];c.drawImage(s,0,0,16,21,178-24+B.fx.tf.x-sl,64-60,48,63);}
  if(B.fx.tp){const s=charSprite(LOOK.player).up[0];c.drawImage(s,0,0,16,21,62-27+B.fx.tp.x+sl,108-68,54,71);}
  drawMon(c,B.f,'f',sl);drawMon(c,B.p,'p',sl);
  (B.fx.parts||[]).forEach(p=>{c.globalAlpha=Math.min(1,p.l/12);c.fillStyle=p.c;c.fillRect(p.x-1,p.y-1,3,3);});c.globalAlpha=1;
  if(B.fx.orb){const o=B.fx.orb;c.save();c.translate(o.x,o.y);c.rotate(o.rot);c.drawImage(ORB_IMG,-8,-9);c.restore();if(o.caught&&frame%20<10)text(c,'✦',o.x+6,o.y-12,'#f0d050',8,false);}
  if(B.fx.slide===0&&!B.f.hidden&&!B.fx.tf){const m=B.f.mon;box(c,6,10,106,30,'info');text(c,monName(m),12,13,'#404040',9);text(c,`Lv${m.lvl}`,106,14,'#404040',8,true,'right');
    if(G.caught.includes(m.sid)&&B.wild)c.drawImage(ORB_IMG,94,25,9,9);text(c,'HP',12,26,'#e09020',7);hpBar(c,24,27,68,B.f.disp,m.stats[0]);
    if(m.status){c.fillStyle=STATUS_COL[m.status];c.fillRect(70,14,20,8);text(c,STATUS_TAG[m.status],80,14.5,'#fff',6,false,'center');}}
  if(!B.p.hidden||B.p.fainted){const m=B.p.mon;if(!B.p.hidden){box(c,126,72,110,40,'info');text(c,monName(m),132,75,'#404040',9);text(c,`Lv${m.lvl}`,230,76,'#404040',8,true,'right');
    text(c,'HP',134,88,'#e09020',7);hpBar(c,146,89,84,B.p.disp,m.stats[0]);text(c,`${Math.ceil(B.p.disp)}/${m.stats[0]}`,230,95,'#404040',8,true,'right');
    c.fillStyle='#404040';c.fillRect(146,106,86,3);c.fillStyle='#48a8f8';c.fillRect(147,107,84*B.p.dispExp,1);text(c,'EXP',130,103,'#808080',5);
    if(m.status){c.fillStyle=STATUS_COL[m.status];c.fillRect(134,96,22,8);text(c,STATUS_TAG[m.status],145,96.5,'#fff',6,false,'center');}}}
  if(!ui.length){box(c,2,114,236,44,'dark');}
  c.restore();
}
function drawMon(c,b,side,sl){
  if(!b||b.hidden||b.blink)return;const spr=monSpr(b.mon);const img=side==='f'?spr.front:spr.back;
  const big=side==='p'?1.2:1;const cx=side==='f'?178-sl:62+sl,by=side==='f'?66:113;const w=64*b.scale*big,h=64*b.scale*big;
  let x=cx-w/2+b.dx,y=by-h+(spr.float?-8+Math.sin(frame/16)*2:0);
  c.save();c.beginPath();c.rect(0,0,W,by+(spr.float?-6:1));c.clip();c.drawImage(img,x,y+b.drop,w,h);
  if(b.scale<1&&b.scale>0){c.globalAlpha=1-b.scale;c.drawImage(silhouette(b.mon.sid,'#ffffff'),side==='f'?x:x,y,w,h);if(side==='p'){} }
  c.restore();
}
function drawEvo(c){
  c.fillStyle='#202838';c.fillRect(0,0,W,H);if(!EVO)return;c.save();c.translate(0,Math.max(0,MY-10));
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2+frame/60,r=40+((frame*1.5+i*20)%60);c.fillStyle=`rgba(255,240,180,${.5-(r-40)/120})`;c.fillRect(120+Math.cos(a)*r,56+Math.sin(a)*r,2,2);}
  const img=EVO.white?silhouette(EVO.show,'#ffffff'):spriteOf(EVO.show).front;c.drawImage(img,88,24);c.restore();
}
