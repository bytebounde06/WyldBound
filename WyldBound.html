*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

#screen{display:block;width:100%;image-rendering:pixelated;background:#000}
#brand{display:none}

}
#keys{display:none;flex:none;text-align:center;color:#c8c0e8;font-size:13px;height:30px;line-height:30px;letter-spacing:.5px}
#keys b{color:#fff;background:#1c1830;border-radius:4px;padding:1px 6px;margin:0 2px;font-weight:600}

}

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

FAMILIES.forEach((f,fi)=>{
  const n=f.names.length;let seed=hashStr(f.names[0]);
  const pv=f.from?SP_BY[f.from]:null;
  let bst;
  if(pv)bst=[Math.min(545,pv.bst+(pv.stage===0?150:85))];
  else if(n===3) bst=f.early?[195,205,395]:f.rar==='s'?[318,405,530]:f.rar==='r'?[300,420,600]:[300,405,520];
  else if(n===2) bst=f.rar==='r'?[355,500]:f.rar==='u'?[340,490]:[320,470];
  else bst=[{c:400,u:455,r:540,L:620,M:600}[f.rar]];
  if(f.rar==='L'&&/Zephyrion|Glaciaris|Pyraxis|Stormmane|Embermane|Rainmane|Granitus|Frostus|Ferrus/.test(f.names[0]))bst=[580];
  if(/Psytron|Leviamar|Solaurex|Terravast|Leviathos|Abyssion/.test(f.names[0]))bst=[680];
  const rng=mulberry32(seed^0x9e37);
  const w=ARCH[f.arch].map(v=>v*(.88+rng()*.24));
  const plans=f.plan.split(';');
  const first=SPECIES.length;
  f.names.forEach((name,i)=>{
    const types=(f.types[i]||f.types[f.types.length-1]).split('/');
    const sw=w.reduce((a,b)=>a+b,0);
    const base=w.map(v=>Math.max(10,Math.round(bst[i]*v/sw)));
    const catchRate=f.rar==='L'||f.rar==='M'?3:f.rar==='r'||f.rar==='s'?45:pv?45:i===0?(f.rar==='u'?120:255):i===1?(f.rar==='u'?60:120):45;
    const sp={id:SPECIES.length,num:SPECIES.length+1,name,types,base,fam:fi,stage:pv?pv.stage+1:i,stages:pv?pv.stages+1:n,rar:f.rar,region:f.region,
      plan:plans[i]||plans[plans.length-1],early:!!f.early,seed:pv?pv.seed:seed,legs:f.legs||(pv?pv.legs:1),bst:bst[i],baseExp:Math.max(36,Math.round(bst[i]*bst[i]/1250)),catchRate,
      growth:(f.rar==='L'||f.rar==='M')?'slow':'mf',evo:null,prevo:pv?pv.id:(i>0?first+i-1:null)};
    if(pv&&!f.plan)sp.plan=pv.plan;
    const hab=HABITAT[sp.plan]||'lives in the wild';
    sp.desc=`${name} ${hab}. ${TYPE_LORE[types[0]][0].toUpperCase()+TYPE_LORE[types[0]].slice(1)}${types[1]?', and '+TYPE_LORE[types[1]]:''}.`;
    SPECIES.push(sp);SP_BY[name]=sp;
  });
  for(let i=0;i<n-1;i++) SPECIES[first+i].evo={to:first+i+1,lvl:f.evo[i]};
  if(pv)pv.evo={to:first,lvl:f.lvl};
});

// learnsets
function buildLearnset(sp){
  const r=mulberry32(sp.seed+7);const L=[];
  const add=(lv,name)=>{const m=MOVE_BY[name];if(m&&!L.some(e=>e[1]===m.id))L.push([lv,m.id]);};
  const phys=sp.base[1]>=sp.base[3];
  add(1,phys?'Bump':'Swipe');add(1,r()<.5?'Snarl Down':'Hard Stare');
  const pool=t=>t==='Normal'?['Quick Dash','Ram','Heavy Press','Rampage'].map(n=>MOVE_BY[n]):MOVES.filter(m=>m.type===t&&m.pow>0).sort((a,b)=>a.pow-b.pow);
  const stat=t=>MOVES.filter(m=>m.type===t&&m.pow===0);
  const [t1,t2]=sp.types;
  const lv1=(sp.rar==='s'||PARTNER_FAMS.has(sp.fam))?[7,11,19,30,41,52]:sp.early&&sp.stage<2?[1]:[5,11,19,30,41,52]; // starters learn their first type move at Lv7 (fair first rival battle)
  pool(t1).forEach((m,i)=>{if(i<lv1.length)add(lv1[i],m.name);});
  if(t2){[8,16,26,37,48].forEach((lv,i)=>{const p=pool(t2);if(p[i])add(lv,p[i].name);});}
  const s1=stat(t1);if(s1.length)add(sp.early&&sp.stage===1?7:14,s1[Math.floor(r()*s1.length)].name);
  if(t2){const s2=stat(t2);if(s2.length)add(23,s2[Math.floor(r()*s2.length)].name);}
  if(t1!=='Normal'&&t2!=='Normal')add(17,'Ram');
  add(27,phys?'Focus Up':'Brace');
  add(34,'Rest Up');
  L.sort((a,b)=>a[0]-b[0]);return L;
}

SPECIES.forEach(sp=>sp.learn=buildLearnset(sp));

// ===================== MONSTER INSTANCES =====================
function expFor(sp,l){return sp.growth==='slow'?Math.floor(5*l*l*l/4):l*l*l;}
function calcStats(m){const sp=SPECIES[m.sid];m.stats=sp.base.map((b,i)=>i===0?Math.floor((2*b+m.ivs[i])*m.lvl/100)+m.lvl+10:Math.floor((2*b+m.ivs[i])*m.lvl/100)+5);}
let UID=Date.now()%100000;
function makeMon(sid,lvl){
  const sp=SPECIES[sid];
  const m={uid:++UID,sid,lvl,exp:expFor(sp,lvl),ivs:[0,0,0,0,0,0].map(()=>Math.floor(Math.random()*32)),moves:[],status:null,slp:0,hp:0};
  const known=[];sp.learn.forEach(e=>{if(e[0]<=lvl&&!known.includes(e[1]))known.push(e[1]);});
  // pick up to 3 of the strongest attacks (favoring own types) plus the newest status move
  const sp_=SPECIES[sid];const dmg=known.filter(id=>MOVES[id].pow>0).sort((a,b)=>{const va=MOVES[a].pow*(sp_.types.includes(MOVES[a].type)?1.5:1),vb=MOVES[b].pow*(sp_.types.includes(MOVES[b].type)?1.5:1);return vb-va;});
  const pickD=[];const seenT=new Set();for(const id of dmg){if(pickD.length>=3)break;if(!seenT.has(MOVES[id].type)||dmg.length<=3){pickD.push(id);seenT.add(MOVES[id].type);}}
  for(const id of dmg){if(pickD.length>=3)break;if(!pickD.includes(id))pickD.push(id);}
  const stat=known.filter(id=>MOVES[id].pow===0);const pick=pickD.concat(stat.slice(-Math.max(1,4-pickD.length))).slice(0,4);
  m.moves=pick.map(id=>({id,pp:MOVES[id].pp}));
  calcStats(m);m.hp=m.stats[0];return m;
}
function monName(m){return m.nick||SPECIES[m.sid].name;}
function healMon(m){calcStats(m);m.hp=m.stats[0];m.status=null;m.slp=0;m.moves.forEach(s=>s.pp=MOVES[s.id].pp);}

Blazehound:'Blazehound\'s howl warms the air for a mile around. Mountain villages credit it with keeping frost off their crops.',
Toadlet:'Toadlet hatches in the hundreds every spring. Their chorus on the Route 2 lake is so loud it rattles windows in Brookvale.',
Marshtoad:'Marshtoad keeps a hidden pool under the roots of an old tree. It shares the pool with whatever Wyldkin need water.',
Bogking:'Bogking wrestles currents for training. Fishers say a Bogking once pulled a capsized boat to shore on its own.',
Mindlet:'Mindlet keeps its eyes shut almost all the time. It sees the world through the thoughts of the people around it.',
Cerebrix:'Cerebrix collects small metal objects, which hum faintly in its presence. Its mind buzzes worst when ByteBound towers are broadcasting.',
Psionarch:'Psionarch can solve a puzzle box just by looking at it. Scholars in Ferrowick bring it riddles as gifts.',
Grapplet:'Grapplet carries the heaviest stone it can find everywhere it goes. When the stone gets easy to carry, it finds a bigger one.',
Grappler:'Grappler helps haul iron at the Ferrowick ironworks. The workers made it an honorary member of their crew.',
Titangrip:'Titangrip\'s grip can bend steel beams. It is careful to shake hands gently and seems proud of how gentle it can be.',
Bellvine:'Bellvine sways back and forth even when there\'s no wind. It\'s believed to be keeping time to a song only it can hear.',
Trapvine:'Trapvine\'s sweet scent lures bugs into its wide mouth. Gardeners grow it near beehives to keep pests away.',
Gulpvine:'Gulpvine coils its vines around tree trunks to climb into the canopy. Its digestive juices are strong enough to dissolve stone.',
Jellume:'Jellume drifts with the tide in clear water. At night, schools of fish gather around its faint light to rest.',
Glowjelly:'Glowjelly pulses in slow patterns. Sailors on Aldera\'s great lake swear the patterns spell out messages, though no one has decoded them.',
Pebblet:'Pebblet sleeps buried in gravel with only its eyes showing. Road crews have learned to check before they pave.',
Cragmaw:'Cragmaw chews stones to grind its teeth smooth. Its favorite snacks are the polished pebbles from Brookvale\'s creeks.',
Montusk:'Montusk carries a small boulder garden on its back. Lichen and wildflowers grow there all year long.',
Emberfoal:'Emberfoal\'s first steps leave tiny scorch marks in the grass. Ranchers say a field it runs through grows back greener.',
Blazesteed:'Blazesteed races the sunrise across the eastern plains. Its fiery mane is cool to the touch for anyone it trusts.',
Slothtide:'Slothtide floats on its back in slow rivers and lets the current decide where it goes. It may take a week to drift a mile.',
Slothsage:'Slothsage sits on riverbanks for days, deep in thought. Its rare advice is said to always be right, if you can wait for it.',
Coilorb:'Coilorb clusters around ByteBound relay towers. Technicians say it\'s attracted to the hum of the transmitters.',
Coilcluster:'Several Coilorb linked by a magnetic field. When Coilcluster passes overhead, televisions across town fill with static.',
Sealpup:'Sealpup balances pebbles on its nose for fun. It will keep practicing tricks until someone claps for it.',
Frostseal:'Frostseal sleeps on floating ice in cold lakes. Ice fishers leave it scraps in exchange for a warning when the ice gets thin.',
Sludgling:'Sludgling first appeared near the ironworks drainage pipes. When the runoff was cleaned up, it stayed and became the cleanup crew\'s mascot.',
Sludgemaw:'Sludgemaw absorbs grime and gives off a sour smell. Ferrowick uses a few of them to clean industrial waste safely.',
Clamlet:'Clamlet spits pearls of sand at anything that bothers it. It keeps a favorite pearl hidden deep inside its shell.',
Spineclam:'Frost forms on Spineclam\'s spikes even in summer. Divers mark the reefs where it lives as dangerous.',
Shadewisp:'Shadewisp is made of drifting smoke and gathers wherever the air is still. It likes to spook people by blowing out candles.',
Phantomist:'Phantomist imitates voices from other rooms. Many reports of strange whispers in old houses turn out to be Phantomist.',
Nightmaw:'Nightmaw hides in the shadow under a bed and grins at anyone who peeks. It means no harm. It just loves a good scare.',
Boulderwyrm:'Boulderwyrm\'s body is a chain of round boulders. The ancient roads through Aldera\'s mountains follow its old tunnels.',
Pinchlet:'Pinchlet scuttles along the riverbed collecting smooth pebbles. It arranges them in patterns that no one understands.',
Krakclaw:'Krakclaw drums its huge claw on rocks to call others. On quiet nights, the sound echoes up and down the river.',
Blastorb:'Blastorb rolls into tight spaces when it\'s nervous. ByteBound once mixed it up with a batch of Capture Orbs and had to recall the whole shipment.',
Boomsphere:'Boomsphere crackles louder the more charge it stores. It releases its energy in a harmless flash that leaves a smell like a thunderstorm.',
Seedcluster:'Seedcluster\'s seeds roll after each other in a line. If one gets separated, it rolls in circles until the others come back.',
Palmbrain:'Palmbrain sways in the breeze and seems to be daydreaming. Each of its heads hums a different tune.',
Bonecub:'Bonecub carries a bone it found in the hills and won\'t part with it. It taps the bone on rocks to make rhythms when it\'s lonely.',
Skullguard:'Skullguard has learned to carve its bone into a sturdy club. It guards old burial grounds in the Aldera hills.',
Kickstrike:'Kickstrike balances on one leg for hours to train. It can kick the fruit off a branch without disturbing the leaves.',
Smogling:'Smogling hovers near chimneys and breathes in the fumes. In winter, it drifts into towns looking for warm smoke.',
Smogtwin:'The two heads of Smogtwin puff out smoke in alternating colors. Children in Ferrowick try to guess which color comes next.',
Horncharge:'Horncharge runs only in straight lines. It has worn deep, straight paths across the plains that travelers now use as roads.',
Rhinoquake:'Rhinoquake\'s footfalls are felt as small earthquakes in nearby towns. It sleeps standing up, so it\'s ready to charge at any moment.',
Nursebun:'Nursebun hums a lullaby that eases pain. Every Rest Center in Aldera has at least one helping the nurses.',
Drifthorse:'Drifthorse curls its tail around reeds to rest. It changes color to match the water and is almost impossible to spot.',
Tidesteed:'Tidesteed gallops across the surface of the water for short bursts. Racing them is a popular sport on Aldera\'s great lake.',
Finnow:'Finnow chases its own reflection in still ponds. Its fins shimmer in a different pattern for each one.',
Barbfin:'Barbfin carves its name into river stones with its horn. At least, that\'s what fishers say the marks are.',
Starlet:'Starlet washes up on the lakeshore after storms. Children toss it back into the water, and it spins away happily.',
Prismstar:'Prismstar\'s core flashes in bursts that ByteBound\'s receivers sometimes pick up. The signal has never been decoded.',
Mimelord:'Mimelord pretends to be stuck behind walls that aren\'t there. Its performances draw crowds in every town square it visits.',
Bladewing:'Bladewing trims tall grass with its sharp forelimbs. Some farmers welcome it, though it doesn\'t always stop where they\'d like.',
Frostdiva:'Frostdiva sings on frozen ponds at midnight. Its songs are always in a language no one recognizes.',
Voltbrawler:'Voltbrawler spars with lightning rods during storms. Ferrowick\'s power plant hires it to jump-start generators.',
Magmabrute:'Magmabrute\'s fists glow red-hot when it concentrates. Blacksmiths say it can forge a blade with its bare hands.',
Hornpincer:'Hornpincer grips tree trunks and shakes them until fruit falls. It is always ready to share what it gets.',
Bullcharge:'Bullcharge herds stampede across the plains at dawn. The thunder of their hooves is Aldera\'s unofficial wake-up call.',
Flopfish:'Flopfish splashes helplessly in the shallows and gets carried off by every current. It somehow survives anywhere it lands.',
Ragewyrm:'Ragewyrm is what a Flopfish becomes after a lifetime of being pushed around. It never forgets the Wyldkin that ignored it.',
Ferrytide:'Ferrytide carries travelers across the great lake on its shell. It always stops halfway to look at the sunset.',
Mimeblob:'Mimeblob copies the shape of anything it touches. It has trouble getting colors right, so its copies always look a little off.',
Pixelon:'ByteBound engineers designed Pixelon to carry data through ByteNet. Its file lists it as a program, nothing more, but it seems curious about the world.',
Spirashell:'An ancient Wyldkin restored from a fossil found in the Aldera cliffs. Its spiral shell records the seasons it lived through, like tree rings.',
Spiralord:'Spiralord\'s tentacles move with surprising grace. Scientists use its shell rings to study weather from thousands of years ago.',
Trilobit:'An ancient Wyldkin restored from a fossil. Trilobit can sense vibrations through its shell, so it rarely needs to open its eyes.',
Bladelobe:'Bladelobe\'s blades are made of the same material as its shell. It moves silently through shallow water, its shell barely making a ripple.',
Fossilwing:'Fossilwing was restored from fossil fragments found near Ferrowick. It flies like it\'s making up for millions of years of lost time.',
Slumbear:'Slumbear naps in the strangest places: hillsides, riverbeds, the middle of the road. Wake it gently, or it will roll over and sleep even harder.',
Zephyrion:'A legendary bird said to be born in the heart of a thunderhead. Wherever it lands, the soil is rich for years afterward.',
Glaciaris:'A legendary bird that sleeps through summer in an icy cave. When it wakes, the first frost of the year follows its path.',
Pyraxis:'A legendary bird whose flight trails glowing embers. Aldera\'s old calendar marks the year\'s turning by Pyraxis sightings.',
Wyrmlet:'Wyrmlet hides in deep lakes and is rarely seen. Fishers who glimpse its blue scales consider themselves lucky for a year.',
Drakeling:'Drakeling\'s scales catch the light like a prism. Rainbows often appear over lakes where it has surfaced.',
Skywyrm:'Skywyrm patrols the skies over Aldera. Pilots report seeing it fly alongside their planes as if guiding them through storms.',
Psytron:'Psytron was created in a sealed laboratory in the Aldera mountains. The laboratory\'s records end suddenly, and nobody knows who made it.',
Primora:'Primora appears in cave paintings older than any town in Aldera. Many scholars believe every Wyldkin descends from it.',
Fuzzbit:'Fuzzbit hops through the tall grass with its ears perked up. Most trainers in Aldera meet one on their first day out.',
Burrowbun:'Burrowbun digs warrens with dozens of exits. A whole colony can vanish underground in the time it takes to blink.',
Mossnail:'Mossnail grows a carpet of moss on its shell and blends into the forest floor. It leaves a glittering trail on damp nights.',
Verdeshell:'Verdeshell carries a tiny garden on its back. Small Wyldkin often build nests in it and ride along wherever it goes.',
Mudling:'Mudling is made of river clay. When it\'s stepped on, it squishes into a new shape, then pops back up as if nothing happened.',
Mudtitan:'Mudtitan patrols the riverbanks during floods. It plugs gaps in the levees with its own body until the water goes down.',
Sparkfly:'Sparkfly glows brighter the more excited it gets. On summer nights, swarms of them light up Aldera\'s fields.',
Gecklet:'Gecklet basks on warm rocks to soak up the heat. It is gentle and curious and loves to be held when it\'s a little chilly.',
Embergecko:'Embergecko\'s spotted scales glow like coals. It keeps the rocks around its den warm through the coldest winter nights.',
Voltmole:'Voltmole\'s claws spark when it digs. It often tunnels toward buried ByteBound cables and has caused more than one outage.',
Dynamole:'Dynamole charges itself by digging through soil full of metal. When it surfaces, the air crackles with static.',
Wisplet:'Wisplet\'s little flame bobs through the dark like a lantern. People who follow it say it always leads somewhere interesting.',
Lanternwisp:'Lanternwisp drifts through Whisperwood at night. People who sleep near its glow report vivid dreams of places they\'ve never been.',
};

const FONT='"Pixelify Sans", "Courier New", monospace';
function font(c,sz,bold){c.font=`${bold?'600 ':''}${sz}px ${FONT}`;}
function text(c,str,x,y,col='#383838',sz=9,shadow=true,align='left'){font(c,sz);c.textAlign=align;c.textBaseline='top';if(shadow){c.fillStyle='rgba(0,0,0,.18)';c.fillText(str,x+.6,y+.6);}c.fillStyle=col;c.fillText(str,x,y);c.textAlign='left';}
function box(c,x,y,w,h,style){
  const st=style||'std';
  if(st==='std'){c.fillStyle='#404858';c.fillRect(x,y,w,h);c.fillStyle='#f8f8f8';c.fillRect(x+1,y+1,w-2,h-2);c.fillStyle='#90a0b8';c.fillRect(x+2,y+2,w-4,1);c.fillRect(x+2,y+h-3,w-4,1);c.fillRect(x+2,y+2,1,h-4);c.fillRect(x+w-3,y+2,1,h-4);c.fillStyle='#f8f8f8';c.fillRect(x+3,y+3,w-6,h-6);}
  else if(st==='dark'){c.fillStyle='#283040';c.fillRect(x,y,w,h);c.fillStyle='#e05050';c.fillRect(x+1,y+1,w-2,h-2);c.fillStyle='#384868';c.fillRect(x+3,y+3,w-6,h-6);}
  else if(st==='info'){c.fillStyle='#404040';c.fillRect(x,y,w,h);c.fillStyle='#f8f8d8';c.fillRect(x+1,y+1,w-2,h-2);c.fillStyle='#d8d8b0';c.fillRect(x+1,y+h-4,w-2,3);}
}
function hpBar(c,x,y,w,cur,max){const f=Math.max(0,Math.min(1,cur/max));c.fillStyle='#404040';c.fillRect(x,y,w,4);c.fillStyle='#f8f8f8';c.fillRect(x+1,y+1,w-2,2);c.fillStyle=f>.5?'#40c860':f>.2?'#f0c020':'#e04030';c.fillRect(x+1,y+1,Math.ceil((w-2)*f),2);}
function typeTag(c,t,x,y){c.fillStyle=TYPE_COLOR[t]||'#888';c.fillRect(x,y,30,9);c.fillStyle='rgba(0,0,0,.35)';c.fillRect(x,y+8,30,1);text(c,t.toUpperCase().slice(0,8),x+15,y+1.5,'#fff',6,true,'center');}
function wrapText(c,str,maxW,sz=9){font(c,sz);const out=[];str.split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});out.push(line);});return out;}

  await say('These three are the partner Wyldkin of Aldera. Coralmere and Frostfell have partners of their own. Choose the one you like best!');
  let sid=-1;
  const pk=eggKind(G.name);if(pk==='static'){await say('Prof. Hazel: Oh dear. I only have three partners, and your two friends... Hm. What\'s my lab PC doing?');await eggGetsPartner('static',0,'you');sid=eggPartnerId('static',0);}
  else if(pk==='bunny'){await say('Prof. Hazel: Oh dear. I only have three partners, and your two friends... Wait. Is something in the air vent?');await eggGetsPartner('bunny',0,'you');sid=eggPartnerId('bunny',0);}
  else if(pk==='smashed'){await say('Prof. Hazel: Oh dear. I only have three partners, and your two friends... Is that smoke coming from the doorway?');await eggGetsPartner('smashed',0,'you');sid=eggPartnerId('smashed',0);}
  else sid=await chooseStarter(0);
  const sp=SPECIES[sid];
  const mon=makeMon(sid,5);G.party.push(mon);addSeen(sid);addCaught(sid);
  await say(`${G.name} received ${sp.name}!`);
  G.flags.starter=1;
  await rivalPicks(0,sid);
  G.flags.rivalLeft=1;
  await say('Prof. Hazel: Wonderful battle! Take these. With Capture Orbs you can catch wild Wyldkin.');
  addItem('orb',5);await say(`${G.name} received 5 Capture Orbs and the CODEX!`);
  await say('Head north through Route 1 to Brookvale. The town\'s gym leader, Brenna, is a good first challenge.');
  G.lastHeal=homeSpot();
  autosave();
}

function nurse(map,x,y){return{id:'nurse_'+map,x:5,y:1,dir:'down',look:LOOK.nurse,run:async()=>{

  await say(fee?`Welcome to the Rest Center, proudly sponsored by ByteBound. Healing costs $${fee}. Shall I restore your Wyldkin?`:'Welcome to the Rest Center! Shall I restore your Wyldkin to full health?');

  else await say('We hope to see you again!');}};}

async function storyBattle(tr){await say('STORY BATTLE: Win or lose, the outcome is permanent.',{style:'dark'});if(bunnyWho()==='you'&&/SCIENT|DR\.|DOCTOR/i.test((tr.cls||'')+' '+(tr.name||''))&&!G.flags.bunnyLab){G.flags.bunnyLab=1;await say(`${G.name}\'s little bat wings tremble under the pink hair. Lab coats. Clipboards. It wasn\'t ByteBound\'s lab she escaped from... but it looked just like this.`);await say(`${G.name}: Okay. Deep breath. Nobody\'s locking me in a tank ever again.`);}if(staticEgg()&&!(G.flags.scanned||[]).includes(tr.name)&&Math.random()<.6){G.flags.scanned=(G.flags.scanned||[]).concat(tr.name);glitchNow(20);const sci=/SCIENT|DR\.|DOCTOR|RESEARCH/i.test((tr.cls||'')+' '+tr.name);

// Rowan or Wren may offer to back you up against ByteBound (they take turns offering).
async function friendAssist(tr){
  const r=(MAP&&MAP.region)||0;const fr=G.rivals&&G.rivals[r];if(!fr)return null;
  if((tr.cls||'')==='RIVAL')return null;
  G.assistN=(G.assistN||0)+1;const f=FR();
  // All three easter eggs in play (Static, Bunny and Smashed): both friends help in every ByteBound fight.
  // Otherwise Smashed always shows up on his own, and regular friends take turns every other fight.
  const ns=[G.name,f.riv.name,f.pal.name];const allThree=ns.some(isStatic)&&ns.some(isBunny)&&ns.some(isSmashed);
  // Smashed and Bunny always show up. If both are your friends (without Static in play), you pick who helps
  // and the other one runs off to "help" with a battle of their own.
  const always=n=>isSmashed(n)||isBunny(n);
  let who=[];G._side=null;const hates=n=>{const kd=eggKind(n);return!!kd&&eggHates(kd);};
  if(allThree)who=['Rowan','Wren'];
  else if(always(f.riv.name)&&always(f.pal.name)&&!hates(f.riv.name)&&!hates(f.pal.name)){
    await say(`${f.riv.name} and ${f.pal.name} both step forward. "We've got this, ${G.name}!"`);
    const c=await choose([f.riv.name,f.pal.name],{x:150,y:H-92,w:88,prompt:'Who should help you?'});const pick=c===1?'Wren':'Rowan',other=pick==='Rowan'?'Wren':'Rowan';
    const on=other==='Rowan'?f.riv.name:f.pal.name;
    await say(isSmashed(on)?`${other}: Fine. I'll go torch the guards in the next room. Somebody has to.`:`${other}: Okay, sweetie! I'll go keep the other ByteBound grunts busy. Be careful!`);
    G._side={who:other,name:on};who=[pick];}
  else if(always(f.riv.name))who=['Rowan'];
  else if(always(f.pal.name))who=['Wren'];
  else if(G.assistN%2===1)who=[(G.assistN>>1)%2===0?'Wren':'Rowan'];
  if(!who.length)return null;
  const ace=Math.max(...tr.party.map(p=>p[1]));const lvl=Math.max(5,ace);
  // A friend who hates the player's name (doctor / badge / sysadmin) still shows up, but won't help.
  for(const w of ['Rowan','Wren']){const n=w==='Rowan'?f.riv.name:f.pal.name;const kd=eggKind(n);if(kd&&eggHates(kd)){await say(hateArrive(kd,w));who=who.filter(x=>x!==w);}}
  if(!who.length)return null;
  for(const w of who){const n=w==='Rowan'?f.riv.name:f.pal.name;
    if(isSmashed(n))await say(`${w}: Ugh. ByteBound again? You look like you\'re about to get flattened. Move over, I\'m helping. Don\'t make it a thing.`);
    else if(isBunny(n))await say(`${w}: Sweetie, are those ByteBound creeps bothering you? Nobody hurts my friends. Mama Bunny is here!`);
    else if(isStatic(n)){glitchNow(16);await say(`${w}: ByteBound. Of course. They still think I\'m an "it." ...Let\'s show them what an "it" can do.`);}
    else await say(w==='Wren'?`Wren: ${G.name}! I saw ByteBound come this way. Want me to back you up, like old times?`:`Rowan: Tch, ByteBound again? Fine. Want a hand, ${G.name}? Don't make it weird.`);}
  const names=who.join(' and ');
  if(!await yesno(`Battle with ${names}'s help?`)){
    for(const w of who){const n=w==='Rowan'?f.riv.name:f.pal.name;await say(isSmashed(n)?`${w}: Your funeral. ...I\'m standing right here if it goes bad, though.`:isBunny(n)?`${w}: Okay, sweetie. But Mama\'s right behind you!`:isStatic(n)?`${w}: Suit yourself. I\'ll be watching. I\'m always watching. ...That came out creepier than I meant.`:`${w}: Okay! I'll be right here cheering.`);}
    return null;}
  return who.map(w=>{const n=w==='Rowan'?f.riv.name:f.pal.name;const sid=w==='Wren'?fr.wren:fr.rowan;
    return{name:w,kind:eggKind(n),mon:makeMon(isSmashed(n)?evolvedAt(SP_BY.Cinderpup.id,lvl):evolvedAt(sid,lvl),lvl)};});
}

function applyMods(){if(!MAP)return;MAP.cur=MAP.rows.map(r=>r.split(''));const m=MAP.mods?MAP.mods():[];m.forEach(([x,y,c])=>{if(MAP.cur[y])MAP.cur[y][x]=c;});}

const ENC_RATE=0.1, DRIFTER_RATE=0.05;
// Region rules: wild Wyldkin in a region come from that region or earlier ones (R1 everywhere, R2 in R2+R3, R3 only in R3)
function driftPool(region){return SPECIES.filter(s=>s.stage===0&&!s.prevo&&(s.rar==='c'||s.rar==='u')&&s.region<=region).map(s=>s.id);}
function rollEncounter(table){const DRIFTERS=driftPool(MAP.region||0);
  const tot=table.reduce((a,e)=>a+e[3],0);let r=Math.random()*tot,pick=table[0];
  for(const e of table){r-=e[3];if(r<=0){pick=e;break;}}
  const lvl=pick[1]+Math.floor(Math.random()*(pick[2]-pick[1]+1));
  const rg=MAP.region||0;if((G.champs||[]).includes(rg)&&!MAP.town&&Math.random()<.03)return makeMon(STARTERS[rg*3+Math.floor(Math.random()*3)],lvl);
  if(Math.random()<DRIFTER_RATE){const sid=DRIFTERS[Math.floor(Math.random()*DRIFTERS.length)];return makeMon(sid,lvl);}
  return makeMon(SP_BY[pick[0]].id,lvl);
}

'use strict';
// ===================== WORLD GENERATOR =====================
const THEMES={
  aldera:{ground:'.',tree:'T',grass:'"',bg:'grass'},
  forest:{ground:'.',tree:'T',grass:'"',bg:'forest'},
  coral:{ground:';',tree:'p',grass:'"',bg:'beach'},
  jungle:{ground:'.',tree:'T',grass:'"',bg:'forest'},
  volcano:{ground:'.',tree:'T',grass:'"',bg:'volcano'},
  frost:{ground:':',tree:'P',grass:'v',bg:'snow'},
  cave:{ground:'q',tree:'W',grass:'q',bg:'cave'},
};
const BSIZE={house:[4,3,'R'],rest:[4,3,'B'],shop:[4,3,'M'],gym:[5,4,'Q'],lab:[6,3,'L'],bb:[5,3,'Z'],league:[7,4,'G'],museum:[5,3,'L'],port:[4,3,'R']};
function gridOf(W,H,c){return Array.from({length:H},()=>Array(W).fill(c));}

function genOutdoor(sp){
  const W=sp.w,H=sp.h,th=THEMES[sp.theme||'aldera'],R=mulberry32(hashStr(sp.id)*7+1);
  const g=gridOf(W,H,th.ground);const resv=gridOf(W,H,0);
  const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;const set=(x,y,c)=>{if(inb(x,y))g[y][x]=c;};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x<2||y<2||x>=W-2||y>=H-2)g[y][x]=th.tree;
  const pts=[];const out={doors:[],mouths:[],arrive:{}};
  // edge exits
  for(const side of ['n','s','e','w'])(sp.exits[side]||[]).forEach(pos=>{
    for(let d=0;d<3;d++){if(side==='n'){set(pos,d,',');set(pos+1,d,',');}if(side==='s'){set(pos,H-1-d,',');set(pos+1,H-1-d,',');}
      if(side==='w'){set(d,pos,',');set(d,pos+1,',');}if(side==='e'){set(W-1-d,pos,',');set(W-1-d,pos+1,',');}}
    const p=side==='n'?[pos,2]:side==='s'?[pos,H-3]:side==='w'?[2,pos]:[W-3,pos];pts.push(p);
    for(let d=0;d<4;d++){const q=side==='n'?[pos,d]:side==='s'?[pos,H-1-d]:side==='w'?[d,pos]:[W-1-d,pos];resv[q[1]][q[0]]=2;const q2=side==='n'||side==='s'?[q[0]+1,q[1]]:[q[0],q[1]+1];resv[q2[1]][q2[0]]=2;}
  });
  // cave mouths
  (sp.mouths||[]).forEach(m=>{
    let pos=null;for(let t=0;t<600&&!pos;t++){const x=3+Math.floor(R()*(W-8)),y=3+Math.floor(R()*(H-8));
      const pref=m.side==='n'?y<H*.4:m.side==='s'?y>H*.5:m.side==='e'?x>W*.6:m.side==='w'?x<W*.35:true;if(!pref&&t<400)continue;
      let ok=true;for(let yy=y-1;ok&&yy<=y+3;yy++)for(let xx=x-1;xx<=x+3;xx++)if(!inb(xx,yy)||resv[yy][xx]){ok=false;break;}if(ok)pos=[x,y];}
    if(!pos){console.warn('no mouth',sp.id);return;}
    const[x,y]=pos;for(let yy=y;yy<y+2;yy++)for(let xx=x;xx<x+3;xx++)set(xx,yy,'W');set(x+1,y+1,'E');
    for(let yy=y-1;yy<=y+3;yy++)for(let xx=x-1;xx<=x+3;xx++)resv[yy][xx]=1;resv[y+2][x+1]=2;pts.push([x+1,y+2]);out.mouths.push({m,x:x+1,y:y+1});
  });
  // buildings
  const placeRect=(bw,bh,pref)=>{for(let t=0;t<2000;t++){let x,y;if(pref&&t<40){x=pref[0];y=pref[1];}else{x=3+Math.floor(R()*(W-6-bw));y=3+Math.floor(R()*(H-7-bh));}
      let ok=x>=3&&y>=3&&x+bw<=W-3&&y+bh<=H-4;for(let yy=y-1;ok&&yy<=y+bh+1;yy++)for(let xx=x-1;xx<=x+bw;xx++){if(!inb(xx,yy)||resv[yy][xx]){ok=false;break;}}
      if(ok)return[x,y];}return null;};
  (sp.bld||[]).map((b,bi)=>[b,bi]).sort((x,y)=>BSIZE[y[0].kind][0]*BSIZE[y[0].kind][1]-BSIZE[x[0].kind][0]*BSIZE[x[0].kind][1]).forEach(([b,bi])=>{
    const kind=b.kind;const[bw,bh,roof]=BSIZE[kind];const pos=placeRect(bw,bh,b.at);if(!pos){console.warn('no room',sp.id,kind);return;}
    const[x,y]=pos;const steel=kind==='bb';
    for(let yy=y;yy<y+bh-1;yy++)for(let xx=x;xx<x+bw;xx++)set(xx,yy,roof);
    const dx=x+Math.floor(bw/2)-(bw%2?0:1)+(kind==='gym'||kind==='league'?0:0);
    for(let xx=x;xx<x+bw;xx++)set(xx,y+bh-1,steel?(xx===dx?'{':(xx-x)%2?']':'['):(xx===dx?'D':((xx-x)%3===1?'w':'#')));
    for(let yy=y-1;yy<=y+bh;yy++)for(let xx=x-1;xx<=x+bw;xx++)if(inb(xx,yy))resv[yy][xx]=1;
    resv[y+bh][dx]=2;pts.push([dx,y+bh]);out.doors.push({b,bi,x:dx,y:y+bh-1});
  });
  // paths: dijkstra with noisy costs
  const noise=gridOf(W,H,0).map(r=>r.map(()=>1+R()*1.2));
  const carve=(a,b)=>{const dist=new Float64Array(W*H).fill(1e9),prev=new Int32Array(W*H).fill(-1);const heap=[];
    const push=(d,i)=>{heap.push([d,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
    const pop=()=>{const top=heap[0];const last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
    const si=a[1]*W+a[0],ti=b[1]*W+b[0];dist[si]=0;push(0,si);
    while(heap.length){const[d,i]=pop();if(i===ti)break;if(d>dist[i])continue;const x=i%W,y=(i/W)|0;
      for(const[ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+ddx,ny=y+ddy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const ni=ny*W+nx;
        if((nx<2||ny<2||nx>=W-2||ny>=H-2)&&ni!==ti&&resv[ny][nx]!==2)continue;
        const rv=resv[ny][nx];if(rv===1&&ni!==ti)continue;const c=g[ny][nx]===','?.3:noise[ny][nx];const nd=d+c;if(nd<dist[ni]){dist[ni]=nd;prev[ni]=i;push(nd,ni);}}}
    let cur=ti;if(prev[cur]<0&&si!==ti)return false;while(cur>=0){const x=cur%W,y=(cur/W)|0;if(resv[y][x]!==1)g[y][x]=',';if(!resv[y][x])resv[y][x]=3;cur=prev[cur];}return true;};
  for(let i=1;i<pts.length;i++){let best=0,bd=1e9;for(let j=0;j<i;j++){const d=Math.abs(pts[i][0]-pts[j][0])+Math.abs(pts[i][1]-pts[j][1]);if(d<bd){bd=d;best=j;}}carve(pts[best],pts[i]);}
  pts.forEach(([x,y])=>{if(g[y][x]!=='D'&&g[y][x]!=='{')g[y][x]=',';});

function genCave(sp){

  out.freeSpots=[];out.trainerSpots=[];for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++)if(reach[y][x]&&g[y][x]==='q'&&!pts.some(p=>Math.abs(p[0]-x)+Math.abs(p[1]-y)<3))out.freeSpots.push([x,y]);

  out.rows=g.map(r=>r.join(''));out.pts=pts;out.R=R;return out;
}

const NODES={};const LINKS=[];
function N(spec){NODES[spec.id]=spec;spec.exits=spec.exits||{n:[],s:[],e:[],w:[]};spec.mouths=spec.mouths||[];spec.ladders=spec.ladders||[];return spec;}
function link(a,side,b,kind,fix){LINKS.push(Object.assign({a,side,b,kind:kind||'edge'},fix||{}));}
const OPPS={n:'s',s:'n',e:'w',w:'e'};
function planLinks(){
  LINKS.forEach(L=>{const A=NODES[L.a]||null,B=NODES[L.b]||null;
    if(L.kind==='edge'){if(!A&&L.fixA!=null)L.aPos=L.fixA;if(!B&&L.fixB!=null)L.bPos=L.fixB;
      const rnd=(spec,side)=>{const len=side==='n'||side==='s'?spec.w:spec.h;const r=mulberry32(hashStr(spec.id+side+L.b+L.a));return 4+Math.floor(r()*(len-9));};
      if(A&&!L.aPos){L.aPos=L.fixA!=null?L.fixA:rnd(A,L.side);A.exits[L.side].push(L.aPos);}
      if(B&&!L.bPos){L.bPos=L.fixB!=null?L.fixB:rnd(B,OPPS[L.side]);B.exits[OPPS[L.side]].push(L.bPos);}
    } else {
      // cave/door link: A gets a mouth (or ladder if cave), B gets a ladder (or mouth if outdoor)
      const aCave=A&&A.kind==='cave',bCave=B&&B.kind==='cave';
      if(A){(aCave?A.ladders:A.mouths).push({side:L.side,to:L.b,link:L});}
      if(B){(bCave?B.ladders:B.mouths).push({side:OPPS[L.side],to:L.a,link:L});}
    }});

function buildNodes(){
  planLinks();
  const built={};
  Object.values(NODES).forEach(sp=>{
    const out=sp.kind==='cave'?genCave(sp):genOutdoor(sp);built[sp.id]=out;
    const th=THEMES[sp.theme||(sp.kind==='cave'?'cave':'aldera')];
    MAPS[sp.id]={name:sp.name,bg:sp.bg||th.bg,ground:th.ground,rows:out.rows,region:sp.region,prog:sp.prog,cave:sp.kind==='cave',kind:sp.kind,conn:{},warps:[],npcs:[],signs:{},enc:null,town:sp.kind==='town',spec:sp};
    if(out.sign)MAPS[sp.id].signs[out.sign.join(',')]=sp.signText||`${sp.name.toUpperCase()}\n${sp.blurb||REGIONS[sp.region]+' region'}`;
  });
  // edge connections
  LINKS.filter(L=>L.kind==='edge').forEach(L=>{
    const A=MAPS[L.a],B=MAPS[L.b];const s=L.side;
    const off=(L.bPos)-(L.aPos);
    if(A)A.conn[s]={to:L.b,off};if(B)B.conn[OPPS[s]]={to:L.a,off:-off};
  });
  // door links (mouths/ladders)
  const find=(id,to)=>{const o=built[id];if(!o)return null;const arr=(o.mouths||[]).concat(o.ladders||[]);return arr.find(e=>(e.m||e.l).to===to);};
  LINKS.filter(L=>L.kind!=='edge').forEach(L=>{
    const a=find(L.a,L.b),b=find(L.b,L.a);if(!a||!b){console.warn('link fail',L);return;}
    const arr=(id,e)=>{const isLadder=!!e.l;return isLadder?[e.x+1<MAPS[id].rows[0].length&&MAPS[id].rows[e.y][e.x+1]==='q'?e.x+1:e.x-1<0?e.x:MAPS[id].rows[e.y][e.x-1]==='q'?e.x-1:e.x,MAPS[id].rows[e.y][e.x+1]==='q'||MAPS[id].rows[e.y][e.x-1]==='q'?e.y:(MAPS[id].rows[e.y+1]&&MAPS[id].rows[e.y+1][e.x]==='q'?e.y+1:e.y-1)]:[e.x,e.y+1];};
    const ta=arr(L.b,b),tb=arr(L.a,a);
    MAPS[L.a].warps.push({x:a.x,y:a.y,to:L.b,tx:ta[0],ty:ta[1],dir:'down'});
    MAPS[L.b].warps.push({x:b.x,y:b.y,to:L.a,tx:tb[0],ty:tb[1],dir:'down'});
  });
  return built;
}

      if(t===hits[5].at+24)SFX.bump();

        let lr=0,lw=0,hr=0,hw=0;for(const h of hits){const d=t-h.at;if(d>=-8&&d<0){if(h.who==='r')lr=6;else lw=-6;}if(d>=0&&d<10){if(h.who==='w')hr=10-d;else hw=10-d;}}
        const fin=hits[5].at+24;const gr=wWins&&t>fin?t-fin:0,gw=!wWins&&t>fin?t-fin:0;

  const enc=(MAPS[WREN_SPOTS[r][i]].enc||{}).grass||[];const top=enc.reduce((a,e)=>Math.max(a,e[2]||0),0);
  const L=i===0?Math.max(7,top+1):Math.max(8,top+2);
  let party=i===0?[...pickTeam(null,L-2,1,'wren'+r),[SPECIES[evolvedAt(wsid,L)].name,L]]:[...pickTeam(null,L-1,i+1,'wren'+r+i),[SPECIES[evolvedAt(wsid,L+1)].name,L+1]];
  let [intro,lose,win]=WREN_LINES[i];
  if(smashedTrainer('Wren'))[intro,lose,win]=[['You again. Let\'s see if you actually trained or just wandered around picking flowers.','...Okay, that was good. Don\'t let it go to your head.','Told you. Your type matchups are a mess. Come find me when you fix them.'],['Heard ByteBound\'s been on your case. Good. Let\'s make sure you can handle it.','Fine. You\'re ready. Mostly. Go wreck them.','Not good enough yet. Heal up and try again. I\'m not going anywhere.'],['Last check before the League. I\'m not going easy, so don\'t ask.','You\'re strong. Annoyingly strong. ...I\'m proud of you, okay? Never repeating that.','You\'ll get there. Rest your team. I mean it.']][i];
  await say(`Wren: ${G.name}! ${intro}`);
  const res=await startBattle({trainer:{name:'Wren',cls:'RIVAL',party,reward:i===0?10:16+i*6,lose,look:LOOK.wren},noWhiteout:i===0?1:0});
  if(res!=='win'){await say(`Wren: ${win}`);if(i===0)await healAll();}
  autosave();
}

async function postChampGift(r){
  const key='gift'+r;if(G.flags[key]||!(G.champs||[]).includes(r))return false;
  const trio=STARTERS.slice(r*3,r*3+3).filter(s=>!ownedLine(s));G.flags[key]=1;
  if(!trio.length){await say(`Professor ${PROF[r]}: You already have every ${REGIONS[r]} partner! Remarkable. Wild ones have been spotted in the tall grass too, now that you\'re Champion.`);return true;}
  await say(`Professor ${PROF[r]}: Champion! You\'ve earned something special. The ${REGIONS[r]} partners you didn\'t choose have been waiting for a good trainer.`);
  await say(`And here\'s some news: now that you\'re Champion, wild partner Wyldkin of ${REGIONS[r]} have been spotted in the tall grass. They\'re rare, so keep your eyes open!`);
  for(const s of trio){const m=makeMon(s,10);addCaught(s);if(G.party.length<6)G.party.push(m);else G.box.push(m);await say(`${G.name} received ${SPECIES[s].name}!`);}

async function legendTalk(n){

async function fishAt(){
  const enc=MAP.enc&&MAP.enc.fish;
  if(!(G.keys||[]).includes('Fishing Rod')){await say('The water is deep and blue. With a Fishing Rod, you could try fishing here.');return;}
  if(!enc||!enc.length){await say('It doesn\'t look like anything lives here.');return;}
  if(!G.party.some(m=>m.hp>0)){await say('Your Wyldkin are too tired to help reel anything in.');return;}
  await say(`${G.name} cast the line...`,{auto:40});
  if(Math.random()<.3){await say('Not even a nibble...');return;}
  await say('Oh! Something\'s biting!',{auto:30});
  const mon=rollEncounter(enc.filter(e=>e[3]>0));await startBattle({wild:mon});
}

  const r=await storyBattle({name:'Rook',cls:'MERCENARY',party:[['Nightvixen',23],['Venomamba',23],['Phantomist',24],['Shadowolf',25]],reward:60,lose:'Hah... You\'re the real deal, kid.',look:LOOK.rook});

  await say('Dr. Vasquez: Three regions. You\'ve followed me across three regions. Do you know what Project Zero is?');

  if(r==='win'){G.flags.f3='won';await say('Dr. Vasquez: The aurora relay is down. Zero will have to run on the Vault\'s own power.');

}

async function f4Event(){
  const redo=G.flags.f4==='lost';const L=lostCount();
  await say(redo?'Director Sable: Back for another try, Champion? Zero has been running for weeks. It won\'t stop for you.':'Director Sable: So this is the trainer who unraveled Tether and Undertow. Welcome to the heart of ByteBound.');
  await say('Director Sable: Every Capture Orb ever sold. Every Rest Center. Every PC. With Zero online, ByteNet becomes whole again, and it answers only to ByteBound.');
  await say('Director Sable: Since 27-Alpha, the network has had holes. Messages from nowhere. Static. A faulty process wandering free. Zero fixes all of it, permanently.');
  if(L>0)await say(`Director Sable: And thanks to you, Zero is ${L>=5?'overflowing with':L>=3?'well stocked with':'running on'} the energy we gathered along the way.`);
  const gaunt=[];
  if(G.flags.f1==='lost')gaunt.push({name:'Kade',cls:'BB SERGEANT',party:[['Shadowolf',52],['Ironfort',52],['Stormhound',53]],look:LOOK.kade});
  if(!G.flags.rookAlly)gaunt.push({name:'Rook',cls:'MERCENARY',party:[['Nightvixen',53],['Shadowolf',53],['Nightmaw',54],['Venomamba',53]],look:LOOK.rook});
  else await say('Rook: (bursting through a side door) Told you I\'d keep the guards busy! Go, kid!');
  gaunt.push({name:'Quill',cls:'CAPTAIN',party:[['Razorshark',54],['Steelhawk',54],['Tidedragon',55],['Tyrantrock',55]].concat(G.flags.c4==='lost'?[['Leviaspout',55]]:[]),look:LOOK.quill});
  if(G.flags.a4!=='won')gaunt.push({name:'Hale',cls:'COMMANDER',party:[['Gnawlord',54],['Rhinoquake',55],['Steelhawk',55],['Coilcluster',55]],look:LOOK.hale});
  const sl=58+L;gaunt.push({name:'Sable',cls:'DIRECTOR',party:[['Steeltitan',sl],['Abyssion',sl-3],['Gemshade',sl-1],['Skydragon',sl],['Ironfort',sl-1]].concat(L>=4?[['Coilcluster',sl]]:[]),look:LOOK.sable,lose:'...The network... is free?',final:1});
  for(const g of gaunt){
    if(g.final&&G.flags.f3==='won'){await say('Dr. Vasquez: (rushing in) Hold still, I\'ve got you!');await healAll(true);await say('Your team was fully healed!');}
    await say(`${g.name}: You won\'t get any further!`);
    const r=await storyBattle({name:g.name,cls:g.cls,party:g.party,reward:g.final?300:60,lose:g.lose||'Go on, then.',look:g.look});
    if(r!=='win'){G.flags.f4='lost';await say('Director Sable: It\'s over. Project Zero: ONLINE.');await say('Across all three regions, every screen flickers at once. E06. E06. E06.');
      await say('(ByteBound now controls ByteNet. The Frostfell League is still independent... Become Champion, and the resistance will help you try again.)');refreshNPCs();autosave();return;}
  }
  G.flags.f4='won';
  await say('Director Sable: Impossible... The core is failing. Zero is collapsing!');
  await say('The Polar Vault shudders. Light pours out of thousands of stored Capture Orbs as their energy returns to where it came from.');
  const back=(G.confiscated||[]).splice(0);back.forEach(m=>{healMon(m);G.box.push(m);});
  if(back.length)await say(`Inside the vault, you find ${back.map(monName).join(', ')}! Every Wyldkin ByteBound confiscated from you has been returned to your PC box.`);
  await say('Director Sable is led away by Frostfell\'s rangers. ByteBound\'s board announces a "full internal review."');
  await say('On the vault\'s last working screen, a scrambled message appears: "...RELAY CLEAR // THANK YOU //". It isn\'t signed. No one knows who sent it.');
  G.flags.zeroDown=1;refreshNPCs();autosave();
}

// =====================================================================
//  Easter-egg characters: Static, Bunny (BunnyRX) and Smashed (SmashedAtom)
//  - Their homes sit at the edges of Hearthollow whether or not the names are used.
//  - If nobody takes their name, they're out on their own adventures: find them in other towns.
//  - Each has an enemy type: Bunny hates doctors, Smashed distrusts police/military, Static distrusts IT/admins/researchers.
// =====================================================================
const DOC_RX=[/doctor|medic|surgeon|physician|nurse|dentist|clinic/i,/(^|[\s._-])(md|dr|doc)($|[\s._-])/i,/^(Dr|Doc|DR|DOC|MD)[A-Z0-9._ -]/,/[a-z0-9](MD|DR)$/,/^(dr|doc|md)$/i];
const COP_RX=[/police|cop($|[^p])|officer|sheriff|deputy|trooper|sarge|sergeant|soldier|army|marine|military|captain|colonel|general|lieutenant|guard|security|agent|swat|commander|cadet|corporal|admiral|navy|warden|marshal|detective|constable|mercenar|merc$|ranger|militia|^fbi$|^cia$/i,/(^|[\s._-])(sgt|lt|cpl|pvt|cmdr|capt|col)($|[\s._-])/i];
const IT_RX=[/admin|sysop|sudo|engineer|research|scientist|programmer|coder|developer|hacker|helpdesk|analyst|devops|techie|netops|^tech|^root$|^dev$/i,/(^|[^A-Za-z])IT([^A-Za-z]|$)|^IT[A-Z]|[a-z]IT$/];
const rxAny=(arr,n)=>typeof n==='string'&&arr.some(r=>r.test(n.trim()));
// Does this egg character hate the player because of the player's name?
function eggHates(kind){const n=G&&G.name;return kind==='bunny'?rxAny(DOC_RX,n):kind==='smashed'?rxAny(COP_RX,n):kind==='static'?rxAny(IT_RX,n):false;}
function eggKind(n){return isStatic(n)?'static':isBunny(n)?'bunny':isSmashed(n)?'smashed':null;}
// Who has this egg name? 'you', 'riv', 'pal' or null (nobody: the character is out in the world)
function eggHolder(kind){if(!G)return null;const f=FR();if(eggKind(G.name)===kind)return'you';if(eggKind(f.riv.name)===kind)return'riv';if(eggKind(f.pal.name)===kind)return'pal';return null;}
function allThreeEggs(){return['static','bunny','smashed'].every(k=>eggHolder(k));}
const EGG_NAME={static:'Static',bunny:'Bunny',smashed:'Smashed'};
function eggDisplay(kind){const h=eggHolder(kind),f=FR();return h==='you'?G.name:h==='riv'?f.riv.name:h==='pal'?f.pal.name:EGG_NAME[kind];}
// Enemy classes each one does extra damage against (as a helper)
function eggVsBonus(kind,tr){const t=((tr&&tr.cls)||'')+' '+((tr&&tr.name)||'');
  if(kind==='bunny')return /SCIENTIST|DOCTOR|DR\.|MEDIC/i.test(t);
  if(kind==='smashed')return /SECURITY|SERGEANT|MERC|COMMANDER|CAPTAIN|ENFORCER|CHIEF|LT\./i.test(t);
  if(kind==='static')return /SCIENTIST|RESEARCH|DIRECTOR|ADMIN|TECH|ENGINEER/i.test(t);return false;}
function hateLine(kind,name){return kind==='bunny'?`${name} recoils like you're holding a needle. "A doctor. Of course. Stay. Away. From. Me."`:
  kind==='smashed'?`${name}'s ears flatten. "Badge-types. Figures. I don't trust people like you, and I'm not gonna pretend I do."`:
  `${name}'s screen fills with red text. "SYSADMIN DETECTED. ...You people kept me in a box. I remember."`;}
function hateArrive(kind,name){return kind==='bunny'?`${name} shows up at the edge of the fight, arms crossed, glaring at you. She won't lift a finger for a doctor.`:
  kind==='smashed'?`${name} leans against the wall, watching. "I'm here because ByteBound's worse than you. Barely. Don't expect help."`:
  `${name} flickers into view nearby, screen dark except for a single E06. He's watching. He's not helping.`;}
// ---------- Bunny's taste: cute or creepy ----------
const CUTE_RX=/bun|pup|kit|cub|let$|puff|fluff|fuzz|bit$|pip|tot|bean|mochi|paw|purr|nib|sprout|bud|fawn|chick|mew|ling$|pom|tuft|nibble|cotton|plush|nuzz|squee|wiggle/i;
const CREEPY_RX=/shade|skull|bone|grim|gloom|hex|wraith|creep|haunt|crypt|rot|spook|fang|hollow|doll|puppet|eye|maw|mire|tomb|leech|spider|widow|grave|ghoul|phantom|specter|spectre|night|dread/i;
function cuteOrCreepy(s){return CUTE_RX.test(s.name)||CREEPY_RX.test(s.name)||s.types.some(t=>['Ghost','Dark','Poison','Fairy'].includes(t));}
function bunnyParty(party){if(party.length<2)return party;const out=party.map(p=>p.slice());
  out.forEach((p,i)=>{if(i===out.length-1)return;const sp=SPECIES[SP_BY[p[0]].id];if(cuteOrCreepy(sp))return;const t=pickTeam(null,p[1],1,'bunny'+i+p[0],{filter:cuteOrCreepy});out[i]=[t[0][0],p[1]];});return out;}
// ---------- Static's partner comes out of a computer ----------
// ---------- each of them starts with a partner that fits their story (a different one in each region) ----------
const EGG_PARTNERS={static:['Pixelon','Boltnut','Steelorb'],bunny:['Batling','Bubbun','Puppetshade'],smashed:['Cinderpup','Duskit','Ashkit']};
function eggPartnerId(kind,r){return SP_BY[EGG_PARTNERS[kind][r||0]].id;}
function staticPartnerId(r){return eggPartnerId('static',r);}
async function eggGetsPartner(kind,r,who){const n=who==='you'?G.name:who,sp=EGG_PARTNERS[kind][r||0];
  if(kind==='static'){glitchNow(30);
    await say(['The lab PC sparks. ERROR E06. Something made of pixels climbs out of the screen!','The lab PC sparks. ERROR E06. A little gear-bodied Wyldkin clanks out of the server cabinet beside it!','The lab PC sparks. ERROR E06. A floating steel orb drifts out of the monitor, humming like a cooling fan!'][r||0],{style:'dark'});
    await say(`${n}: ...Hey there. You came out of the machine for me, huh? ${sp} it is.`);return;}
  if(kind==='bunny'){
    await say(['A tiny Batling flutters out of the air vent and lands right on top of '+n+'\'s head.','A Bubbun splashes out of the lab aquarium straight into '+n+'\'s arms. '+n+' shrieks at the water... then hugs it anyway.','A Puppetshade drifts out of the professor\'s storage closet, button eyes glowing, and curls up in '+n+'\'s lap.'][r||0]);
    await say(`${n}: Oh! Hi, sweetie! Look at you, you're perfect. Mama's got you now. ${sp}, okay?`);return;}
  await say(['A Cinderpup bounds in through the open door, tail blazing, and skids to a stop at '+n+'\'s feet.','A Duskit slinks out of the shadows by the bookshelf, flames flickering on its tail, and sits beside '+n+' like it was always there.','An Ashkit trots in from the snow, steaming, and plops itself down on '+n+'\'s boots.'][r||0]);
  await say(`${n}: ...Huh. You picked me? Fine. ${sp}. You're with me now. Don't make it weird.`);}
async function staticGetsPartner(who,r){return eggGetsPartner('static',r,who);}
// ---------- edge-of-town houses ----------
const EGG_HOME={static:{map:'statshed',x:4,y:3},smashed:{map:'smashruin',x:3,y:2},bunny:{map:'bunnylab',x:6,y:6}};
const EGG_HOME_DESC={static:'the old shed on the west side of town',smashed:'what\'s left of the burned house on the east side of town',bunny:'that broken old lab on the south side of town'};
function homeSpot(){const k=G&&eggKind(G.name);return Object.assign({},k?EGG_HOME[k]:{map:'house1',x:4,y:5});}
async function eggHomeRest(kind){G.lastHeal=homeSpot();await healAll();
  await say({static:'You kick back in your chair while the rack hums. Your Wyldkin curl up by the warm vents.',smashed:'You sit by the ember for a while. Your Wyldkin settle in around its warmth.',bunny:'You pile into your blanket nest with your Wyldkin and rest for a bit.'}[kind]);
  await say('Your Wyldkin are fully healed.');}
async function eggWakeUp(){const k=eggKind(G.name);if(!k)return;
  await say({static:'You wake up at your desk again. The monitor is still on. A new email from Professor Hazel: "Come to my lab today. Bring yourself, not your server."',
    smashed:'You wake up in your corner of the burned house. Someone slid a note under the door: "Lab. Today. Please don\'t argue. -Hazel"',
    bunny:'You wake up in your blanket nest. A note is tucked into one of your plushies: "Please come by my lab today, dear. No needles, I promise. -Hazel"'}[k]);}
function lineOf(a){return a[Math.floor(Math.random()*a.length)];}
async function eggHouse(kind,spot){const h=eggHolder(kind),name=eggDisplay(kind),all=allThreeEggs();
  if(h==='you'&&G.flags.starter&&({static:'pc',smashed:'ember',bunny:'bed'})[kind]===spot){await eggHomeRest(kind);if(kind!=='bunny')return;}
  if(kind==='static'){
    if(spot==='sign')return say(h==='you'?'Your shed. Your rules. Your server.':'A hand-painted sign: "DO NOT ENTER. SERIOUSLY. -S"');
    if(spot==='rack')return say('The server rack hums. Its lights blink in a slow pattern, almost like breathing.');
    if(h==='you'){await say('Your computer. The only one in Aldera that ByteBound\'s servers can\'t see. Your old stream overlay is still open, and E06 flickers in the corner like a heartbeat.');
      if(all)await say(`A chat window pings. "${eggDisplay('bunny')}: did u eat today?? <3" ... "${eggDisplay('smashed')}: stop glitching the TV in my room."`);return;}
    if(h){await say(`A sticky note on the monitor: "Gone adventuring with ${G.name}. Don't touch the rack. -${name}"`);}
    await say(lineOf(['Code seems to be writing itself.','Weird, looks like someone is watching a stream. The chat just says E06 over and over.','A terminal types on its own: "> hello? ...is anyone out there?" Then it clears itself.','The screen shows a hologram of a floating TV, waving. Then: ERROR E06.']));
    if(!h)await say(lineOf(['A map of Aldera is open. A cursor blinks over Ferrowick.','This computer isn\'t connected to ByteBound\'s servers at all. So how is it online?']));
    if(all&&h!=='you')await say('A photo is taped to the side of the monitor: Static, Bunny and Smashed, crammed into one blurry selfie.');return;}
  if(kind==='smashed'){
    if(spot==='sign')return say('The old Emberwood house. It burned down years ago. Folks say something with wings of fire carried a little boy out of the flames.');
    if(spot==='ember')return say(h==='you'?'A single ember still glows in the ashes, years later, with nothing to burn. You know exactly what left it here.':'A single ember glows in the ashes. It\'s been burning for years with nothing to burn. Something legendary was here.');
    if(h==='you'){await say('Your family photo. The edges are scorched. You don\'t remember much from that night. Heat. Smoke. And burning wings pulling you out.');
      if(all)await say(`Tucked behind it: a doodle of a TV with a grin and a pink bunny, signed "${eggDisplay('static')} + ${eggDisplay('bunny')}". You keep it there on purpose.`);return;}
    await say('A scorched family photo. A little fox-kin boy with bright red hair grins at the camera.');
    if(h)await say(`${name} never talks about that night. Not even to you.`);else await say('A note is tucked behind it: "Gone to Emberfall. Somebody has to find the thing that saved me. -A"');
    return;}
  if(kind==='bunny'){
    if(spot==='sign')return say('WARNING: RESTRICTED AREA. Someone has covered the whole sign in pink heart stickers.');
    if(spot==='tank')return say('A shattered specimen tank. The label reads "SUBJECT RX." Pink heart stickers cover the cracks, like someone tried to make it less scary.');
    if(spot==='clip')return say('A water-damaged clipboard: "...Subject RX escaped through the vents. Sea bunny/bat splice. Do NOT approach with needles." The logo isn\'t ByteBound\'s. Some other lab, long gone.');
    if(spot==='bed'){if(h)return bunnyDiary();await say('A little nest of blankets and plushies, right in the middle of the scariest room in town.');
      return say('A note on the pillow: "Gone to the beach in Sunbask! Don\'t worry about me <3 -B"');}}
}
// ---------- the beach: swimsuits show the scars ----------
async function beachScene(){if(G.flags.beachScene)return;const b=eggHolder('bunny'),s=eggHolder('smashed'),st=eggHolder('static');if(!b&&!s&&!st)return;G.flags.beachScene=1;
  await say('The sun is out and the water is warm. Everyone changes into swimwear.');
  if(b==='you')await say('You pull on your black swimsuit and stop at the mirror. Scars everywhere, on your arms, your legs, your back. The one across your stomach looks like a closed mouth. You take a breath, grab a towel, and go anyway. Just... not near the water. Never the water.');
  else if(b)await say(`${eggDisplay('bunny')} steps out in a black swimsuit and plants herself under an umbrella, as far from the waves as she can get. She hates the water. You can't help noticing the scars: dozens of them, on her arms, legs and back. The one across her stomach looks almost like a closed mouth. She smiles softly. "Old lab stuff. They don't hurt anymore... mostly."`);
  const trunks=Math.random()<.5?'black':'red and black';
  if(s==='you')await say(`You pull on your ${trunks} swim trunks and peel off your coat. The burn scar runs the whole length of your body and stops just short of your neck. You don't hide it. Not today. Then you sprint straight into the waves.`);
  else if(s)await say(`${eggDisplay('smashed')} pulls off his coat, already in ${trunks} swim trunks. A massive burn scar runs the whole length of his body, stopping just short of his neck. He catches you looking. "Fire. I was a kid. Something with wings of flame pulled me out. ...Don't make it weird." Then he cannonballs into the water.`);
  if(st==='you')await say('You change into blue swim trunks. Water, sand, whatever. You\'re honestly fine either way. You find a shady spot and watch the waves glitch past your screen.');
  else if(st)await say(`${eggDisplay('static')} shows up in blue swim trunks, totally unbothered. "Water? Sure. Sand? Also sure." He sits down in the shade, screen flickering lazily.`);
  if(b&&s)await say(`${eggDisplay('bunny')} wraps ${eggDisplay('smashed')} in a towel the second he climbs out. "Sunscreen. Now. And dry your ears!" He grumbles, but he lets her.`);
  if(b&&st)await say(`${eggDisplay('bunny')} scoots her umbrella a little closer to ${eggDisplay('static')}'s shady spot. Then a little closer. Her face is pinker than her hair.`);}

const EGG_SPOTS={static:'ferrowick',smashed:'emberfall',bunny:'sunbask'};
function eggTeam(kind,L,seed){
  if(kind==='static')return[...pickTeam(['Electric','Steel'],L-1,2,seed),[SPECIES[evolvedAt(SP_BY.Pixelon.id,L+1)].name,L+1]];
  if(kind==='smashed')return[...pickTeam(null,L-1,2,seed,{filter:s=>s.fam!==SP_BY.Cinderpup.fam&&s.fam!==SP_BY.Pyrevix.fam}),[SPECIES[evolvedAt(SP_BY.Cinderpup.id,L)].name,L],['Pyrevix',L+1]];
  return pickTeam(null,L,4,seed,{filter:cuteOrCreepy});}
const EGG_LOOK={static:()=>STATIC_LOOK,smashed:()=>SMASHED_LOOK,bunny:()=>BUNNY_LOOK};

async function eggNpcTalk(kind){const name=EGG_NAME[kind],T=EGG_TALK[kind],hate=eggHates(kind);const fk='egg_'+kind;

  if(G.flags[fk]){await say(hate?hateLine(kind,name):lineOf(T.after));if(kind==='bunny'&&!hate)await healAll(),await say('Bunny fussed over your team until everyone was fully healed.');return;}
  if(hate)await say(hateLine(kind,name));else{await say(T.hi);await say(T.ask);}
  if(!hate&&!await yesno(`Battle ${name}?`)){await say(`${name}: Okay! Come back anytime.`);return;}
  const L=lvAt(MAP.region,MAP.prog||0)+2+(hate?5:0);
  const res=await startBattle({trainer:{name,cls:'TRAINER',party:eggTeam(kind,L,'eggnpc'+kind),reward:40,lose:hate?'...This isn\'t over.':T.lose,look:EGG_LOOK[kind]()}});
  if(res==='win'){G.flags[fk]=1;if(!hate)await say(lineOf(T.after));}}

function eggVoice(s){if(typeof s!=='string'||!G||!G.friends)return s;const m=/^(Rowan|Wren): ([\s\S]*)$/.exec(s);if(!m)return s;
  const f=FR();const kd=eggKind(m[1]==='Rowan'?f.riv.name:f.pal.name);const col=kd==='bunny'?1:kd==='smashed'?2:0;if(!col)return s;
  for(const L of EGG_VOICE_LINES){const mm=L[0].exec(m[2]);if(mm&&L[col])return m[1]+': '+L[col].replace(/\$(\d)/g,(_,i)=>mm[+i]||'');}return s;}

// =====================================================================
//  NUZLOCKE MODE (chosen when starting a new game; the rules are fixed)
//   1. A Wyldkin that faints is gone for good. It's laid to rest in the Memorial.
//   2. Only the first wild Wyldkin you meet in each area can be caught.
//      Dupes clause: a first encounter from a family you already caught doesn't count.
//   3. Every Wyldkin you get must be nicknamed.
//   4. Revives don't work.
//   5. If your whole team falls, the run is over.
//  The rules switch on after the lab battles in each region (the starter fights are safe).
// =====================================================================
function nuzOn(){return!!(G&&G.nuz);}
function nuzActive(){return!!(G&&G.nuz&&G.nuz.active&&!G.nuz.over);}
const NUZ_RULES=['A Wyldkin that faints is gone for good.','You can only catch the first wild Wyldkin you meet in each area. (If it\'s from a family you already caught, it doesn\'t count.)','You must nickname every Wyldkin you get.','Revives don\'t work.','If your whole team falls, the run is over. No second chances.'];
async function nuzRulesIntro(){for(const l of ['This is a NUZLOCKE file. The rules can\'t be changed:',...NUZ_RULES.map((t,i)=>`${i+1}. ${t}`)])await say(l,{style:'dark'});}
async function chooseMode(){
  await say('Before we begin: how do you want to play?');
  while(true){const r=await choose(['NORMAL','NUZLOCKE'],{x:150,y:H-92,w:88,prompt:'Choose a mode.'});
    if(r!==1)return false;
    for(const l of ['NUZLOCKE MODE. The rules can\'t be changed once you start:',...NUZ_RULES.map((t,i)=>`${i+1}. ${t}`)])await say(l,{style:'dark'});
    if(await yesno('Play in Nuzlocke mode?'))return true;}}
// ---------- nicknames ----------
async function nuzNickname(m){if(!nuzOn()||m.nick)return;const sp=SPECIES[m.sid].name;
  const n=await domPanel('nick',{species:sp});m.nick=n;await say(`${sp} will be known as ${n}.`);}
// Normal games: nicknames are optional
async function offerNickname(m){if(nuzOn()||m.nick)return;const sp=SPECIES[m.sid].name;if(!await yesno(`Give a nickname to ${sp}?`))return;const n=await domPanel('nick',{species:sp,optional:true});if(n){m.nick=n;await say(`${sp} will be known as ${n}.`);}}
async function nuzNickAll(){if(!nuzOn())return;for(const m of [...G.party,...G.box])if(!m.nick)await nuzNickname(m);}
// ---------- first encounter per area ----------
function famCaught(sid){const f=SPECIES[sid].fam;return G.caught.some(id=>SPECIES[id]&&SPECIES[id].fam===f);}
function nuzWildStart(mon){if(!nuzActive())return null;const a=G.nuz.areas[MAPID];
  if(a)return{catchable:false,msg:'NUZLOCKE: You already had your encounter here. No catching.'};
  if(famCaught(mon.sid))return{catchable:false,dupe:true,msg:'NUZLOCKE: You already caught this family. Dupes clause: this one doesn\'t count, so your encounter here is still open.'};
  G.nuz.areas[MAPID]='pending';return{catchable:true,msg:`NUZLOCKE: First encounter in ${friendText(MAP.name)}! This is your only chance to catch here.`};}
function nuzWildEnd(info,result){if(!info||!info.catchable)return;G.nuz.areas[MAPID]=result==='caught'?'caught':'missed';}
// ---------- deaths ----------
async function nuzAfterBattle(tr,result){if(!nuzActive())return false;
  const dead=G.party.filter(m=>m.hp<=0);
  for(const m of dead){G.party.splice(G.party.indexOf(m),1);
    G.nuz.grave.push({nick:monName(m),sid:m.sid,lvl:m.lvl,where:friendText((MAP&&MAP.name)||'?'),by:tr?`${tr.cls} ${friendText(tr.name)}`:'a wild Wyldkin',t:G.time});}
  for(const m of dead){await say(`${monName(m)} has fallen. Rest in peace, ${monName(m)}.`,{style:'dark'});}
  if(!G.party.length){await nuzGameOver();return true;}
  return false;}
async function nuzGameOver(){G.nuz.over=true;writeSave('manual');writeSave('auto');
  await new Promise(res=>{const el={full:1,bgc:'#0c0a10',t:0,update(p){this.t++;if(this.t>60&&(p.has('a')||p.has('b'))){popUI(el);res();}},
    draw(c){text(c,'THE RUN IS OVER',120,14,'#e04a5a',12,true,'center');text(c,`${G.name}'s whole team has fallen.`,120,32,'#c8c0d0',8,true,'center');
      G.nuz.grave.slice(-8).forEach((g,i)=>text(c,`${g.nick}  (${SPECIES[g.sid].name} Lv${g.lvl})`,120,50+i*11,'#a098b0',7,true,'center'));
      if(this.t>60&&Math.floor(frame/20)%2)text(c,'Press A',120,148,'#ffffff',8,true,'center');}};pushUI(el);});
  location.reload();await new Promise(()=>{});}
async function memorialScreen(){const gr=G.nuz.grave;
  if(!gr.length)return say('MEMORIAL: Nobody has fallen yet. Keep it that way.');
  let top=0;await new Promise(res=>{const el={full:1,bgc:'#14121c',update(p){if(dirP(p,'down')&&top<gr.length-6)top++;if(dirP(p,'up')&&top>0)top--;if(p.has('a')||p.has('b')){popUI(el);res();}},
    draw(c){text(c,`MEMORIAL  (${gr.length} fallen)`,120,6,'#e8d8f0',10,true,'center');
      gr.slice(top,top+6).forEach((g,i)=>{const y=22+i*22;box(c,8,y,224,20,'dark');c.drawImage(spriteOf(g.sid).front,0,0,64,64,12,y+1,18,18);
        text(c,`${g.nick}  ${SPECIES[g.sid].name} Lv${g.lvl}`,36,y+3,'#ffffff',8);text(c,`Fell at ${g.where} to ${g.by}`,36,y+12,'#a8a0b8',6);});}};pushUI(el);});}

function gameId(){if(!G.gid)G.gid=Math.random().toString(36).slice(2,10);return G.gid;}
function tsum(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h.toString(36);}
function packTrade(o){const j=JSON.stringify(o);return'WBT1-'+btoa(unescape(encodeURIComponent(j)))+'-'+tsum(j);}
function unpackTrade(code){const m=/^WBT1-([A-Za-z0-9+/=]+)-([a-z0-9]+)$/.exec((code||'').replace(/\s+/g,''));if(!m)return null;
  try{const j=decodeURIComponent(escape(atob(m[1])));if(tsum(j)!==m[2])return null;return JSON.parse(j);}catch(e){return null;}}
function cleanMon(m){if(!m||!SPECIES[m.sid])return null;const c=JSON.parse(JSON.stringify(m));c.lvl=Math.max(1,Math.min(100,c.lvl|0));
  c.moves=(c.moves||[]).filter(x=>x&&MOVES[x.id]).slice(0,4);if(!c.moves.length)return null;calcStats(c);c.hp=Math.min(Math.max(1,c.hp|0),c.stats[0]);return c;}
function receiveMon(m,from){m.ot=m.ot||from;addSeen(m.sid);addCaught(m.sid);if(G.party.length<6)G.party.push(m);else G.box.push(m);}
// Trade data moves phone-to-phone by QR code: one phone shows it, the other scans it with the camera.
// (A text version is still available as a backup, e.g. for trading over Messages.)

  const c=document.createElement('canvas');c.width=c.height=cell*(n+quiet*2);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))g.fillRect((x+quiet)*cell,(y+quiet)*cell,cell,cell);c.style.cssText='width:100%;max-width:300px;image-rendering:pixelated;display:block;margin:6px auto;border-radius:6px';return c;}

function tradePanel(title,code,note){return new Promise(res=>{const ov=document.getElementById('overlay');ov.innerHTML='';ov.style.display='flex';

  if(code){ // ---- show ----

      btn('Done',()=>close(true));btn('Text code instead',showText);};
    const showText=()=>{body.innerHTML='';row.innerHTML='';p.textContent='Send this text to your friend (Messages, AirDrop, Notes...).';const t=document.createElement('textarea');t.readOnly=true;t.value=code;body.appendChild(t);

    showQR();}

      const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);const t=decodeImageData(g.getImageData(0,0,c.width,c.height));if(!t){msg.textContent='Couldn\'t find a QR code in that photo. Try again, closer and steadier.';return;}accept(t);};img.src=URL.createObjectURL(f);};
    const scan=async()=>{body.innerHTML='';row.innerHTML='';msg.textContent='';p.textContent='Point your camera at your friend\'s QR code.';
      const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.autoplay=true;v.style.cssText='width:100%;max-width:300px;border-radius:6px;display:block;margin:6px auto;background:#000';body.appendChild(v);
      btn('Use a photo',()=>{stop();photo.click();});btn('Paste text code',paste);btn('Cancel',()=>close(null));

    scan();}
});}
async function pickToTrade(prompt){if(G.party.length<2){await say('You need at least two Wyldkin on your team to trade one away.');return null;}
  const i=await teamScreen('pick',{msg:prompt});if(i==null||i<0||!G.party[i])return null;return i;}
// Four codes keep a trade honest even with no internet:
//   OFFER (A→B)  →  REPLY (B→A)  →  CONFIRM (A→B)          … or, if A backs out:  CANCEL (A→B)
// Nobody receives anything until the other side has committed, so nothing can be duplicated.
async function tradeMenu(){
  if(nuzOn())return say('Trading is turned off in Nuzlocke runs. Every Wyldkin has to be your own.');
  gameId();
  while(true){const pend=G.tradePending,ans=G.tradeAnswer;const items=[];
    if(G.tradeJournal){const r=await choose(['NEARBY TRADE (WI-FI)','BACK'],{x:30,y:6,w:190,prompt:`A trade with ${G.tradeJournal.partnerName} is on hold. Connect with them to settle it.`});if(r===0){await nearbyTrade();continue;}return;}
    if(pend)items.push('FINISH MY OFFER','CANCEL MY OFFER');else items.push('OFFER A WYLDKIN');
    if(ans)items.push('COMPLETE MY ANSWER');else items.push('ANSWER A FRIEND\'S OFFER');
    items.push('NEARBY TRADE (WI-FI)','TRADE ON THIS PHONE','HOW IT WORKS','BACK');
    const r=await choose(items,{x:30,y:6,w:190});if(r<0)return;const it=items[r];
    if(it==='BACK')return;
    if(it==='HOW IT WORKS'){
      await say('Both players need to be at a healing center PC to trade.');await say('Stand together with your phones. 1. One of you picks OFFER A WYLDKIN and shows the QR code.');
      await say('2. The other picks ANSWER A FRIEND\'S OFFER, scans it, picks a Wyldkin to send back, and shows their reply QR.');
      await say('3. The first player picks FINISH MY OFFER and scans the reply, then shows a confirm QR.');
      await say('4. The second player picks COMPLETE MY ANSWER and scans it. Done!');
      await say('Trading far apart? Every QR screen has a text code you can send over Messages instead. If the first player cancels, their cancel code returns the other Wyldkin.');continue;}
    if(it==='OFFER A WYLDKIN'){const i=await pickToTrade('Which Wyldkin will you offer?');if(i==null)continue;const m=G.party[i];
      if(!await yesno(`Offer ${monName(m)}? It leaves your team until the trade finishes or you cancel.`))continue;
      const id=Math.random().toString(36).slice(2,10);G.party.splice(i,1);G.tradePending={id,mon:m};writeSave('manual');
      await tradePanel(`Offer code for ${monName(m)}`,packTrade({k:'offer',id,gid:G.gid,from:G.name,mon:m}),'Let your friend scan this. Then scan their reply in TRADE → FINISH MY OFFER.');continue;}
    if(it==='ANSWER A FRIEND\'S OFFER'){const o=await tradePanel('Scan your friend\'s offer');if(!o)continue;
      if(o.k!=='offer'){await say('That isn\'t an offer code.');continue;}
      if(o.gid===G.gid){await say('That\'s your own offer! Send it to a friend instead.');continue;}
      if((G.tradesDone||[]).includes(o.id)){await say('You already answered that offer.');continue;}
      const theirs=cleanMon(o.mon);if(!theirs){await say('Something is wrong with that Wyldkin\'s data. The trade can\'t happen.');continue;}
      await say(`${o.from} is offering ${monName(theirs)} (${SPECIES[theirs.sid].name}, Lv${theirs.lvl}).`);
      const i=await pickToTrade(`What will you send ${o.from} for ${monName(theirs)}?`);if(i==null)continue;const mine=G.party[i];
      if(!await yesno(`Send your ${monName(mine)} for ${o.from}'s ${monName(theirs)}? ${monName(mine)} will wait in the trade until ${o.from} confirms.`))continue;
      G.party.splice(i,1);G.tradeAnswer={id:o.id,from:o.from,theirs,mine};G.tradesDone=(G.tradesDone||[]).concat(o.id).slice(-50);writeSave('manual');
      await tradePanel('Reply code',packTrade({k:'reply',id:o.id,gid:G.gid,from:G.name,mon:mine}),`Let ${o.from} scan this. Then scan their confirm code in TRADE → COMPLETE MY ANSWER to receive ${monName(theirs)}.`);continue;}
    if(it==='FINISH MY OFFER'){const o=await tradePanel('Scan your friend\'s reply');if(!o)continue;
      if(o.k==='reply'&&(G.tradeCancelled||[]).includes(o.id)){await say('You cancelled that trade, so it can\'t be finished. Send your friend the cancel code so they get their Wyldkin back.');continue;}
      if(o.k!=='reply'||o.id!==pend.id){await say('That code doesn\'t match your current offer.');continue;}
      const theirs=cleanMon(o.mon);if(!theirs){await say('Something is wrong with that Wyldkin\'s data.');continue;}
      receiveMon(theirs,o.from);G.tradePending=null;writeSave('manual');await tradeScene(pend.mon,theirs,o.from);
      await tradePanel('Confirm code',packTrade({k:'confirm',id:pend.id,from:G.name}),`Let ${o.from} scan this so they receive ${monName(pend.mon)}.`);continue;}
    if(it==='CANCEL MY OFFER'){if(!await yesno(`Cancel the offer and take ${monName(pend.mon)} back?`))continue;
      receiveMon(pend.mon,G.name);G.tradeCancelled=(G.tradeCancelled||[]).concat(pend.id).slice(-50);const id=pend.id;G.tradePending=null;writeSave('manual');
      await say(`${monName(pend.mon)} came back to your team. This trade is blocked now, even if your friend already answered.`);
      await tradePanel('Cancel code',packTrade({k:'cancel',id,from:G.name}),'If your friend already answered, let them scan this so their Wyldkin goes back to them.');continue;}
    if(it==='COMPLETE MY ANSWER'){const o=await tradePanel(`Scan ${ans.from}'s confirm or cancel code`);if(!o)continue;
      if(o.id!==ans.id||(o.k!=='confirm'&&o.k!=='cancel')){await say('That code doesn\'t match the trade you answered.');continue;}
      G.tradeAnswer=null;
      if(o.k==='confirm'){receiveMon(ans.theirs,ans.from);writeSave('manual');await tradeScene(ans.mine,ans.theirs,ans.from);}
      else{receiveMon(ans.mine,G.name);writeSave('manual');await say(`${ans.from} cancelled the trade. ${monName(ans.mine)} came back to your team.`);}
      continue;}
    if(it==='TRADE ON THIS PHONE'){await localTrade();continue;}
    if(it==='NEARBY TRADE (WI-FI)'){await nearbyTrade();continue;}
  }
}
async function localTrade(){
  const files=[];for(let s=1;s<=NSLOTS;s++){if(s===SLOT)continue;const sv=await readSlot(s);const n=newest(sv);if(n&&!n.G.nuz&&n.G.party&&n.G.party.length)files.push({s,sv,n});}
  if(!files.length)return say('There are no other normal files on this phone to trade with.');
  const f=await choose(files.map(x=>`FILE ${x.s}  ${x.n.G.name}`).concat('BACK'),{x:40,y:20,w:170});if(f<0||f===files.length)return;const other=files[f],OG=other.n.G;
  const i=await pickToTrade(`What will you send to ${OG.name}?`);if(i==null)return;
  if(OG.party.length<2)return say(`${OG.name} needs at least two Wyldkin on their team to trade.`);
  const j=await choose(OG.party.map(m=>`${monName(m)}  Lv${m.lvl}`).concat('CANCEL'),{x:40,y:10,w:170,prompt:`Which of ${OG.name}'s Wyldkin do you want?`});if(j<0||j===OG.party.length)return;
  const mine=G.party[i],theirs=cleanMon(OG.party[j]);
  if(!await yesno(`Trade your ${monName(mine)} for ${OG.name}'s ${monName(theirs)}? Both files will be saved.`))return;
  G.party.splice(i,1);receiveMon(theirs,OG.name);OG.party.splice(j,1);const give=cleanMon(mine);give.ot=give.ot||G.name;
  if(OG.party.length<6)OG.party.push(give);else OG.box.push(give);if(!OG.caught.includes(give.sid))OG.caught.push(give.sid);if(!OG.seen.includes(give.sid))OG.seen.push(give.sid);
  const keep=G,keepSlot=SLOT;G=OG;SLOT=other.s;writeSave('manual');if(other.sv.auto)writeSave('auto');G=keep;SLOT=keepSlot;writeSave('manual');
  await tradeScene(mine,theirs,OG.name);}
